// ── CONTROL DE VERSIÓN (bloqueo total si hay versión nueva) ──
const APP_VERSION_TEC = 89; // v88: CONTRATO EN BLANCO SIN DONDE ESCRIBIR. El contrato en blanco salia con el valor mensual vacio (ni cifra ni raya) y la fecha como doble barra, porque la bandera esEnBlanco se LEIA en contrato.js pero no la ASIGNABA nadie: siempre valia false, asi que ninguno de los sitios que debian dibujar una raya lo hacia, y de paso Internet salia ya marcado. Arreglado en contrato.js, compartido con OFICINAS; contrato.js pasa a ?v=5 para que el navegador no sirva la copia vieja. v87: CONTRATOS: MISMA SALIDA EN LAS DOS APPS, Y GUARDAR AHORA PARA FIRMAR DESPUES. [1] EL DISENO NO SALIA IGUAL. OFICINAS usaba abrirParaImprimir (abre el contrato como pagina para imprimir) y TECNICOS usaba compartirPDF (genera un PDF rasterizado): mismo contenido, dos motores de salida distintos, y por eso se veian diferentes. Ahora las dos apps ofrecen LAS DOS cosas, imprimir y compartir PDF, generadas por el mismo codigo. [2] GUARDAR CON LA INFORMACION Y FIRMAR DESPUES. El caso real: el cliente manda sus datos, la oficina llena el contrato, y el tecnico lo hace firmar cuando va a la instalacion. Eso era IMPOSIBLE, y la causa era un error de concepto: TECNICOS listaba los contratos por creadoPorId, o sea solo los que el propio tecnico habia creado, asi que un contrato llenado por la oficina le era INVISIBLE. Pero el contrato pertenece a una OFICINA, no a quien lo escribio. Ahora TECNICOS lista los contratos de SUS oficinas, vengan de donde vengan, y los que faltan por firmar salen primero, que es lo que va a hacer en campo. En OFICINAS hay un boton nuevo, Guardar para firmar despues, que guarda los datos sin generar ni imprimir nada; el contrato le aparece enseguida al tecnico en su pestana de Contratos. Y desde el modulo de Contratos de OFICINAS tambien se puede firmar, por si el cliente pasa por la oficina: al firmar sube solo a Drive. Verificado en el navegador: el tecnico VE y puede firmar el contrato que llenó la oficina, sigue viendo los suyos, NO ve los de otras oficinas, y los pendientes salen primero. v86: MODULO DE CONTRATOS, CON COPIA EN GOOGLE DRIVE Y ENLACE AL CLIENTE. Menu nuevo Contratos, dentro de Comercial, que reune los contratos de las dos apps: los que hace la oficina y los que firman los tecnicos en campo. Muestra por cada uno si esta firmado, si ya tiene copia en Drive y si el cliente esta instalado, con cuatro contadores para filtrar de un clic. EL ENLACE CON EL CLIENTE ES POR CEDULA, a proposito: el tecnico firma el contrato en la instalacion, cuando el cliente todavia NO existe en el sistema. Al aparecer despues (por WispHub o a mano), el enlace se resuelve solo, sin migraciones ni trabajo manual; la busqueda ignora puntos y guiones. LA COPIA EN DRIVE reutiliza el MISMO Apps Script que ya guarda los comprobantes de pago, que ya estaba publicado y configurado. Solo sube lo FIRMADO: un contrato sin firma no es el documento definitivo. Si Drive falla o no esta configurado, el contrato NO se pierde, queda en la base y el modulo ofrece Subir a Drive por contrato o subir todos los pendientes de una vez. El archivo se nombra Contrato_numero_CCcedula_NOMBRE.pdf para poder encontrarlo en Drive sin abrirlo. Se corrigio ademas que el estado quedaba SIEMPRE en sin_firma aunque el cliente hubiera firmado, y que la firma no se guardaba. Verificado en el navegador con contratos simulados: los cuatro contadores, Ver en Drive solo en el que tiene copia, Subir a Drive solo en el firmado sin copia, falta firmar en el que no tiene firma, y la busqueda del cliente por cedula acertando con cedula real, fallando con una inventada y funcionando tambien con puntos. v85: FORMULARIO DE CONTRATO UNIFICADO, CONTRATO EN BLANCO CON LAS CONDICIONES DE LA OFICINA, Y FIRMA ANTES DE IMPRIMIR. [1] Cada app dibujaba SU propio formulario: OFICINAS con 37 campos y TECNICOS con 11. Eran dos interfaces distintas para el mismo contrato y se desincronizaban en cada cambio. Ahora el formulario se GENERA desde una tabla de campos que vive en contrato.js, asi que las dos apps son identicas POR CONSTRUCCION; comprobado en el navegador que los 37 ids coinciden uno a uno. El CSS viaja dentro de contrato.js con prefijo pvc- porque TECNICOS no tiene las clases de OFICINAS y el formulario habria salido sin estilo en el movil. [2] El contrato EN BLANCO salia con todo en cero: la funcion escribia vigencia 12 y ceros a mano, ignorando las condiciones guardadas de la oficina. Ahora sale con vigencia, costo de conexion, descuento y la lista de precios de esa oficina, y solo quedan vacios los datos del cliente. OJO: hoy NINGUNA de las cuatro oficinas tiene sus condiciones configuradas, asi que hasta que se llenen seguiran saliendo los valores por defecto. [3] La firma ahora esta DENTRO del formulario, antes del boton de generar, en las dos apps: el cliente firma y en el mismo paso sale el PDF firmado. Si no puede firmar, se avisa una vez y se puede continuar sin firma. La lectura de campos y la validacion tambien son compartidas, con la correccion del cero incluida (antes if(!totalMensual) rechazaba un 0 puesto a proposito). contrato.js pasa a ?v=3 para que el navegador no sirva la copia vieja. Verificado con 18 pruebas del modulo y en el navegador en las dos apps: mismos 37 campos, mismas 6 secciones mas la firma, el lienzo firma y detecta trazos, las condiciones de la oficina llegan al formulario y el contrato en blanco las conserva. v84: CONTRATOS COMO MENU PROPIO, Y FIRMA DESPUES DE GENERARLOS. Antes el contrato solo se podia hacer desde una orden de trabajo, y la firma era OBLIGATORIA en ese mismo momento: si el cliente no estaba, habia que rehacerlo todo. Ahora hay una pestaña Contratos donde el tecnico crea uno desde cero, sin depender de ninguna orden; el boton que colgaba de la orden se retiro. La firma pasa a ser OPCIONAL al guardar: el contrato queda como Sin firma y se firma luego con el dedo desde la misma pestaña, que lista los contratos del tecnico con su estado, el valor mensual y botones para firmar y compartir el PDF. Si el tecnico pertenece a varias oficinas elige a cual pertenece el contrato; si es una sola, se toma sola. Se corrigio ademas el MISMO fallo del cero que tenia OFICINAS: la validacion era if(!datos.totalMensual) y en JavaScript !0 es verdadero, asi que un valor mensual de 0 puesto a proposito se rechazaba igual que un campo vacio; ahora solo se bloquea un valor imposible y el cero se confirma una vez. Los contratos guardan creadoPorId para listarlos con una consulta de igualdad simple, sin indices compuestos. Verificado en el navegador: la lista distingue firmado de sin firma y solo ofrece Firmar en el que falta, el formulario abre sin orden con la oficina resuelta y el valor prellenado, el modal de firma identifica el contrato, un id inexistente avisa sin romperse, las pestañas de ordenes siguen funcionando y el buscador se oculta en Contratos. Esta nota recoge tambien v83 y v82, que subieron el numero sin anotarse (ajustes de la IA compartida). v81: FACTURA DE ENERGIA CON PDF, Y UN MENSAJE DE ERROR QUE MENTIA. Al subir un PDF, la app decia que el modelo de IA ya no estaba disponible en Groq. Era falso y mandaba a buscar el problema donde no estaba. Dos causas. [1] _enComprimirFoto convertia la foto con un Image(), que no sabe abrir un PDF: caia al onerror y enviaba el PDF CRUDO como si fuera una imagen. Ahora, si el archivo es PDF, se dibuja su primera pagina con _pdfAImagen, el mismo conversor que ya usaban los comprobantes. Las facturas de energia llegan en PDF a menudo. [2] ia.js metia los codigos 400 y 404 en el mismo saco. Comprobado contra Groq: 404 con el texto does not exist es que retiraron el modelo, pero 400 con invalid image data es que la FOTO no sirve. Ahora se distinguen leyendo el mensaje de Groq, el respaldo de modelo solo se prueba cuando de verdad falta el modelo, y el error de imagen dice que conviertas el PDF a foto. ADEMAS se blindo otra trampa descubierta probando: Groq EXIGE que la palabra json aparezca en los mensajes para aceptar respuesta en formato JSON, y si falta responde 400 con un texto que no le dice nada a nadie. Los prompts de hoy la llevan, pero basta reescribir uno sin darse cuenta para romperlo; ahora, si falta, se anade sola. Verificado con llamadas REALES a Groq: PDF mandado como imagen da tipo imagen con su consejo, modelo inexistente sigue dando tipo modelo, y un prompt sin la palabra json ya responde bien. v80: GROQ RETIRO EL MODELO DE TEXTO Y EL ASISTENTE DEJO DE RESPONDER. El 18 ago 2026 llama-3.3-70b-versatile empezo a devolver HTTP 404: el asistente contestaba No pude conectar a cualquier pregunta. Se comprobo contra la API de Groq (GET /openai/v1/models): de los 13 modelos activos, el de vision qwen3.6-27b sigue vivo (por eso los comprobantes si funcionaban) pero el de texto ya no existe. Ahora el asistente usa openai/gpt-oss-120b con qwen3.6-27b de respaldo. Y se corrigio la causa de fondo: la lista de respaldo existia SOLO para vision, asi que el texto tenia un unico modelo y al retirarlo se cayo del todo; ahora las dos listas funcionan igual y si Groq retira el primero se pasa solo al siguiente. ADEMAS, LOS MODELOS DE 2026 RAZONAN ANTES DE CONTESTAR y eso rompia dos cosas. [1] qwen devuelve su razonamiento DENTRO de la respuesta, en un bloque think, y el asistente se lo mostraba tal cual a la persona; ahora se pide ocultarlo y ademas se limpia por si algun modelo ignora la peticion. [2] Ese razonamiento gasta del MISMO presupuesto de tokens que la respuesta: medido, qwen con 200 tokens devuelve la respuesta VACIA porque el razonamiento se los comio entero, y la lectura de un comprobante pedia 500. Ahora hay un suelo de 1200 tokens, y si aun asi se queda sin margen lo dice claro en vez de devolver un comprobante sin datos. Verificado con llamadas REALES a Groq: asistente, respaldo de modelo, modelo de vision y respuesta en JSON, los cuatro responden. v79: IA: UNA SOLA FORMA DE HABLAR CON GROQ EN LAS TRES APPS. Habia SIETE llamadas a Groq repartidas por OFICINAS, TECNICOS e INVENTARIO, cada una con su propio manejo de errores y de calidad muy desigual. NINGUNA tenia tiempo limite: si Groq no respondia (se cae, se satura, el celular pierde senal a mitad) la app se quedaba girando para siempre y no habia mas salida que cerrarla y volver a abrirla. Solo UNA sabia esperar cuando Groq contesta que vas muy rapido: la carga de comprobantes por lote, que lee cuantos segundos pide, distingue el limite del minuto del limite del DIA y reintenta avisando en pantalla; las otras seis se rendian al primer intento. El respaldo por si Groq retira el modelo tambien vivia en un solo sitio. Ahora todo pasa por ia.js, cargado por las tres apps igual que contrato.js: tiempo limite (90s, 120s para lotes de fotos), reintento que respeta lo que Groq pide, deteccion del limite diario, respaldo de modelo, y errores con etiqueta para que cada pantalla muestre un mensaje entendible en vez de HTTP 429. La carga por lote conserva su logica de partir el lote cuando se excede el cupo de tokens por minuto, que ya funcionaba: solo se le anadio el tiempo limite. De aqui en adelante cualquier mejora de IA se hace en un solo archivo. Para el tecnico el cambio se nota en el asistente: si Groq tarda, ahora avisa y corta a los 90 segundos en vez de dejar el Pensando... colgado, y si Groq pide esperar lo dice en pantalla y reintenta solo. v78: MARCA DE TIEMPO NUMERICA EN LOS REGISTROS. Junto a la fecha de texto se guarda ahora fechaMs, porque toLocaleDateString() da DD/MM/AAAA y quien lo lee con new Date() lo entiende como MM/DD: rompio el archivador de bodega durante meses. El texto se conserva porque bodega lo muestra en pantalla. v77: CANTIDADES NEGATIVAS EN EQUIPO RECUPERADO. El campo de cantidad usaba parseInt(valor)||1, que NO atrapa negativos (-5 es un valor verdadero y pasa el ||1), y el min=1 del HTML no se aplica al teclear. Ese numero se SUMA al stock de la bodega al integrarlo, asi que un -5 restaba 5 unidades en silencio y quedaba registrado como entrada. Ahora se acota con Math.max(1,...). v76: CONTRATO DE SERVICIO DESDE LA APP. En una orden con cliente aparece el boton Contrato: llega prellenado con los datos de la orden (nombre partido en nombres y apellidos como propuesta editable, cedula, direccion, barrio, celular) y con las condiciones de la oficina (vigencia, valor minimo, costo de conexion). El cliente firma con el dedo ahi mismo, se guarda como un documento en oficinas_sistema y se comparte el PDF: en celular WhatsApp recibe el ARCHIVO adjunto, no un enlace. El contrato y la firma vienen de contrato.js, el mismo archivo que usa OFICINAS, asi que no hay dos copias que se desincronicen. La fecha se toma LOCAL y no en UTC: con toISOString() en Colombia el contrato salia fechado al dia siguiente despues de las 7 p.m. Incluye v75: ARREGLO PREVENTIVO DEL ESTADO 'CANCELADA'. La app escribia ese estado al cancelar una orden, pero no sabia dibujarlo: faltaba en el mapa ORDEN_ESTADOS y caia al respaldo 'pendiente'. Hoy no se notaba porque el filtro de pestanas excluye las canceladas, pero si ese filtro llegaba a cambiar, una orden cancelada por la oficina se veria como PENDIENTE y con boton de Aceptar, invitando al tecnico a reactivarla. Ahora la entrada existe y coincide con la de OFICINAS (etiqueta, icono y color), y es terminal como 'finalizada'. Sin cambios visibles hoy. Incluye v74: MENSAJE DEL DIA al iniciar sesion. Ademas del saludo, aparece una frase corta para arrancar labores, elegida segun el DIA DE LA SEMANA y estable durante toda la jornada (cambia al dia siguiente, no en cada recarga). Escritas para el trabajo de campo. Uno de cada tres dias se suma un recordatorio practico (arnes y escalera, foto del trabajo terminado, registrar material, agua y gorra, dejar la senal medida). Las frases se editan en las listas FRASES_DIA_TEC y TIPS_DIA_TEC. Incluye v73: REINTENTO AUTOMATICO CUANDO FIREBASE ESTA SATURADO. Firebase limita cuanta escritura acepta por segundo y respondia 'This database has exceeded their maximum bandwidth for writes': el error salia en rojo, la orden NO se finalizaba y el tecnico tenia que reintentar a mano (muchas veces creyendo que si habia quedado). Ahora toda operacion se reintenta sola esperando cada vez mas (1s, 2s, 4s, 8s, 16s), que es justo lo que pide Firebase, avisando en pantalla mientras tanto. Incluye v72: ENLACE POR CEDULA A PRUEBA DE FORMATO — la cedula del tecnico se escribe en dos sistemas distintos (empleados en OFICINAS y tecnicos de la cuadrilla en INVENTARIO, campo de texto libre). Un punto, espacio o guion de diferencia rompia la comparacion exacta: el tecnico veia 'no tienes cuadrilla asignada' y NO podia devolver material ni reportar consumos, sin explicacion. Ahora se comparan solo los digitos (aplica tambien a la busqueda de los equipos del cliente). Incluye v71: DEVOLUCION DE MATERIAL CORREGIDA — el material devuelto se enviaba a la bodega pero NUNCA se descontaba del stock del tecnico: quedaba contado dos veces y al integrarlo la bodega sumaba unidades que ya tenia. Ahora la devolucion descuenta de la cuadrilla en la MISMA transaccion, valida sobre datos frescos (cantidad y seriales) y marca el registro para que la bodega no lo descuente otra vez. Ademas: todas las escrituras al inventario van por TRANSACCION (antes leia y escribia en dos pasos, asi que dos tecnicos guardando a la vez se pisaban y un reporte podia desaparecer), y si el guardado falla el tecnico recibe un aviso claro de que su material NO se devolvio. // v89: EL ICONO DE LA APP AHORA SE VE EN IPHONE. Era un SVG, y iPhone NO acepta SVG como icono de aplicacion: al agregarla a la pantalla de inicio desde Safari quedaba sin icono, con una miniatura de la pagina. Justo en los telefonos, que es donde mas se usa esta app. Ahora se dibuja en PNG al abrir, con el mismo aspecto de siempre (fondo azul petroleo y la T), en los dos tamanos que pide Android en vez de uno solo. Lo encontro la prueba nueva de PRUEBAS.html que revisa que las cuatro apps se puedan ins // Actualiza un campo del inventario SIN leer (usa copia en memoria si la hay)
async function _actualizarInventarioSinLeer(campo, modifFn){
    // ════════════════════════════════════════════════════════════════
    // 🔒 v71 — AHORA POR TRANSACCIÓN.
    // EL BUG QUE RESUELVE: leía el inventario y lo escribía en dos pasos separados.
    // Si otro técnico (o la bodega) guardaba en ese intervalo, el segundo en escribir
    // BORRABA lo del primero: reportes de material que desaparecían sin dejar rastro.
    // Con transacción, si alguien más escribió mientras tanto, Firebase reintenta solo.
    // ════════════════════════════════════════════════════════════════
    const refI=db.collection('inventario').doc('datos');
    await db.runTransaction(async (tx)=>{
        const snap=await tx.get(refI);
        if(!snap.exists) throw new Error('No se encontró el inventario en la nube.');
        const data=snap.data()||{};
        const arr = Array.isArray(data[campo]) ? data[campo] : [];
        modifFn(arr, data);
        tx.update(refI, { [campo]: arr });
    });
}

let _guardandoTec = false;
function _mostrarGuardando(texto){
    _guardandoTec = true;
    let ov = document.getElementById('guardandoOverlay');
    if(!ov){
        ov = document.createElement('div');
        ov.id = 'guardandoOverlay';
        ov.style.cssText = 'position:fixed;inset:0;z-index:99999999;background:rgba(8,10,18,0.85);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;flex-direction:column;';
        document.body.appendChild(ov);
    }
    ov.innerHTML = `<div style="text-align:center;color:#fff;">
        <div style="width:54px;height:54px;border:5px solid rgba(255,255,255,0.2);border-top-color:#0ea5e9;border-radius:50%;margin:0 auto 16px;animation:spinTec 0.8s linear infinite;"></div>
        <div style="font-size:1.05rem;font-weight:700;">${texto||'Guardando...'}</div>
        <div style="font-size:0.8rem;opacity:0.7;margin-top:4px;">No cierres ni toques la pantalla</div>
    </div>
    <style>@keyframes spinTec{to{transform:rotate(360deg);}}</style>`;

function _ocultarGuardando(){

}
// Envuelve una acción de guardado: si ya hay una en curso, la ignora (evita doble clic).
async function _conBloqueo(texto, accion){
    if(_guardandoTec){ console.warn('Ya hay un guardado en curso, se ignora el clic repetido.'); return; }
    _mostrarGuardando(texto);
    try{
        await accion();
    }catch(e){
        console.error('Error en acción bloqueada:', e);
        showToast('❌ '+(e.message||e), true);
    }finally{
        _ocultarGuardando();
    }
}

// ── Init Firebase ──
function initFB(){
    try{
        firebase.initializeApp(firebaseConfig);
        db=firebase.firestore();
        // ════════════════════════════════════════════════════════════════════
        // ⏳ v73 — REINTENTO AUTOMÁTICO CUANDO FIREBASE ESTÁ SATURADO.
        // Firebase limita cuánta escritura acepta por segundo. Cuando varias oficinas y
        // técnicos guardan al tiempo —y más aún porque cada guardado reescribe un documento
        // grande— responde: "This database has exceeded their maximum bandwidth for writes,
        // please retry with exponential backoff". Antes ese error salía en rojo, la orden NO
        // se finalizaba y el técnico tenía que volver a intentar a mano (muchas veces creyendo
        // que sí había quedado). Ahora se reintenta solo, esperando cada vez un poco más
        // (1s, 2s, 4s, 8s, 16s), que es exactamente lo que pide Firebase. Solo si después de
        // varios intentos sigue saturado se avisa del error.
        // Se envuelve aquí, en un solo punto, para que TODAS las operaciones queden cubiertas.
        (function _envolverConReintento(){
            if(!db || db.__reintentoOK) return;
            db.__reintentoOK = true;
            const _esTransitorio = e => {
                const t = String((e && (e.code || e.message)) || '');
                return /bandwidth|resource[-_ ]?exhausted|unavailable|aborted|deadline|contention|quota|exceeded|too many|429|503/i.test(t);
            };
            const _conReintento = async (fn, etiqueta) => {
                const MAX = 5;
                for(let intento = 0; ; intento++){
                    try { return await fn(); }
                    catch(e){
                        if(!_esTransitorio(e) || intento >= MAX) throw e;
                        const espera = Math.min(1000 * Math.pow(2, intento), 16000) + Math.floor(Math.random()*400);
                        console.warn(`⏳ Firebase saturado (${etiqueta}): ${String((e&&(e.message||e.code))||'').substring(0,90)} — reintento ${intento+1}/${MAX} en ${Math.round(espera/1000)}s`);
                        try{ showToast(`⏳ La base está ocupada. Reintentando (${intento+1}/${MAX})… no cierres la app`); }catch(_e){}
                        await new Promise(r=>setTimeout(r, espera));
                    }
                }
            };
            window._conReintentoTec = _conReintento;
            const _txOrig = db.runTransaction.bind(db);
            db.runTransaction = fn => _conReintento(()=>_txOrig(fn), 'transacción');
        })();
        // Activar persistencia offline: guarda copia local, permite abrir con datos aunque
        // la red/cuota de Firebase falle (clave para el modo emergencia).
        try { db.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn('persistencia:',e.code)); }
        catch(e){ console.warn('persistencia no disponible:', e); }
        return true;
    }catch(e){ console.error('FB init',e); return false; }
}

async function doLogin(reanudando){
    const doc=document.getElementById('li_doc').value.trim();
    const pass=document.getElementById('li_pass').value.trim();
    const err=document.getElementById('li_err');
    const st=document.getElementById('li_status');
    err.textContent='';
    if(!doc||!pass){ err.textContent='Ingresa documento y clave.'; return; }
    st.textContent='Verificando...';
    try{
        if(!db && !initFB()){ err.textContent='No se pudo conectar.'; st.textContent=''; return; }
        const snap=await db.collection(COLECCION).doc(DOC_ID).get();
        if(!snap.exists){ err.textContent='No hay datos disponibles.'; st.textContent=''; return; }
        const data=snap.data();
        const empleados=data.rrhh_empleados||[];
        const tec=empleados.find(e=>String(e.documento||'').trim()===doc && String(e.tecnicoPass||'').trim()===pass && (e.estado||'Activo')==='Activo');
        if(!tec){ err.textContent='Documento o clave incorrectos (o no estás habilitado como técnico).'; st.textContent=''; return; }
        // Guardar sesión ligera
        TEC={ id:tec.id, nombre:tec.nombre, documento:tec.documento, oficinas:(Array.isArray(tec.oficinas)?tec.oficinas.map(String):[]) };
        try{ sessionStorage.setItem('tec_session', JSON.stringify({doc:doc, pass:pass})); }catch(e){}
        if(!reanudando) registrarSesionTec(tec.nombre); // solo registra en login manual, no al reanudar
        st.textContent='';
        enterApp();
    }catch(e){
        console.error(e); err.textContent='Error: '+(e.message||e); st.textContent='';
    }
}
window.doLogin=doLogin;

    if(_unsub){ _unsub(); }
    _unsub=db.collection(COLECCION).doc(DOC_ID).onSnapshot(snap=>{

// 💬 v74 — MENSAJE DEL DÍA para arrancar labores.
// No es una frase suelta al azar: se elige según el DÍA DE LA SEMANA (el lunes
// no se arranca igual que un viernes o un sábado) y cambia cada día, pero se
// mantiene igual durante toda la jornada — si cambiara en cada recarga se
// volvería ruido. Están escritas para el trabajo de campo de la empresa: poste,
// altura, cliente, cuadrilla. Para agregar o quitar frases basta con editar
// estas listas.
// ════════════════════════════════════════════════════════════════════
const FRASES_DIA_TEC = {
    1: [ // Lunes
        'Arranca la semana. Una orden bien hecha hoy es un cliente tranquilo toda la semana.',
        'Semana nueva, red nueva. Vamos con calma y con todo.',

    2: [ // Martes
        'Paso firme. Lo que dejaste listo ayer ya está trabajando por ti.',

        'Cada instalación bien terminada es un cliente que no vuelve a llamar.'
    ],
    3: [ // Miércoles

        'El trabajo bien hecho no se ve, se nota. Buen miércoles.',

    4: [ // Jueves

        'Hoy toca cuidar el servicio. Gracias por responder.'
    ]
};
// Recordatorios prácticos, no motivacionales: se muestran de vez en cuando.
const TIPS_DIA_TEC = [
    '🦺 Antes de subir: revisa escalera, arnés y que el poste esté firme.',
    '📸 Una foto del trabajo terminado te evita reclamos después.',
    '📦 Registra el material al terminar la orden: así tu cuadrilla siempre cuadra.',
    '💧 Lleva agua y gorra. El sol del Caquetá no perdona.',
    '📶 Deja siempre la señal medida y anotada antes de irte.'
];
function _mensajeDelDiaTec(){
    const hoy=new Date();
    const dia=hoy.getDay();
    // Semilla estable por fecha: la misma frase durante todo el día, distinta mañana
    const semilla=hoy.getFullYear()*10000 + (hoy.getMonth()+1)*100 + hoy.getDate();
    const lista=FRASES_DIA_TEC[dia]||FRASES_DIA_TEC[1];
    const frase=lista[semilla % lista.length];
    // Uno de cada tres días se muestra además un recordatorio práctico
    const tip=(semilla % 3===0) ? TIPS_DIA_TEC[semilla % TIPS_DIA_TEC.length] : '';
    return {frase, tip};
}

function _saludarTecnico(){
    const h=new Date().getHours();
    let saludo='Buenas noches', emoji='🌙';
    if(h>=5 && h<12){ saludo='Buenos días'; emoji='☀️'; }
    else if(h>=12 && h<19){ saludo='Buenas tardes'; emoji='🌤️'; }
    const primerNombre=(TEC.nombre||'').split(' ')[0];
    const {frase, tip}=_mensajeDelDiaTec();
    const ban=document.createElement('div');
    ban.style.cssText='position:fixed;top:0;left:0;right:0;z-index:100050;display:flex;justify-content:center;pointer-events:none;';
    ban.innerHTML=`<div style="margin-top:14px;background:linear-gradient(135deg,#0ea5e9,#0891b2);color:#fff;padding:13px 24px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,0.4);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:10px;animation:saludoIn 0.5s ease;max-width:92vw;text-align:center;">
        <span style="font-size:1.5rem;">${emoji}</span>
        <span>${saludo}${primerNombre?', '+primerNombre:''} 👋<br><span style="font-weight:500;font-size:0.82rem;opacity:0.95;">Bienvenido a la App de Técnicos</span>
        <span style="display:block;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,0.25);font-weight:600;font-size:0.8rem;line-height:1.35;">${frase}</span>
        ${tip?`<span style="display:block;margin-top:5px;font-weight:500;font-size:0.72rem;opacity:0.9;line-height:1.3;">${tip}</span>`:''}
        </span>
    </div>`;
    if(!document.getElementById('saludoKeyframes')){
        const st=document.createElement('style'); st.id='saludoKeyframes';
        st.textContent='@keyframes saludoIn{from{transform:translateY(-80px);opacity:0;}to{transform:translateY(0);opacity:1;}}@keyframes saludoOut{from{transform:translateY(0);opacity:1;}to{transform:translateY(-80px);opacity:0;}}';
        document.head.appendChild(st);
    }
    document.body.appendChild(ban);

    setTimeout(()=>{ ban.firstElementChild.style.animation='saludoOut 0.5s ease forwards'; setTimeout(()=>ban.remove(),500); }, tip?7000:6000);
}

function _nombresOficinas(ids){
    if(!DATA) return '';
    const idsStr=(ids||[]).map(String);
    return (DATA.oficinas||[]).filter(o=>idsStr.includes(String(o.id))).map(o=>o.nombre).join(', ');
}

// ── Órdenes que ve este técnico: las de sus oficinas ──
function _misOrdenes(){
    if(!DATA) return [];
    const misOfis=(TEC.oficinas||[]).map(String);
    const todas=DATA.ordenesTrabajo||[];
    return todas.filter(o=>{
        // de mis oficinas
        if(!misOfis.includes(String(o.oficinaId))) return false;
        // asignada a mí, o sin asignar (disponible)
        if(o.tecnicoId && String(o.tecnicoId)!==String(TEC.id)) return false;
        return true;
    });
}

// ── Avanzar estado (lee fresco y reescribe solo la orden, sin pisar lo demás) ──
async function avanzar(ordenId, nuevoEstado, notaExtra){
    if(nuevoEstado==='aceptada' && !confirm('¿Aceptar esta orden? Quedará asignada a ti.')) return;
    // Si se va a FINALIZAR una RECOGIDA, primero pedir datos del equipo recuperado
    if(nuevoEstado==='finalizada'){
        const o=(DATA.ordenesTrabajo||[]).find(x=>x.id===ordenId);
        if(o && o.tipo==='recogida'){ modalEquipoRecuperado(ordenId); return; }
        if(o && o.tipo==='cambio_equipo'){ modalCambioEquipo(ordenId); return; }
        if(o && o.tipo==='traslado'){ modalFinalizarTraslado(ordenId); return; }
        // Para cualquier otra orden, ofrecer registrar material gastado
        modalMaterialGastado(ordenId); return;
    }
    showToast('Guardando...');
    try{
        const ref=db.collection(COLECCION).doc(DOC_ID);
        const _modif=(ordenes)=>{
            const idx=ordenes.findIndex(x=>x.id===ordenId);
            if(idx<0) throw new Error('La orden ya no existe');
            const o=ordenes[idx];
            if(nuevoEstado==='aceptada'){ o.tecnicoId=TEC.id; o.tecnicoNombre=TEC.nombre; }
            o.estado=nuevoEstado;
            o.actualizada=Date.now();
            if(typeof notaExtra==='string' && notaExtra.length){ o.observacionTecnico=notaExtra; }
            if(nuevoEstado==='finalizada'){ o.finalizada=Date.now(); }
            ordenes[idx]=o;
        };
        if(MODO_EMERGENCIA){
            await _actualizarOrdenesSinLeer(_modif);
        } else {
            await db.runTransaction(async tx=>{
                const snap=await tx.get(ref);
                if(!snap.exists) throw new Error('No existe el documento');
                const data=snap.data();
                const ordenes=data.ordenesTrabajo||[];
                _modif(ordenes);
                tx.update(ref, { ordenesTrabajo: ordenes });
            });
        }
        showToast('✅ Listo');
    }catch(e){ console.error(e); showToast('❌ '+(e.message||e), true); }
}
window.avanzar=avanzar;

// Reparte el nombre completo en nombres y apellidos. Es una PROPUESTA:
// queda en campos editables porque con tres palabras o partículas se equivoca.
function _partirNombreTec(nombre){
    const p=(nombre||'').trim().split(/\s+/).filter(Boolean);
    if(!p.length)    return {nombres:'',apellidos:''};
    if(p.length===1) return {nombres:p[0],apellidos:''};
    if(p.length===2) return {nombres:p[0],apellidos:p[1]};
    if(p.length===3) return {nombres:p[0],apellidos:p.slice(1).join(' ')};
    return {nombres:p.slice(0,p.length-2).join(' '),apellidos:p.slice(-2).join(' ')};
}

// 📄 CONTRATOS (v80) — menú propio, ya no cuelga de una orden de trabajo.
// El técnico puede crear un contrato desde cero, guardarlo SIN firma y que el
// cliente firme después: antes la firma era obligatoria en el mismo momento,
// y si el cliente no estaba había que rehacerlo todo.
// ════════════════════════════════════════════════════════════════════
window._contratosTec = null;   // caché de lo consultado, para no releer en cada pintada

async function _cargarContratosTec(forzar){
    if(window._contratosTec && !forzar) return window._contratosTec;
    if(!db){ window._contratosTec=[]; return []; }
    try{
        // v87: se listan los contratos de MIS OFICINAS, no solo los que hice yo.
        // El contrato pertenece a una oficina, no a quien lo escribió: muchas veces
        // el cliente manda los datos, la oficina llena el contrato, y el técnico va
        // a hacerlo firmar. Antes esos contratos le eran INVISIBLES al técnico.
        // Consulta por igualdad simple: no necesita índice compuesto en Firestore.
        const snap=await db.collection('oficinas_sistema').where('tipo','==','contrato').get();
        const mias=((TEC&&TEC.oficinas)||[]).map(String);
        const out=[];
        snap.forEach(d=>{
            const v=d.data(); if(!v) return;
            if(!mias.includes(String(v.oficinaId||''))) return;
            out.push({id:d.id, ...v});
        });
        // Primero los que FALTA firmar: es lo que el técnico va a hacer en campo.
        out.sort((a,b)=>{
            const fa=(a.estado==='firmado')?1:0, fb=(b.estado==='firmado')?1:0;
            if(fa!==fb) return fa-fb;
            return (b.creadoEn||0)-(a.creadoEn||0);
        });
        window._contratosTec=out;
        return out;
    }catch(e){ console.warn('contratos:', e); window._contratosTec=[]; return []; }
}

// v86: sube el PDF firmado a Google Drive, igual que OFICINAS. La configuracion
// (direccion y clave del Apps Script) vive en el documento principal, que TECNICOS
// ya carga. Si Drive falla, el contrato NO se pierde: queda en la base y la oficina
// puede subirlo despues desde el modulo de Contratos.
function _driveCfgTec(){
    const c=(DATA&&DATA.config)||{};
    return { url:c.compsDriveUrl||'', clave:c.compsDriveClave||'' };
}
async function _subirContratoDriveTec(idDoc, datos, ofi){
    const cfg=_driveCfgTec();
    if(!cfg.url||!cfg.clave) throw new Error('Drive no esta configurado.');
    const r=await PV_CONTRATO.subirADrive(datos, {
        url:cfg.url, clave:cfg.clave,
        oficina:(ofi&&ofi.nombre)||'SIN_OFICINA', carpeta:'CONTRATOS'
    });
    await db.collection('oficinas_sistema').doc(idDoc).update({
        pdfUrl:r.verUrl||r.url||'', driveFileId:r.fileId||'', driveNombre:r.nombre||'', subidoEn:Date.now()
    });
    return r;
}
window._subirContratoDriveTec=_subirContratoDriveTec;
async function _guardarContratoTecnico(ordenId){
    const o = ordenId ? _ordenPorId(ordenId) : null;
    const oidSel = (document.getElementById('tc_oficina')||{}).value || '';
    const ofi = o ? _oficinaDeOrden(o)
               : (((DATA&&DATA.oficinas)||[]).find(x=>String(x.id)===String(oidSel))||null);
    const cfg=(ofi&&ofi.contratoConfig)||{};

    // v85: la MISMA lectura y la MISMA validación que OFICINAS.
    const datos=PV_CONTRATO.leerFormulario({ cfg:cfg, municipio:(ofi&&ofi.ciudad)||'' });
    const falla=PV_CONTRATO.validarFormulario(datos);
    if(falla){ showToast('⚠️ '+falla); return; }
    if(datos.totalMensual===0 && !confirm('El TOTAL MENSUAL quedará en $0.\n\n¿Es correcto?')) return;

    // La firma se hace ANTES de imprimir, dentro del mismo formulario. Si el
    // cliente no está, se guarda sin firma y se firma después desde Contratos.
    const hayFirma = !!datos.firma;
    if(!hayFirma && !confirm('El cliente todavía no ha firmado.\n\n¿Guardar el contrato SIN firma? Podrás firmarlo después desde Contratos.')) return;

    const btn=document.getElementById('tcGuardar');
    if(btn){ btn.disabled=true; btn.textContent='⏳ Guardando…'; }

    try{
        const id='contrato_'+Date.now().toString(36)+Math.random().toString(36).substring(2,7);
        await db.collection('oficinas_sistema').doc(id).set({
            tipo:'contrato',
            oficinaId:String((o&&o.oficinaId)||oidSel||''),
            clienteId:String((o&&o.clienteId)||''),
            clienteCedula:String(datos.numDoc||'').trim(),
            clienteNombre:`${datos.nombres} ${datos.apellidos}`.trim(),
            numero:datos.numero,
            datos, firma:(datos.firma||''),
            estado: hayFirma?'firmado':'sin_firma',
            ordenId:String(ordenId||''),
            creadoEn:Date.now(),
            creadoPor:(typeof TEC!=='undefined'&&TEC?TEC.nombre:'Técnico'),
            creadoPorId:String((typeof TEC!=='undefined'&&TEC&&TEC.id)||''),
            firmadoEn: hayFirma?Date.now():0
        });
        _cerrarContratoTec();
        window._contratosTec=null;   // que la lista se relea
        // A Drive solo sube lo FIRMADO: sin firma no es el documento definitivo.
        if(hayFirma){
            try{ await _subirContratoDriveTec(id, datos, ofi); showToast('☁️ Contrato subido a Drive.'); }
            catch(e){ console.warn('no subio a Drive:', e); showToast('Guardado. La copia en Drive quedo pendiente.'); }
        }
        showToast(hayFirma?'✅ Contrato guardado y firmado.':'✅ Contrato guardado (falta la firma).');
        if(_tab==='contratos' && typeof _renderContratosTec==='function') _renderContratosTec();

        const como=await PV_CONTRATO.compartirPDF(datos);
        if(como==='descarga') showToast('📄 El PDF se descargó al equipo.');
        else if(como==='archivo') showToast('📤 Contrato compartido.');
    }catch(e){
        if(btn){ btn.disabled=false; btn.textContent='✅ Guardar'; }
        alert('❌ No se pudo completar.\n\n'+(e.message||e)+'\n\nSi el contrato ya se guardó, puedes compartirlo desde el menú de Contratos.');
    }
}

async function confirmarCancelarOrden(ordenId){
    const motivo=document.getElementById('cancMotivo').value;
    const det=(document.getElementById('cancDetalle').value||'').trim();
    if(motivo==='Otro' && !det){ alert('Si el motivo es "Otro", escribe el detalle: es importante saber por qué se cancela.'); return; }
    const m=document.getElementById('modalCancel'); if(m) m.remove();
    const motivoFinal=`${motivo}${det?': '+det:''}`;
    showToast('Cancelando...');
    try{
        const ref=db.collection(COLECCION).doc(DOC_ID);
        const _modif=(ordenes)=>{
            const idx=ordenes.findIndex(x=>x.id===ordenId);
            if(idx<0) throw new Error('La orden ya no existe');
            if(ordenes[idx].estado==='finalizada') throw new Error('Esta orden ya fue FINALIZADA; no se puede cancelar.');
            if(ordenes[idx].estado==='cancelada') throw new Error('Esta orden ya estaba cancelada.');
            ordenes[idx].estado='cancelada';
            ordenes[idx].motivoCancelacion=motivoFinal;
            ordenes[idx].canceladaPor=(typeof TEC!=='undefined'&&TEC&&TEC.nombre)?TEC.nombre:'Técnico';
            ordenes[idx].canceladaEn=Date.now();
            ordenes[idx].actualizada=Date.now();
        };
        if(MODO_EMERGENCIA){
            await _actualizarOrdenesSinLeer(_modif);
        } else {
            await db.runTransaction(async tx=>{
                const snap=await tx.get(ref);
                const data=snap.data();
                const ordenes=data.ordenesTrabajo||[];
                _modif(ordenes);
                tx.update(ref, { ordenesTrabajo: ordenes });
            });
        }
        showToast('❌ Orden cancelada');
    }catch(e){ showToast('❌ '+(e.message||e), true); }
}

async function confirmarFinalizarRecogida(ordenId){
    if(_guardandoTec){ console.warn('Guardado en curso, clic ignorado.'); return; }
    const retira=document.getElementById('eqRetiro')?document.getElementById('eqRetiro').value:'no';
    const motivoRet=document.getElementById('eqMotivoRet')?document.getElementById('eqMotivoRet').value.trim():'';

    // Leer qué equipos del cliente se marcaron como recuperados (casillas)
    const equiposCliente=window._erEquiposCliente||[];
    const recuperados=[]; // los que SÍ se recuperaron
    const noDevueltos=[]; // los que NO se marcaron
    document.querySelectorAll('.erChk').forEach(chk=>{
        const idx=parseInt(chk.dataset.idx);
        const eq=equiposCliente[idx];
        if(!eq) return;
        const item={ nom:eq.nombre, cant:eq.cantidad||1, snes:(eq.snes||[]).slice() };
        if(chk.checked) recuperados.push(item);
        else noDevueltos.push(item);
    });
    // Agregar los equipos manuales (siempre cuentan como recuperados)
    (window._erManuales||[]).forEach(e=>{
        if(e.nombre && e.nombre.trim()){
            recuperados.push({ nom:e.nombre.trim(), cant:e.cant||1, snes:e.sn?[e.sn.trim()]:[] });
        }
    });

    const m=document.getElementById('modalEquipo'); if(m) m.remove();
    _mostrarGuardando('Finalizando recogida...');

    const o=(DATA.ordenesTrabajo||[]).find(x=>x.id===ordenId);
    const ofi=(DATA.oficinas||[]).find(x=>String(x.id)===String(o.oficinaId));
    const bodegaId=ofi?ofi.bodegaId:'';

    try{
        // 1) Finalizar la orden + marcar retiro si aplica (en oficinas_sistema)
        const refO=db.collection(COLECCION).doc(DOC_ID);
        const _modif = (ordenes)=>{
            const idx=ordenes.findIndex(x=>x.id===ordenId);
            if(idx<0) throw new Error('La orden ya no existe');
            ordenes[idx].estado='finalizada';
            ordenes[idx].finalizada=Date.now();
            ordenes[idx].actualizada=Date.now();
            ordenes[idx].equiposRecuperados=recuperados;
            ordenes[idx].equiposNoDevueltos=noDevueltos;
            if(retira==='si'){
                ordenes[idx].clienteRetirado=true;
                ordenes[idx].motivoRetiro=motivoRet||'Retiro por orden de trabajo';
                ordenes[idx].retiroAplicado=false; // Oficinas lo aplicará al cliente
            }
        };
        if(MODO_EMERGENCIA){
            await _actualizarOrdenesSinLeer(_modif);
        } else {
            await db.runTransaction(async tx=>{
                const snap=await tx.get(refO);
                const data=snap.data();
                const ordenes=data.ordenesTrabajo||[];
                _modif(ordenes);
                tx.update(refO, { ordenesTrabajo: ordenes });
            });
        }

        // 2) Enviar los equipos recuperados al INVENTARIO (cada uno como recuperado pendiente)
        if(recuperados.length){
            if(!bodegaId){
                showToast('⚠️ Finalizada, pero la oficina no tiene bodega vinculada. Los equipos NO se enviaron al inventario.', true);
            } else {
                const refI=db.collection('inventario').doc('datos');
                const _modifInv = (recs, data)=>{
                    const bod=(data.bodegas||[]).find(b=>String(b.id)===String(bodegaId));
                    const etiqueta=retira==='si'?'Retiro':'Recogida';
                    recuperados.forEach((it,k)=>{
                        recs.push({
                            id:(Date.now()+k).toString(),
                            bodegaId:bodegaId, bodegaNombre:bod?bod.nombre:'',
                            nom:it.nom, cant:it.cant, tipo:'usado', unidad:'unidad',
                            origen:`${etiqueta}: ${o.cliente||'cliente'}${o.cedula?' ('+o.cedula+')':''}`,
                            snes: it.snes||[],
                            fecha:new Date().toLocaleDateString(), fechaMs:Date.now(),
                            estado:'pendiente',
                            obs:`${etiqueta} por técnico ${TEC.nombre}`
                        });
                    });
                };
                if(MODO_EMERGENCIA){
                    await _actualizarInventarioSinLeer('recuperados', _modifInv);
                } else {
                    await db.runTransaction(async tx=>{
                        const snap=await tx.get(refI);
                        if(!snap.exists) throw new Error('No se encontró el inventario');
                        const data=snap.data();
                        const recs=data.recuperados||[];
                        _modifInv(recs, data);
                        tx.update(refI, { recuperados: recs });
                    });
                }
            }
        }

        const resumen=`${recuperados.length} recuperado(s)${noDevueltos.length?`, ${noDevueltos.length} no devuelto(s)`:''}`;
        showToast(retira==='si'
            ? `✅ Retiro finalizado (${resumen}). El cliente quedará Retirado.`
            : `✅ Recogida finalizada (${resumen}).`);
        _ocultarGuardando();
    }catch(e){ console.error(e); showToast('❌ '+(e.message||e), true); _ocultarGuardando(); }
}
window.confirmarFinalizarRecogida=confirmarFinalizarRecogida;

// ════════════════════════════════════════════════════════════
// FASE B — Material gastado por el técnico (de su cuadrilla)
// El técnico se enlaza a su cuadrilla por CÉDULA (TEC.documento).
// El gasto queda PENDIENTE; no descuenta stock (eso lo confirma la bodega).
// ════════════════════════════════════════════════════════════
let _cuadrillaTec=null;        // cuadrilla del inventario que corresponde al técnico
let _matElegidos=[];           // material que el técnico marca como gastado

// Busca en el inventario la cuadrilla del técnico (por cédula). Devuelve {cuad, bodega} o null.
async function _buscarCuadrillaDelTecnico(){
    try{
        const snap=await db.collection('inventario').doc('datos').get();
        if(!snap.exists) return null;
        const data=snap.data();
        const ced=String(TEC.documento||'').trim();
        if(!ced) return null;
        const cuads=data.cuadrillas||[];
        // 🔧 v72 — LA CÉDULA SE COMPARA SOLO POR SUS DÍGITOS.
        // EL BUG QUE RESUELVE: la cédula del técnico se escribe en DOS sistemas distintos
        // (empleados en OFICINAS y técnicos de la cuadrilla en INVENTARIO, donde el campo es
        // texto libre sin formato). Bastaba un punto, un espacio o un guion —"1.117.523" vs
        // "1117523"— para que la comparación exacta fallara: el técnico veía "no tienes
        // cuadrilla asignada" y NO podía devolver material ni reportar consumos, sin ninguna
        // explicación. Ahora se comparan solo los números, así el formato deja de importar.
        const _soloNum = s => String(s==null?'':s).replace(/\D/g,'');
        const cedNum = _soloNum(ced);
        const _coincide = t => { const tc=_soloNum(t&&t.cedula); return !!tc && !!cedNum && tc===cedNum; };
        // Buscar la cuadrilla que tenga un técnico con esta cédula
        const cuad=cuads.find(c=>(c.tecnicos||[]).some(_coincide))
                || cuads.find(c=>(c.tecnicos||[]).some(t=>String(t.cedula||'').trim()===ced)); // respaldo: comparación exacta de siempre
        if(!cuad) return null;
        const bodega=(data.bodegas||[]).find(b=>String(b.id)===String(cuad.bodegaId));
        return { cuad, bodega };
    }catch(e){ console.warn('buscarCuadrillaDelTecnico',e); return null; }
}

// DEVOLUCIÓN DE MATERIAL del técnico a la bodega.
// El técnico devuelve material (a veces dañado). Llega a INVENTARIO → sección
// "♻️ Recuperados" como PENDIENTE, para que el jefe de bodega decida:
// si está bueno lo integra a la bodega; si está dañado lo manda a Equipos Dañados.
// ════════════════════════════════════════════════════════════════

        <p style="font-size:0.82rem;color:var(--muted);margin-bottom:10px;">Cuadrilla: <strong>${info.cuad.nombre}</strong>. El material devuelto llega a la bodega como <strong>pendiente</strong>. El jefe de bodega decide si entra al inventario (bueno) o a equipos dañados.</p>
        ${mats.length ? `
        <label>Material a devolver</label>
        <select id="devSel" onchange="_onDevSelChange()">${opts}</select>
        <label style="margin-top:8px;">Cantidad</label>
        <input id="devCant" type="number" value="1" min="1" oninput="_onDevSelChange()">
        <div id="devSnArea" style="margin-top:8px;"></div>
        <label style="margin-top:8px;">Estado del material</label>
        <select id="devEstado">
            <option value="por_confirmar">🔵 Por confirmar (la bodega revisa)</option>
            <option value="danado">🔴 Está dañado</option>
        </select>
        <label style="margin-top:8px;">Observación (opcional)</label>
        <textarea id="devObs" rows="2" placeholder="Ej: llegó dañado del cliente, no enciende"></textarea>

            <button class="btn btn-ok btn-block" onclick="_confirmarDevolverMaterial()">📦 Devolver a bodega</button>
            <button class="btn btn-ghost" onclick="document.getElementById('modalDevol').remove()">Cancelar</button>

        ` : `<div style="background:rgba(245,158,11,0.1);border-radius:8px;padding:12px;color:#fbbf24;font-size:0.84rem;">Tu cuadrilla no tiene material para devolver.</div>
        <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="document.getElementById('modalDevol').remove()">Cerrar</button>`}`;

// ── PARCHE v2: si el material tiene SN, se ESCOGEN de la lista (no se digitan a mano) ──

            <input id="devSN" type="text" placeholder="Ej: SN123, SN456">

    } else {

            <div style="display:flex;flex-wrap:wrap;gap:6px;background:rgba(0,0,0,0.1);padding:8px;border-radius:8px;max-height:120px;overflow-y:auto;">

                <input type="checkbox" class="devSnChk" value="${sn}" style="width:auto;margin:0;"> ${sn}
            </label>`).join('')}</div>`;

}
window._onDevSelChange=_onDevSelChange;

async function _confirmarDevolverMaterial(){
    if(_guardandoTec){ console.warn('Guardado en curso, clic ignorado.'); return; }
    if(!_cuadrillaTec){ alert('No hay cuadrilla cargada.'); return; }
    const sel=document.getElementById('devSel'); if(!sel) return;
    const mats=(_cuadrillaTec.materiales||[]).filter(x=>x.cantidad>0);
    const mat=mats[parseInt(sel.value)];
    if(!mat){ alert('Selecciona un material.'); return; }
    const cant=parseInt(document.getElementById('devCant').value)||0;
    if(cant<=0){ alert('Indica una cantidad válida.'); return; }
    if(cant>mat.cantidad){ alert(`Solo tienes ${mat.cantidad} de ${mat.nombre}.`); return; }
    // PARCHE v2: si el material tiene seriales, deben marcarse exactamente "cant" casillas.
    const snesDelMat=Array.isArray(mat.snes)?mat.snes.filter(s=>s):[];
    let snes=[];
    if(snesDelMat.length>0){
        snes=Array.from(document.querySelectorAll('.devSnChk:checked')).map(c=>c.value);
        if(snes.length!==cant){ alert(`Este material tiene seriales (SN). Marca exactamente ${cant} serial(es) para los ${cant} que devuelves.\n\nMarcaste: ${snes.length}`); return; }
    } else {
        const snRaw=((document.getElementById('devSN')&&document.getElementById('devSN').value)||'').trim();
        snes=snRaw?snRaw.split(/[,\n]+/).map(s=>s.trim()).filter(Boolean):[];
    }
    const estado=document.getElementById('devEstado').value;
    const obs=(document.getElementById('devObs').value||'').trim();

    const m=document.getElementById('modalDevol'); if(m) m.remove();
    _mostrarGuardando('Devolviendo material...');
    try{
        const refI=db.collection('inventario').doc('datos');
        const bodegaId=_cuadrillaTec.bodegaId;
        const etiqueta = estado==='danado' ? '⚠️ DAÑADO' : 'Por confirmar';
        // ════════════════════════════════════════════════════════════════
        // 🔧 v71 — LA DEVOLUCIÓN AHORA SÍ DESCUENTA DE LA CUADRILLA.
        // EL BUG QUE RESUELVE: el material devuelto se agregaba a Recuperados (o a
        // Equipos Dañados) de la bodega, pero NUNCA se quitaba del stock del técnico.
        // Resultado: el mismo equipo quedaba contado DOS veces —en poder del técnico
        // y esperando en la bodega—. Al integrarlo, la bodega sumaba unidades que en
        // realidad ya tenía, y el inventario se inflaba solo.
        // Además todo va por TRANSACCIÓN sobre datos frescos: antes se leía y escribía
        // por separado, así que dos técnicos guardando a la vez se pisaban entre sí.
        // ════════════════════════════════════════════════════════════════
        await db.runTransaction(async (tx)=>{
            const snap=await tx.get(refI);
            if(!snap.exists) throw new Error('No se encontró el inventario');
            const data=snap.data();
            const bod=(data.bodegas||[]).find(b=>String(b.id)===String(bodegaId));
            const cuads=data.cuadrillas||[];
            const cuadF=cuads.find(c=>String(c.id)===String(_cuadrillaTec.id));
            if(!cuadF) throw new Error('Tu cuadrilla ya no existe en el inventario. Avísale a la bodega.');
            // 1) Verificar sobre datos FRESCOS (pudo cambiar desde que abriste la pantalla)
            const matF=(cuadF.materiales||[]).find(x=>String(x.nombre)===String(mat.nombre) && String(x.unidad||'')===String(mat.unidad||''))
                     || (cuadF.materiales||[]).find(x=>String(x.nombre)===String(mat.nombre));
            if(!matF) throw new Error(`Ya no tienes "${mat.nombre}" asignado. Actualiza la pantalla.`);
            if((matF.cantidad||0) < cant) throw new Error(`Solo tienes ${matF.cantidad||0} de "${mat.nombre}" (alguien más pudo registrar un consumo). Actualiza e intenta de nuevo.`);
            const snesF=Array.isArray(matF.snes)?matF.snes:[];
            const faltan=snes.filter(sn=>!snesF.includes(sn));
            if(faltan.length) throw new Error(`Estos seriales ya no están a tu nombre: ${faltan.join(', ')}`);
            // 2) DESCONTAR de la cuadrilla (esto es lo que faltaba)
            matF.cantidad=(matF.cantidad||0)-cant;
            if(snes.length) matF.snes=snesF.filter(sn=>!snes.includes(sn));
            // 3) Enviar a la bodega según el estado
            if(estado==='danado'){
                const danados=Array.isArray(data.equiposDanados)?data.equiposDanados:[];
                danados.push({
                    id:Date.now().toString(),
                    fecha:new Date().toLocaleDateString(), fechaMs:Date.now(),
                    fechaISO:new Date().toISOString(),
                    clienteNombre:`(Devolución técnico ${TEC.nombre})`,
                    equipoNombre:mat.nombre,
                    snDanado:snes.join(', '),
                    cantidadDanada:cant,
                    equipoNuevo:'—',
                    snNuevo:'',
                    bodegaId:bodegaId, bodegaNombre:bod?bod.nombre:'',
                    motivo:'Devolución de material dañado',
                    observaciones:obs||`Devuelto por técnico ${TEC.nombre}`,
                    origen:`Devolución técnico ${TEC.nombre}`,
                    cuadrillaId:cuadF.id, cuadrillaNombre:cuadF.nombre,
                    yaDescontadoDeCuadrilla:true   // 🔑 la bodega NO debe volver a descontar
                });
                tx.update(refI, { equiposDanados: danados, cuadrillas: cuads });
            } else {
                const recs=Array.isArray(data.recuperados)?data.recuperados:[];
                recs.push({
                    id:Date.now().toString(),
                    bodegaId:bodegaId, bodegaNombre:bod?bod.nombre:'',
                    nom:mat.nombre, cant:cant, tipo:'usado', unidad:mat.unidad||'unidad',
                    origen:`Devolución técnico ${TEC.nombre}`,
                    snes:snes,
                    fecha:new Date().toLocaleDateString(), fechaMs:Date.now(),
                    estado:'pendiente',
                    obs:obs||`Material devuelto por ${TEC.nombre} para revisión`,
                    cuadrillaId:cuadF.id, cuadrillaNombre:cuadF.nombre,
                    yaDescontadoDeCuadrilla:true   // 🔑 la bodega NO debe volver a descontar
                });
                tx.update(refI, { recuperados: recs, cuadrillas: cuads });
            }
        });
        showToast(`✅ Material devuelto (${etiqueta}). La bodega lo revisará.`);
        _cuadrillaTec=null;
        _ocultarGuardando();
    }catch(e){
        console.error(e);
        _ocultarGuardando();
        // v71: aviso claro — el técnico DEBE saber que su reporte no quedó guardado
        const _m=String(e&&e.message||e);
        const _lleno=/resource-exhausted|maximum.*size|too large|invalid-argument/i.test(_m);
        alert('❌ NO SE PUDO GUARDAR LA DEVOLUCIÓN.\n\n'
            + (_lleno ? 'La base del inventario está llena o saturada. Avísale al administrador (tiene que aligerarla desde 🩺 Auditoría).'
                      : 'Revisa tu conexión a internet e intenta de nuevo.')
            + '\n\n⚠️ El material NO se devolvió: sigue a tu nombre. Vuelve a intentarlo.\n\nDetalle: '+_m.substring(0,140));
    }
}
window._confirmarDevolverMaterial=_confirmarDevolverMaterial;

// ════════════════════════════════════════════════════════════
// FASE E — Cambio de equipo
// El técnico indica el equipo RETIRADO (bueno→Recuperados / dañado→Dañados)
// y el equipo NUEVO instalado. Todo queda pendiente para la bodega.
// ════════════════════════════════════════════════════════════
async function modalCambioEquipo(ordenId){
    const o=(DATA.ordenesTrabajo||[]).find(x=>x.id===ordenId);
    const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalCambio';
    bg.innerHTML=`<div class="modal"><h3>🔄 Cambio de equipo</h3><div class="center"><div class="spin"></div><div>Cargando datos...</div></div></div>`;
    document.body.appendChild(bg);

    // Cargar inventario de clientes (para los equipos que YA tiene el cliente) y la cuadrilla del técnico
    if(!_invCargado) await _cargarInventarioClientes();
    const cli=_buscarClienteInv(o);
    const res=await _buscarCuadrillaDelTecnico();
    _cuadrillaTec = res ? res.cuad : null;

    const m=document.getElementById('modalCambio'); if(!m) return;

    // --- Equipos que el cliente YA tiene (para el retirado) ---
    const equiposCliente=(cli&&Array.isArray(cli.equipos))?cli.equipos.filter(e=>e.nombre):[];
    const opcRetiro = equiposCliente.map((e,i)=>{
        const sn=(e.snes&&e.snes.length)?e.snes.join(', '):'sin SN';
        return `<option value="${i}">${e.nombre} — SN: ${sn}</option>`;
    }).join('') + '<option value="manual">✏️ Otro equipo (escribir manual)</option>';

    // --- Equipos disponibles en la cuadrilla (para el nuevo) ---
    const stock=_cuadrillaTec ? (_cuadrillaTec.materiales||[]).filter(x=>x.cantidad>0) : [];
    const opcNuevo = stock.map((mt,i)=>`<option value="${i}">${mt.nombre} — ${mt.cantidad} ${mt.unidad||''}</option>`).join('');

    m.querySelector('.modal').innerHTML=`<h3>🔄 Cambio de equipo</h3>
        <p style="font-size:0.82rem;color:var(--muted);margin-bottom:10px;">Cuadrilla: <strong>${_cuadrillaTec?_cuadrillaTec.nombre:'(no encontrada)'}</strong></p>

        <div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:8px;padding:10px;margin-bottom:10px;">
            <label>Equipo RETIRADO del cliente</label>
            ${equiposCliente.length
                ? `<select id="ceRetSel" onchange="_onRetiroChange()">${opcRetiro}</select>
                   <div id="ceRetManual" style="display:none;">
                       <label>Nombre del equipo</label><input id="ceRetNom" placeholder="Ej: Router, ONU">
                       <label>Serial</label><input id="ceRetSN" placeholder="SN del equipo">
                   </div>`
                : `<input id="ceRetNom" placeholder="Ej: Router, ONU">
                   <label>Serial (opcional)</label><input id="ceRetSN" placeholder="SN del equipo retirado">`}
            <label>¿En qué estado está?</label>
            <select id="ceRetEstado">
                <option value="bueno">🟢 Bueno (sirve, vuelve a bodega)</option>
                <option value="danado">🔴 Dañado (no sirve)</option>
            </select>
        </div>

        <div style="background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.25);border-radius:8px;padding:10px;margin-bottom:10px;">
            <label>Equipo NUEVO instalado (de tu cuadrilla)</label>
            ${stock.length
                ? `<select id="ceNueSel" onchange="_onNuevoChange()">${opcNuevo}</select>
                   <div id="ceNueSNWrap"></div>`
                : `<div style="background:rgba(245,158,11,0.1);border-radius:8px;padding:10px;font-size:0.82rem;color:#fbbf24;">${_cuadrillaTec?'Tu cuadrilla no tiene equipos disponibles.':'No encontramos tu cuadrilla (se busca por cédula).'}</div>`}
        </div>

        <div style="display:flex;gap:8px;">
            <button class="btn btn-ok btn-block" onclick="_finalizarCambioEquipo('${ordenId}')">✅ Finalizar cambio</button>
            <button class="btn btn-ghost" onclick="document.getElementById('modalCambio').remove()">Cancelar</button>
        </div>`;
    bg.addEventListener('click',e=>{ if(e.target===bg) bg.remove(); });

    // Guardar referencias para los handlers
    window._ceEquiposCliente=equiposCliente;
    window._ceStock=stock;
    _onNuevoChange(); // cargar SN del primer equipo nuevo
}
window.modalCambioEquipo=modalCambioEquipo;

// Cuando cambia el equipo retirado seleccionado: mostrar manual si eligió "otro"
function _onRetiroChange(){
    const sel=document.getElementById('ceRetSel');
    const man=document.getElementById('ceRetManual');
    if(!sel||!man) return;
    man.style.display = sel.value==='manual' ? 'block' : 'none';
}
window._onRetiroChange=_onRetiroChange;

// Cuando cambia el equipo nuevo: cargar su(s) SN de la cuadrilla
function _onNuevoChange(){
    const sel=document.getElementById('ceNueSel');
    const wrap=document.getElementById('ceNueSNWrap');
    if(!sel||!wrap) return;
    const stock=window._ceStock||[];
    const mat=stock[parseInt(sel.value)];
    if(!mat){ wrap.innerHTML=''; return; }
    const snes=mat.snes||[];
    if(snes.length>1){
        // Varios SN: dejar elegir cuál
        wrap.innerHTML=`<label>Serial instalado (elige cuál)</label>
            <select id="ceNueSN">${snes.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>`;
    } else if(snes.length===1){
        // Un solo SN: cargarlo automático (editable)
        wrap.innerHTML=`<label>Serial instalado</label><input id="ceNueSN" value="${snes[0]}">`;
    } else {
        // Sin SN registrado: campo libre
        wrap.innerHTML=`<label>Serial instalado (opcional)</label><input id="ceNueSN" placeholder="SN del equipo nuevo">`;
    }
}
window._onNuevoChange=_onNuevoChange;

async function _finalizarCambioEquipo(ordenId){
    if(_guardandoTec){ console.warn('Guardado en curso, clic ignorado.'); return; }
    // --- Equipo retirado ---
    let retNom='', retSN='';
    const retSel=document.getElementById('ceRetSel');
    if(retSel && retSel.value!=='manual'){
        const eq=(window._ceEquiposCliente||[])[parseInt(retSel.value)];
        if(eq){ retNom=eq.nombre; retSN=(eq.snes&&eq.snes.length)?eq.snes.join(', '):''; }
    } else {
        retNom=document.getElementById('ceRetNom')?document.getElementById('ceRetNom').value.trim():'';
        retSN=document.getElementById('ceRetSN')?document.getElementById('ceRetSN').value.trim():'';
    }
    const retEstado=document.getElementById('ceRetEstado').value;

    // --- Equipo nuevo (de la cuadrilla) ---
    const selEl=document.getElementById('ceNueSel');
    const nueSN=document.getElementById('ceNueSN')?document.getElementById('ceNueSN').value.trim():'';
    let nueNom='', equipoNuevoStock=null;
    if(selEl && _cuadrillaTec){
        const stock=(_cuadrillaTec.materiales||[]).filter(x=>x.cantidad>0);
        equipoNuevoStock=stock[parseInt(selEl.value)];
        if(equipoNuevoStock) nueNom=equipoNuevoStock.nombre;
    }

    if(!retNom && !nueNom){ alert('Indica al menos el equipo retirado o el instalado.'); return; }
    const m=document.getElementById('modalCambio'); if(m) m.remove();
    _mostrarGuardando('Finalizando cambio...');

    const o=(DATA.ordenesTrabajo||[]).find(x=>x.id===ordenId);
    const ofi=(DATA.oficinas||[]).find(x=>String(x.id)===String(o.oficinaId));
    const bodegaId=ofi?ofi.bodegaId:'';

    try{
        const refO=db.collection(COLECCION).doc(DOC_ID);
        await db.runTransaction(async tx=>{
            const snap=await tx.get(refO);
            const data=snap.data();
            const ordenes=data.ordenesTrabajo||[];
            const idx=ordenes.findIndex(x=>x.id===ordenId);
            if(idx<0) throw new Error('La orden ya no existe');
            ordenes[idx].estado='finalizada';
            ordenes[idx].finalizada=Date.now();
            ordenes[idx].actualizada=Date.now();
            ordenes[idx].cambioEquipo={ retirado:{nom:retNom,sn:retSN,estado:retEstado}, instalado:{nom:nueNom,sn:nueSN} };
            tx.update(refO, { ordenesTrabajo: ordenes });
        });

        if(bodegaId || retNom || nueNom){
            const refI=db.collection('inventario').doc('datos');
            await db.runTransaction(async tx=>{
                const snap=await tx.get(refI);
                if(!snap.exists) throw new Error('No se encontró el inventario');
                const data=snap.data();
                const bodegas=data.bodegas||[];
                const bod=bodegas.find(b=>String(b.id)===String(bodegaId));

                if(retNom && bodegaId){
                    const snes=retSN?[retSN]:[];
                    if(retEstado==='bueno'){
                        const recuperados=data.recuperados||[];
                        recuperados.push({
                            id:Date.now().toString(), bodegaId, bodegaNombre:bod?bod.nombre:'',
                            nom:retNom, cant:1, tipo:'usado', unidad:'unidad',
                            origen:`Cambio equipo: ${o.cliente||'cliente'}`,
                            snes, fecha:new Date().toLocaleDateString(), fechaMs:Date.now(),
                            estado:'pendiente', obs:`Equipo retirado (bueno) por técnico ${TEC.nombre}`
                        });
                        tx.update(refI, { recuperados });
                    } else {
                        const danados=data.equiposDanados||[];
                        danados.push({
                            id:Date.now().toString(),
                            clienteId:o.clienteId||'', clienteNombre:o.cliente||'',
                            equipoNombre:retNom, snDanado:retSN, cantidadDanada:1,
                            equipoNuevo:nueNom, snNuevo:nueSN,
                            origenNombre:bod?bod.nombre:'',
                            motivo:'Cambio por técnico', obs:`Reportado por técnico ${TEC.nombre}`,
                            fecha:new Date().toLocaleDateString(), fechaMs:Date.now(), fechaISO:new Date().toISOString(),
                            estado:'pendiente'
                        });
                        tx.update(refI, { equiposDanados: danados });
                    }
                }

                if(nueNom && _cuadrillaTec){
                    const consumos=data.consumosPendientes||[];
                    consumos.push({
                        id:(Date.now()+1).toString(),
                        cuadrillaId:_cuadrillaTec.id, cuadrillaNombre:_cuadrillaTec.nombre,
                        bodegaId:_cuadrillaTec.bodegaId,
                        tecnicoCedula:String(TEC.documento||''), tecnicoNombre:TEC.nombre,
                        destino:'cliente',
                        destinoDetalle:(o&&o.cliente?o.cliente:'')+' (cambio de equipo)',
                        clienteCedula:(o&&o.cedula)?String(o.cedula):'', // v69: para que bodega anote el material en la ficha exacta del cliente
                        clienteId:(o&&o.clienteId)?o.clienteId:'',
                        ordenId:ordenId, ordenTipo:'cambio_equipo',
                        items:[{ nombre:nueNom, cant:1, unidad:equipoNuevoStock?equipoNuevoStock.unidad||'unidad':'unidad', tipo:equipoNuevoStock?equipoNuevoStock.tipo||'':'', sn:nueSN, snes:(nueSN?[nueSN]:[]) }],
                        fecha:new Date().toLocaleDateString(), fechaMs:Date.now(), estado:'pendiente'
                    });
                    tx.update(refI, { consumosPendientes: consumos });
                }
            });
        }
        showToast('✅ Cambio finalizado. Equipo retirado y nuevo enviados al inventario (pendientes de confirmar).');
        _cuadrillaTec=null;
        _ocultarGuardando();
    }catch(e){ console.error(e); showToast('❌ '+(e.message||e), true); _ocultarGuardando(); }
}
window._finalizarCambioEquipo=_finalizarCambioEquipo;

// ════════════════════════════════════════════════════════════════
// GASTO OLVIDADO (reporte posterior): el técnico YA finalizó la orden y se le
// pasó registrar material. Lo reporta aquí SIN crear orden nueva. Cae a
// "Material por confirmar" de la bodega (marcado como reporte posterior) y
// solo se descuenta de la cuadrilla cuando la bodega lo confirma.
// Reutiliza el mismo selector de material y seriales del flujo normal.
// ════════════════════════════════════════════════════════════════
async function modalGastoPosterior(){
    const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalGastoPost';
    bg.innerHTML=`<div class="modal"><h3>🧾 Reportar gasto olvidado</h3><div class="center"><div class="spin"></div><div>Buscando tu cuadrilla...</div></div></div>`;
    document.body.appendChild(bg);

    const res=await _buscarCuadrillaDelTecnico();
    _cuadrillaTec = res ? res.cuad : null;
    _matElegidos=[];

    const m=document.getElementById('modalGastoPost'); if(!m) return;

    if(!_cuadrillaTec){
        m.querySelector('.modal').innerHTML=`<h3>🧾 Reportar gasto olvidado</h3>
            <p style="color:var(--muted);font-size:0.88rem;">No encontré tu cuadrilla en el inventario (se busca por tu cédula). Pídele a la bodega que te asocie a una cuadrilla.</p>
            <button class="btn btn-ghost btn-block" onclick="document.getElementById('modalGastoPost').remove()">Cerrar</button>`;
        return;
    }

    const mats=(_cuadrillaTec.materiales||[]).filter(x=>x.cantidad>0);
    const opts=mats.map((mt,i)=>`<option value="${i}">${mt.nombre} — disponible: ${mt.cantidad} ${mt.unidad||''}</option>`).join('');

    // Mis órdenes FINALIZADAS recientes, para indicar a cuál correspondía el gasto
    const finalizadas=(DATA.ordenesTrabajo||[])
        .filter(o=>o.estado==='finalizada' && String(o.tecnicoId||'')===String(TEC.id))
        .sort((a,b)=>(b.finalizada||0)-(a.finalizada||0))
        .slice(0,15);
    const optsOrd=finalizadas.map(o=>{
        const t=ORDEN_TIPOS[o.tipo]||{label:o.tipo||'Orden',icon:'🔧'};
        const f=o.finalizada?new Date(o.finalizada).toLocaleDateString():'';
        return `<option value="${o.id}">${t.icon} ${o.cliente||'Sin cliente'} · ${t.label}${f?' · '+f:''}</option>`;
    }).join('');

    m.querySelector('.modal').innerHTML=`<h3>🧾 Reportar gasto olvidado</h3>
        <div style="background:rgba(14,165,233,0.1);border:1px solid rgba(14,165,233,0.3);border-radius:8px;padding:10px;font-size:0.8rem;margin-bottom:10px;">
            Para cuando <strong>ya finalizaste</strong> una orden y se te pasó registrar material. No crea una orden nueva: el material queda <strong>pendiente</strong> y se descuenta de tu cuadrilla solo cuando la bodega lo confirme.
        </div>
        <label>¿Para qué fue el material?</label>
        <select id="gpDestino" onchange="document.getElementById('gpClienteZona').style.display=(this.value==='cliente'&&document.getElementById('gpOrden').value==='')?'block':'none'">
            <option value="cliente" selected>👤 Cliente</option>
            <option value="red">🌐 Mantenimiento de red</option>
        </select>
        <label style="margin-top:8px;">¿A qué orden finalizada corresponde?</label>
        <select id="gpOrden" onchange="document.getElementById('gpClienteZona').style.display=(this.value===''&&document.getElementById('gpDestino').value==='cliente')?'block':'none'">
            ${optsOrd}
            <option value="" ${finalizadas.length?'':'selected'}>— Otra / sin orden en la lista —</option>
        </select>
        <div id="gpClienteZona" style="display:${finalizadas.length?'none':'block'};">
            <label style="margin-top:8px;">Nombre del cliente</label>
            <input id="gpCliente" type="text" placeholder="Ej: Juan Pérez">
        </div>
        ${mats.length?`
        <label style="margin-top:8px;">Agregar material usado</label>
        <div style="display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;">
            <div style="flex:1;min-width:120px;"><select id="matSel" onchange="_onMatSelChange()">${opts}</select></div>
            <div style="width:80px;"><input id="matCant" type="number" value="1" min="1" onchange="_onMatSelChange()"></div>
            <button class="btn btn-sm" style="background:#0ea5e9;color:#fff;" onclick="_agregarMaterial()">➕</button>
        </div>
        <div id="matSnArea" style="margin-top:6px;"></div>
        <div id="matLista" style="margin-top:10px;"></div>
        `:`<div style="background:rgba(245,158,11,0.1);border-radius:8px;padding:10px;font-size:0.82rem;color:#fbbf24;margin-top:8px;">Tu cuadrilla no tiene material disponible para registrar.</div>`}
        <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="btn btn-ok btn-block" onclick="_confirmarGastoPosterior()">📨 Enviar a bodega</button>
            <button class="btn btn-ghost" onclick="document.getElementById('modalGastoPost').remove()">Cancelar</button>
        </div>`;
    setTimeout(()=>{ try{ _onMatSelChange(); }catch(e){} }, 100);
}
window.modalGastoPosterior=modalGastoPosterior;

async function _confirmarGastoPosterior(){
    if(_guardandoTec){ console.warn('Guardado en curso, clic ignorado.'); return; }
    if(!_cuadrillaTec){ alert('No se encontró tu cuadrilla.'); return; }
    if(!_matElegidos.length){ alert('Agrega al menos un material con el botón ➕ antes de enviar.'); return; }

    const destino=document.getElementById('gpDestino')?document.getElementById('gpDestino').value:'cliente';
    const ordenId=document.getElementById('gpOrden')?document.getElementById('gpOrden').value:'';
    const orden=ordenId?(DATA.ordenesTrabajo||[]).find(x=>x.id===ordenId):null;
    let destinoDetalle='';
    if(destino==='red'){ destinoDetalle='Mantenimiento de red'; }
    else if(orden){ destinoDetalle=orden.cliente||((ORDEN_TIPOS[orden.tipo]||{}).label||'Orden finalizada'); }
    else {
        destinoDetalle=(document.getElementById('gpCliente')?document.getElementById('gpCliente').value:'').trim();
        if(!destinoDetalle){ alert('Escribe el nombre del cliente o elige la orden a la que corresponde.'); return; }
    }

    const m=document.getElementById('modalGastoPost'); if(m) m.remove();
    _mostrarGuardando('Enviando a bodega...');
    try{
        const refI=db.collection('inventario').doc('datos');
        await db.runTransaction(async tx=>{
            const snap=await tx.get(refI);
            if(!snap.exists) throw new Error('No se encontró el inventario');
            const data=snap.data();
            const consumos=data.consumosPendientes||[];
            consumos.push({
                id:Date.now().toString(),
                cuadrillaId:_cuadrillaTec.id,
                cuadrillaNombre:_cuadrillaTec.nombre,
                bodegaId:_cuadrillaTec.bodegaId,
                tecnicoCedula:String(TEC.documento||''),
                tecnicoNombre:TEC.nombre,
                destino:destino,
                destinoDetalle:destinoDetalle,
                clienteCedula:(destino==='cliente'&&orden&&orden.cedula)?String(orden.cedula):'', // v69: cédula del cliente si vino de una orden
                clienteId:(destino==='cliente'&&orden&&orden.clienteId)?orden.clienteId:'',
                ordenId:ordenId||'',
                ordenTipo:orden?orden.tipo:'',
                reportePosterior:true,
                items:[..._matElegidos],
                fecha:new Date().toLocaleDateString(), fechaMs:Date.now(),
                estado:'pendiente'
            });
            tx.update(refI, { consumosPendientes: consumos });
        });
        showToast('✅ Reporte enviado. La bodega debe confirmarlo para que se descuente de tu cuadrilla.');
        _matElegidos=[]; _cuadrillaTec=null;
        _ocultarGuardando();
    }catch(e){ console.error(e); showToast('❌ '+(e.message||e), true); _ocultarGuardando(); }
}

function _onMatSelChange(){
    const sel=document.getElementById('matSel'); const cantEl=document.getElementById('matCant');
    const area=document.getElementById('matSnArea');
    if(!sel||!cantEl||!area) return;
    const idx=parseInt(sel.value);
    const mat=(_cuadrillaTec.materiales||[]).filter(x=>x.cantidad>0)[idx];
    if(!mat){ area.innerHTML=''; return; }
    const snes = Array.isArray(mat.snes) ? mat.snes.filter(s=>s) : [];
    let cant=parseInt(cantEl.value)||1;
    // SN ya usados en _matElegidos para este material (no permitir repetir)
    const yaUsados = new Set();
    _matElegidos.filter(e=>e.nombre===mat.nombre).forEach(e=>{ (e.snes||[]).forEach(s=>yaUsados.add(s)); });
    const disponibles = snes.filter(s=>!yaUsados.has(s));

    if(snes.length === 0){
        area.innerHTML = `<p style="font-size:0.75rem;color:var(--muted);">Este material no tiene seriales (SN).</p>`;
    } else if(disponibles.length === 0){
        area.innerHTML = `<p style="font-size:0.78rem;color:#f59e0b;">Ya agregaste todos los seriales disponibles.</p>`;
    } else {
        const html = `<label style="font-size:0.78rem;margin-top:4px;">Seleccionar serial(es) — necesitas <strong>${cant}</strong>:</label>
            <div style="display:flex;flex-wrap:wrap;gap:6px;background:rgba(0,0,0,0.1);padding:8px;border-radius:8px;max-height:120px;overflow-y:auto;">
            ${disponibles.map(sn=>`<label style="display:flex;align-items:center;gap:4px;font-size:0.78rem;background:rgba(255,255,255,0.05);padding:4px 8px;border-radius:6px;cursor:pointer;">
                <input type="checkbox" class="matSnChk" value="${sn}" style="margin:0;"> ${sn}
            </label>`).join('')}</div>`;
        area.innerHTML = html;
    }
}

function _agregarMaterial(){
    const sel=document.getElementById('matSel'); const cantEl=document.getElementById('matCant');
    if(!sel||!cantEl) return;
    const idx=parseInt(sel.value);
    const mat=(_cuadrillaTec.materiales||[]).filter(x=>x.cantidad>0)[idx];
    if(!mat) return;
    let cant=parseInt(cantEl.value)||1;
    if(cant<1) cant=1;
    // No permitir pasarse del stock de la cuadrilla (sumando lo ya agregado de ese material)
    const yaAgregado=_matElegidos.filter(e=>e.nombre===mat.nombre).reduce((s,e)=>s+e.cant,0);
    if(yaAgregado+cant>mat.cantidad){
        alert(`No puedes registrar más de lo que tu cuadrilla tiene.\n\n${mat.nombre}: disponible ${mat.cantidad}, ya agregaste ${yaAgregado}.`);
        return;
    }
    // Capturar SN seleccionados (si hay)
    const snesElegidos = Array.from(document.querySelectorAll('.matSnChk:checked')).map(c=>c.value);
    const snesDelMat = Array.isArray(mat.snes) ? mat.snes.filter(s=>s) : [];
    if(snesDelMat.length > 0){
        if(snesElegidos.length !== cant){
            alert(`Este material tiene seriales (SN). Debes marcar exactamente ${cant} serial(es) para los ${cant} que vas a gastar.\n\nMarcaste: ${snesElegidos.length}`);
            return;
        }
    }
    _matElegidos.push({ nombre:mat.nombre, cant:cant, unidad:mat.unidad||'', tipo:mat.tipo||'', snes:snesElegidos });
    cantEl.value=1;
    _renderMatLista();
    _onMatSelChange(); // refrescar SN disponibles
}
window._agregarMaterial=_agregarMaterial;
