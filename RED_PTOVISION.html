        <div class="opc" data-q="vista" onclick="elegirExp('vista')" style="text-align:left;padding:12px">
          <b>Lo que se ve en pantalla</b><br><span style="font-weight:400;color:var(--muted);font-size:.72rem">
          solo el pedazo del mapa que tienes a la vista</span></div>
      </div>
      <p class="ayuda" style="margin-top:12px">Las cajas van pintadas por ocupación, igual que aquí:
        verde con espacio, amarillo casi llena, rojo llena. Cada una lleva sus clientes y su puerto
        en la descripción.</p>`,
      `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cancelar</button>
       <button class="btn btn-sm btn-primary" style="width:auto" onclick="generarKML()">Generar archivo</button>`);
}
function elegirExp(q){
    window._expQue=q;
    document.querySelectorAll('.rejilla .opc').forEach(o=>o.classList.toggle('on',o.dataset.q===q));
}

function generarKML(){
    const que=window._expQue||'todo';
    cerrarModal();
    const esc2=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // KML usa el color al reves que la web: aabbggrr
    const colorKML=h=>{ h=h.replace('#',''); return 'ff'+h.slice(4,6)+h.slice(2,4)+h.slice(0,2); };

    let lista=RED.elementos;
    if(que==='cajas')  lista=lista.filter(e=>e.tipo==='caja');
    if(que==='libres') lista=lista.filter(e=>e.tipo==='caja'&&e.clase!=='pop'&&estadoCaja(e).libres>0);
    if(que==='vista'&&mapa){
        const b=mapa.getBounds();
        lista=lista.filter(e=>e.g.some(p=>b.contains(L.latLng(p[0],p[1]))));
    }
    if(!lista.length) return alert('No hay nada que exportar con esa opción.');

    // Iconos de Google: pines de color segun la ocupacion. Asi en Google Earth
    // se ve DONDE HAY CUPO sin abrir una sola ficha, que es el punto.
    const PIN={verde:'grn-blank', ambar:'ylw-blank', rojo:'red-blank', gris:'wht-blank',
               mufla:'orange-blank', pop:'purple-stars', poste:'wht-blank', cliente:'ltblu-blank', reserva:'ylw-blank'};
    const icono=n=>`http://maps.google.com/mapfiles/kml/paddle/${n}.png`;
    let estilos='';
    Object.entries(PIN).forEach(([k,v])=>{
        estilos+=`<Style id="p_${k}"><IconStyle><scale>${k==='poste'||k==='cliente'?0.5:0.9}</scale>`
               + `<Icon><href>${icono(v)}</href></Icon></IconStyle>`
               + `<LabelStyle><scale>${k==='poste'||k==='cliente'?0:0.8}</scale></LabelStyle></Style>\n`;
    });
    ['primario','secundario','terciario','drop'].forEach(t=>{
        estilos+=`<Style id="l_${t}"><LineStyle><color>${colorKML(TIPOS[t].color)}</color>`
               + `<width>${TIPOS[t].w}</width></LineStyle><LabelStyle><scale>0</scale></LabelStyle></Style>\n`;
    });

    const estiloDe=el=>{
        if(el.tipo==='cable') return 'l_'+el.clase;
        if(el.tipo==='caja'){
            if(el.clase==='pop')   return 'p_pop';
            if(el.clase==='mufla') return 'p_mufla';
            const s=estadoCaja(el);
            return s.color==='#10b981'?'p_verde' : s.color==='#f59e0b'?'p_ambar'
                 : s.color==='#ef4444'?'p_rojo' : 'p_gris';
        }
        return 'p_'+el.tipo;
    };

    const carpetas={};
    lista.forEach(el=>{
        let nom=(TIPOS[claseDe(el)]||{}).et||el.tipo;
        // Las cajas se agrupan por ocupacion, no por tipo: asi en Google Earth
        // se puede apagar "llenas" y quedarse solo con donde se puede vender.
        if(el.tipo==='caja'&&el.clase!=='pop'&&el.clase!=='mufla'){
            const s=estadoCaja(el);
            nom = s.libres===null ? 'Cajas · sin capacidad'
                : s.libres===0    ? 'Cajas · LLENAS'
                : s.libres<=s.cap*0.25 ? 'Cajas · casi llenas'
                : 'Cajas · CON ESPACIO';
        }
        (carpetas[nom]=carpetas[nom]||[]).push(el);
    });

    const orden=['Cajas · CON ESPACIO','Cajas · casi llenas','Cajas · LLENAS','Cajas · sin capacidad','Muflas','POP'];
    const claves=Object.keys(carpetas).sort((a,b)=>{
        const ia=orden.indexOf(a), ib=orden.indexOf(b);
        return (ia<0?99:ia)-(ib<0?99:ib);
    });

    let cuerpo='';
    claves.forEach(nom=>{
        const els=carpetas[nom];
        cuerpo+=`<Folder><name>${esc2(nom)} (${els.length})</name>\n`;
        els.forEach(el=>{
            let d='';
            if(el.subtipo) d+='Tipo: '+el.subtipo+'\n';
            if(el.estado)  d+='Estado: '+el.estado+'\n';
            if(el.tipo==='caja'&&el.clase!=='pop'){
                const s=estadoCaja(el);
                d+=`\n► PUERTOS LIBRES: ${s.cap?s.libres:'sin capacidad definida'}\n`
                 + `Capacidad: ${s.cap||'?'}   Ocupados: ${s.usados}\n`;
                if((el.splitters||[]).length)
                    d+='Splitters: '+el.splitters.map(x=>x.tipo+(x.ratio?' ('+x.ratio+')':'')).join(', ')+'\n';
                const cl=Object.keys(el.puertos||{}).sort((a,b)=>a-b)
                        .map(n=>`   Pto ${n}: ${el.puertos[n].cliente||'—'}`);
                if(cl.length) d+='\nClientes conectados:\n'+cl.join('\n')+'\n';
            }
            if(el.tipo==='cable') d+=`Hilos: ${el.hilos||'?'}   Buffers: ${el.buffers||'?'}\nLongitud: ${el.metros||'?'} m\n`;
            if(el.tipo==='reserva') d+=`Reserva de ${el.metros||'?'} m\nCable: ${el.cable||'—'}\n`;
            if(el.tipo==='cliente'&&el.caja) d+=`Caja: ${el.caja}\nPuerto: ${el.puerto||'?'}\n`;
            if(el.notas) d+='\nNotas: '+el.notas+'\n';
            // El nombre visible lleva los libres delante: se leen sin abrir nada
            let rot=el.nombreReal||el.nombre||'';
            if(el.tipo==='caja'&&el.clase!=='pop'&&el.clase!=='mufla'){
                const s=estadoCaja(el);
                if(s.cap) rot=`[${s.libres} libres] ${rot}`;
            }
            const geo = el.g.length>1
                ? `<LineString><tessellate>1</tessellate><coordinates>${el.g.map(p=>p[1]+','+p[0]+',0').join(' ')}</coordinates></LineString>`
                : `<Point><coordinates>${el.g[0][1]},${el.g[0][0]},0</coordinates></Point>`;
            cuerpo+=`<Placemark><name>${esc2(rot)}</name>`
                  + `<description><![CDATA[<pre>${esc2(d)}</pre>]]></description>`
                  + `<styleUrl>#${estiloDe(el)}</styleUrl>${geo}</Placemark>\n`;
        });
        cuerpo+='</Folder>\n';
    });

    const etq={todo:'completa', cajas:'solo cajas', libres:'con cupo', vista:'vista actual'}[que];
    const kml=`<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>RED ${esc2(SEDE.nombre)} — ${etq} — ${new Date().toLocaleDateString('es-CO')}</name>
<description>${lista.length} elementos. Generado desde el módulo de Red de PROYECTOVISION.</description>
${estilos}${cuerpo}</Document></kml>`;
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([kml],{type:'application/vnd.google-earth.kml+xml'}));
    a.download=`RED_${SEDE.nombre.replace(/\s+/g,'_')}_${que}_${new Date().toISOString().slice(0,10)}.kml`;
    a.click();
    setTimeout(()=>alert(`✅ Archivo listo — ${lista.length.toLocaleString('es-CO')} elementos.\n\n`
        +`Ábrelo con doble clic y se abre en Google Earth.\n\n`
        +`• Las cajas están agrupadas por ocupación: puedes apagar las llenas\n`
        +`  y quedarte solo con donde hay cupo.\n`
        +`• Cada caja muestra sus puertos libres en el propio nombre.\n\n`
        +`Ojo: lo que cambies allá NO vuelve aquí. Google Earth es para mirar;\n`
        +`para editar y llevar la red, esta app.`),300);
}

function cargarScript(src){
    return new Promise((ok,mal)=>{
        if([...document.scripts].some(s=>s.src===src)) return ok();
        const s=document.createElement('script'); s.src=src;
        s.onload=()=>ok(); s.onerror=()=>mal(new Error('No se pudo cargar '+src));
        document.head.appendChild(s);
    });
}

// Lee el KML manteniendo la RUTA de carpetas, que es lo que dice de qué
// tipo es cada elemento.
function leerKML(xml){
    const marcas=[]; const re=/<(\/?)(Folder|Placemark)\b[^>]*>/g; let m;
    while((m=re.exec(xml))) marcas.push({cierra:m[1]==='/', tag:m[2], i:m.index, fin:re.lastIndex});
    const uno=(f,t)=>{ const r=new RegExp('<'+t+'\\s*>([\\s\\S]*?)<\\/'+t+'>'); const x=f.match(r); return x?x[1]:''; };
    const out=[]; let pila=[];
    for(let k=0;k<marcas.length;k++){
        const a=marcas[k];
        if(a.tag==='Folder'){
            if(a.cierra) pila.pop();
            else { const s=marcas[k+1];
                   pila.push((uno(xml.slice(a.fin, s?s.i:a.fin+400),'name')||'?').trim()); }
            continue;
        }
        if(a.tag!=='Placemark'||a.cierra) continue;
        let j=k+1,p=1;
        while(j<marcas.length&&p>0){ if(marcas[j].tag==='Placemark') p+=marcas[j].cierra?-1:1; j++; }
        const frag=xml.slice(a.fin, marcas[j-1]?marcas[j-1].i:xml.length);
        const coords=(uno(frag,'coordinates')||'').trim();
        if(!coords) continue;
        const g=coords.split(/\s+/).filter(Boolean).map(t=>{
            const q=t.split(','); return [parseFloat(q[1]), parseFloat(q[0])];
        }).filter(q=>!isNaN(q[0])&&!isNaN(q[1]));
        if(!g.length) continue;
        const desc=(uno(frag,'description')||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
        out.push(armar({
            ruta:pila.join('/'),
            nombre:(uno(frag,'name')||'').trim(),
            desc, g,
            esLinea:/<LineString/.test(frag)
        }));
    }
    return out.filter(Boolean);
}

// Del "Tipo: FIBRA 48H 6B" saca 48 hilos y 6 buffers. Hay que normalizar
// porque en el mismo archivo conviven "FIBRA 48H4B", "FIBRA 48H 4B",
// "FIBRA 96-H 8-B FLORENCIA" y "FIBRA 12 HILOS - UNICO BUFER".
function hilosDe(t){
    const s=(t||'').toUpperCase();
    // Sin \b despues de la H: en el archivo real viene "FIBRA 48H4B", con el
    // buffer pegado al hilo, y exigir limite de palabra ahi lo dejaba sin leer.
    const h=s.match(/(\d+)\s*-?\s*H(?:ILOS?)?(?![A-Z])/);
    let b=s.match(/(\d+)\s*-?\s*B(?:UFF?ER)?(?![A-Z])/);
    let buf=b?+b[1]:null;
    if(!buf && /UNICO\s+BUF/.test(s)) buf=1;
    const hil=h?+h[1]:null;
    if(!buf && hil===1) buf=1;          // un drop de un hilo no tiene buffer aparte
    return {hilos:hil, buffers:buf};
}
// Un splitter real no pasa de 1x64. Sirve para no creerle a un dato malo.
const MAX_PUERTOS=64;
function capacidadDe(t){ const m=(t||'').match(/(\d+)\s*[xX]\s*(\d+)/); return m?+m[2]:null; }
function campo(desc,et){
    const r=new RegExp(et+':\\s*(.*?)(?:\\s*(?:Tipo|Estado de implementación|Comentarios|Et[íi]quetas):|$)');
    const m=(desc||'').match(r); return m?m[1].trim():'';
}

function armar(x){
    const ruta=x.ruta.toLowerCase();
    const tipoTxt=campo(x.desc,'Tipo');
    const el={
        id:'e'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
        nombre:x.nombre, subtipo:tipoTxt,
        estado:campo(x.desc,'Estado de implementación'),
        notas:campo(x.desc,'Comentarios'),
        etiquetas:(campo(x.desc,'Etíquetas')||campo(x.desc,'Etiquetas')||'').split(',').map(s=>s.trim()).filter(Boolean),
        g:x.g
    };
    if(x.esLinea){
        el.tipo='cable';
        el.clase = /drop/.test(ruta)?'drop' : /primario/.test(ruta)?'primario'
                 : /secundario/.test(ruta)?'secundario' : /terciario/.test(ruta)?'terciario' : 'secundario';
        const hb=hilosDe(tipoTxt); el.hilos=hb.hilos; el.buffers=hb.buffers;
        el.metros=largoDe(x.g);
    } else if(/pop/.test(ruta)){
        el.tipo='caja'; el.clase='pop';
    } else if(/caja/.test(ruta)){
        el.tipo='caja';
        el.clase = /\/ce/.test(ruta)||/mufla/i.test(tipoTxt) ? 'mufla'
                 : /nap/.test(ruta) ? 'nap' : 'cto';
        const cap=capacidadDe(tipoTxt);
        el.splitters = cap ? [{tipo:'1x'+cap, ratio:''}] : [];
        el.puertos={};
    } else if(/reserva/.test(ruta)){
        el.tipo='reserva';
        el.metros=parseFloat((x.nombre||'').replace(',','.'))||null;
        el.cable=x.desc.trim();
    } else if(/cliente/.test(ruta)){
        el.tipo='cliente';
        // Hay nombres con puertos imposibles ("PTO 74985 PREC 004984",
        // "PTO 000098"): son errores de digitacion en OZmap. Si se aceptan,
        // la caja termina con una capacidad deducida absurda.
        const p=(x.nombre||'').match(/PTO\s*0*(\d+)/i);
        const n=p?+p[1]:null;
        el.puerto=(n&&n>0&&n<=MAX_PUERTOS)?n:null;
        if(n&&(n>MAX_PUERTOS||n<=0)) el.puertoDudoso=n;
    } else {
        el.tipo='poste';
    }
    return el;
}
function claseDe(e){ return e.tipo==='cable'||e.tipo==='caja' ? e.clase : e.tipo; }

function largoDe(g){
    let d=0;
    for(let i=1;i<g.length;i++) d+=metros(g[i-1],g[i]);
    return Math.round(d);
}
function metros(a,b){
    const R=6371000, f=x=>x*Math.PI/180;
    const dLat=f(b[0]-a[0]), dLon=f(b[1]-a[1]);
    const h=Math.sin(dLat/2)**2+Math.cos(f(a[0]))*Math.cos(f(b[0]))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
}

/* Deduce qué cliente cuelga de qué caja usando la geometría del drop:
   un extremo cae sobre el cliente y el otro sobre la caja. Comprobado
   contra el export real: 679 de 679 drops resueltos. */
function enlazarTopologia(els){
    const clientes=els.filter(e=>e.tipo==='cliente');
    const cajas=els.filter(e=>e.tipo==='caja'&&e.clase!=='pop');
    const drops=els.filter(e=>e.tipo==='cable'&&e.clase==='drop');
    if(!clientes.length||!cajas.length) return;
    const cerca=(p,l)=>{ let e=null,d=1e9; l.forEach(x=>{ const q=metros(p,x.g[0]); if(q<d){d=q;e=x;} }); return {el:e,d}; };
    drops.forEach(dp=>{
        const ini=dp.g[0], fin=dp.g[dp.g.length-1];
        const c1=cerca(ini,clientes), j1=cerca(fin,cajas);
        const c2=cerca(fin,clientes), j2=cerca(ini,cajas);
        const A=(c1.d<25&&j1.d<25), B=(c2.d<25&&j2.d<25);
        if(!A&&!B) return;
        const cli=A?c1.el:c2.el, caj=A?j1.el:j2.el;
        cli.caja=caj.nombre; cli.cajaId=caj.id;
        cli.nombreReal=dp.nombre;          // el drop lleva el nombre de la persona
        dp.cliente=dp.nombre; dp.caja=caj.nombre;
        if(cli.puerto){
            caj.puertos=caj.puertos||{};
            caj.puertos[cli.puerto]={cliente:dp.nombre, clienteId:cli.id};
        }
    });
    // Si una caja no declara splitter pero tiene un cliente en el puerto 14,
    // es al menos 1x16. Mejor eso que dejarla sin capacidad.
    cajas.forEach(c=>{
        if(c.splitters&&c.splitters.length) return;
        const max=Math.max(0,...Object.keys(c.puertos||{}).map(Number));
        if(!max||max>MAX_PUERTOS) return;
        const cap=[2,4,8,16,32,64].find(n=>n>=max);
        if(cap) c.splitters=[{tipo:'1x'+cap, ratio:'', deducido:true}];
    });
}

/* ════════════════════════════════════════════════════════════════════
   MAPA
   Con renderizador de lienzo: son miles de elementos y en SVG el
   navegador se arrastra.
   ════════════════════════════════════════════════════════════════════ */
async function crearMapa(){
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js');
    mapa=L.map('mapa',{preferCanvas:true, zoomControl:true}).setView([1.61,-75.61],13);
    ponerFondo();
    ORDEN.forEach(t=>{ capas[t]=L.layerGroup().addTo(mapa); });
    mapa.on('click',ev=>{
        if(moviendo) return soltarEn([ev.latlng.lat, ev.latlng.lng]);
        if(MODO!=='ver') return clicEnMapa(ev);
        if(!window._fijado) pintarPanel();
    });
    mapa.on('dblclick',ev=>{
        if(MODO==='medir'||MODO==='cable'||MODO==='region'){
            L.DomEvent.stop(ev);
            if(MODO==='cable'&&puntos.length>1) guardarCable();
            if(MODO==='region'&&puntos.length>2) guardarRegion();
        }
    });
    mapa.doubleClickZoom.disable();
    // Los nombres de las cajas aparecen desde el zoom 17: hay que redibujarlas
    // al cruzar ese umbral. Y de paso se avisa si la foto ya viene ampliada.
    mapa.on('zoomend',()=>{
        avisarZoom();
        const alto=mapa.getZoom()>=17;
        if(alto!==window._rotVisibles){ window._rotVisibles=alto; dibujar(); }
    });
}
/* MEDIDO sobre Florencia y El Paujil: el satelite de Esri SE ACABA en el zoom
   18. Del 19 en adelante devuelve una tesela de 2 KB que es "sin datos", y el
   mapa se ponia GRIS justo cuando uno se acerca a ubicar un poste.
   maxNativeZoom le dice a Leaflet que estire la ultima tesela buena en vez de
   pedir uno que no existe: se ve borroso, pero se ve. Google si tiene imagen
   hasta el 21 en esta zona; eso requiere su API con llave.                */
function ponerFondo(){
    if(capaBase) mapa.removeLayer(capaBase);
    capaBase = fondoSat
        ? L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {maxZoom:21, maxNativeZoom:18, attribution:'Imágenes © Esri'})
        : L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {maxZoom:21, maxNativeZoom:19, attribution:'© OpenStreetMap'});
    capaBase.addTo(mapa);
    if(capaBase.bringToBack) capaBase.bringToBack();
}
function cambiarFondo(){
    if(!mapa) return;
    fondoSat=!fondoSat; ponerFondo();
    document.getElementById('btnFondo').textContent = fondoSat?'🗺️ Calles':'🛰️ Satélite';
    avisarZoom();
}
// Aviso honesto: si se acerca mas alla de donde hay foto real, que sepa por
// que se ve borroso, en vez de creer que la app esta fallando.
function avisarZoom(){
    const a=document.getElementById('avisoZoom'); if(!a||!mapa) return;
    const z=mapa.getZoom();
    a.style.display = (fondoSat && z>18) ? '' : 'none';
    if(fondoSat && z>18) a.textContent='🔍 Imagen ampliada — el satélite gratuito llega hasta aquí';
}

/* ════════════════════════════════════════════════════════════════════
   CÓDIGO DE COLORES DE LA FIBRA (norma EIA/TIA-598)
   ────────────────────────────────────────────────────────────────────
   Los doce colores se repiten en el mismo orden dentro de cada buffer,
   y los buffers usan la MISMA secuencia: buffer 1 azul, 2 naranja, 3
   verde, y asi.
   Cuantos hilos van por buffer sale del propio cable, NO son siempre 12:
   un 48H 6B son 6 tubos de 8, y un 48H 4B son 4 tubos de 12. Los dos
   existen y en el archivo real conviven.
   Ejemplo comprobado con TRONCAL Z1-B (48H 6B): el hilo 27 cae en el
   buffer 4 (café) y es el hilo 3 dentro de el (verde).
   ════════════════════════════════════════════════════════════════════ */
const COLORES_FIBRA=[
    {n:'Azul',       hex:'#0d6efd', txt:'#fff'},
    {n:'Naranja',    hex:'#fd7e14', txt:'#000'},
    {n:'Verde',      hex:'#198754', txt:'#fff'},
    {n:'Café',       hex:'#8b4513', txt:'#fff'},
    {n:'Gris',       hex:'#8a8f98', txt:'#000'},
    {n:'Blanco',     hex:'#f1f3f5', txt:'#000'},
    {n:'Rojo',       hex:'#dc3545', txt:'#fff'},
    {n:'Negro',      hex:'#212529', txt:'#fff'},
    {n:'Amarillo',   hex:'#ffc107', txt:'#000'},
    {n:'Violeta',    hex:'#8b00ff', txt:'#fff'},
    {n:'Rosa',       hex:'#ff69b4', txt:'#000'},
    {n:'Aguamarina', hex:'#40e0d0', txt:'#000'}
];
const colorN=i=>COLORES_FIBRA[((i-1)%12+12)%12];

// Reparte los hilos de un cable en sus buffers, con el color de cada uno.
function mapaFibra(cable){
    const hilos=cable.hilos||0;
    if(!hilos) return null;
    let bufs=cable.buffers||Math.ceil(hilos/12);
    const porBuf=Math.ceil(hilos/bufs);
    const out=[];
    for(let b=1;b<=bufs;b++){
        const desde=(b-1)*porBuf+1, hasta=Math.min(hilos,b*porBuf);
        if(desde>hilos) break;
        const lista=[];
        for(let h=desde;h<=hasta;h++) lista.push({n:h, dentro:h-desde+1, c:colorN(h-desde+1)});
        out.push({buffer:b, c:colorN(b), hilos:lista});
    }
    return out;
}

/* ════════════════════════════════════════════════════════════════════
   CONEXIONES ENTRE ELEMENTOS
   Los cables NO traen en el KML a que caja llegan, pero sus extremos
   caen justo encima de ellas: medido, 471 de 472 cables tienen caja en
   LOS DOS extremos. De ahi sale la cadena completa POP → mufla → caja
   de primer nivel → caja de segundo nivel → cliente.
   ════════════════════════════════════════════════════════════════════ */
function enlazarCables(els){
    const cajas=els.filter(e=>e.tipo==='caja');
    if(!cajas.length) return;
    const cerca=(p)=>{ let e=null,d=1e9;
        cajas.forEach(x=>{ const q=metros(p,x.g[0]); if(q<d){d=q;e=x;} }); return {el:e,d}; };
    cajas.forEach(c=>{ c.cables=[]; });
    els.filter(e=>e.tipo==='cable'&&e.clase!=='drop').forEach(cb=>{
        const a=cerca(cb.g[0]), b=cerca(cb.g[cb.g.length-1]);
        cb.cajaA = a.d<30 ? a.el.nombre : '';
        cb.cajaB = b.d<30 ? b.el.nombre : '';
        cb.cajaAId = a.d<30 ? a.el.id : '';
        cb.cajaBId = b.d<30 ? b.el.id : '';
        if(a.d<30) a.el.cables.push({id:cb.id, nombre:cb.nombre, hacia:cb.cajaB, sub:cb.subtipo,
                                     hilos:cb.hilos, buffers:cb.buffers, clase:cb.clase, extremo:'A'});
        if(b.d<30 && b.el!==a.el) b.el.cables.push({id:cb.id, nombre:cb.nombre, hacia:cb.cajaA, sub:cb.subtipo,
                                     hilos:cb.hilos, buffers:cb.buffers, clase:cb.clase, extremo:'B'});
    });
}

/* El color de una caja dice si SIRVE PARA VENDER, que es lo unico que se
   quiere ver de un vistazo cuando se mira el mapa:
     verde  = queda espacio de sobra   ambar = va quedando poco
     rojo   = llena                    gris  = no sabemos su capacidad      */
function estadoCaja(el){
    const cap=capacidadCaja(el);
    const usados=Object.keys(el.puertos||{}).length;
    // Un puerto reservado NO esta libre: si contara como libre, alguien se lo
    // asignaria a un cliente y ahi se pierde la reserva.
    const bloq=Object.keys(el.bloqueados||{}).filter(n=>!(el.puertos||{})[n]).length;
    if(!cap) return {color:'#64748b', et:'sin capacidad', libres:null, cap:0, usados, bloq};
    const libres=Math.max(0,cap-usados-bloq);
    if(libres===0)          return {color:'#ef4444', et:'llena',    libres, cap, usados, bloq};
    if(libres<=cap*0.25)    return {color:'#f59e0b', et:'casi llena',libres, cap, usados, bloq};
    return {color:'#10b981', et:'con espacio', libres, cap, usados, bloq};
}

function iconoCaja(el){
    const s=estadoCaja(el);
    const clase = el.clase==='pop' ? 'mk-pop' : el.clase==='mufla' ? 'mk-mufla' : 'mk-caja';
    const dentro = el.clase==='pop' ? '🏛️'
                 : el.clase==='mufla' ? '⬤'
                 : (s.cap? s.libres+'/'+s.cap : '?');
    // Con "pintar por fase" manda la fase de obra; si no, la ocupacion.
    let fondo = el.clase==='mufla' ? TIPOS.mufla.color
              : el.clase==='pop'   ? TIPOS.pop.color : s.color;
    if(window._porFase) fondo=FASES[faseDe(el)].color;
    const rot = mapa && mapa.getZoom()>=17
        ? `<span class="mk-rot">${esc((el.nombre||'').slice(0,26))}</span>` : '';
    const w = el.clase==='pop'?30:el.clase==='mufla'?22:26;
    const h = el.clase==='pop'?30:el.clase==='mufla'?22:20;
    return L.divIcon({className:'', iconSize:[w,h], iconAnchor:[w/2,h/2],
        html:`<div style="position:relative"><div class="mk ${clase}" style="background:${fondo}">${dentro}</div>${rot}</div>`});
}

var capaReg=null;
function dibujarRegiones(){
    if(capaReg){ mapa.removeLayer(capaReg); capaReg=null; }
    if(window._verRegiones===false || !(RED.regiones||[]).length) return;
    capaReg=L.layerGroup().addTo(mapa);
    RED.regiones.forEach(r=>{
        if(!r.g||r.g.length<3) return;
        const pol=L.polygon(r.g,{color:r.color||'#a855f7', weight:2,
                   fillColor:r.color||'#a855f7', fillOpacity:.14});
        pol.bindTooltip(r.nombre||'', {permanent:true, direction:'center', className:'rot-region'});
        pol.on('click',ev=>{ L.DomEvent.stopPropagation(ev); fichaRegion(r); });
        pol.addTo(capaReg);
    });
    if(capaReg.bringToBack) capaReg.bringToBack();
}
function fichaRegion(r){
    const dentro=RED.elementos.filter(e=>e.tipo==='caja'&&e.clase!=='pop'&&enPoligono(e.g[0],r.g));
    let lib=0,ocu=0;
    dentro.forEach(c=>{const s=estadoCaja(c); if(s.cap){lib+=s.libres;ocu+=s.usados;}});
    document.getElementById('panel').innerHTML=`
      <button class="btn btn-sm btn-out" style="margin-bottom:12px" onclick="pintarPanel()">← Volver</button>
      <div class="ficha">
        <h3><span class="punto" style="display:inline-block;background:${r.color}"></span> ${esc(r.nombre)}</h3>
        <div class="tipo">Región</div>
        <div class="kpis" style="margin-top:10px">
          <div class="kpi"><div class="v">${dentro.length}</div><div class="e">Cajas</div></div>
          <div class="kpi"><div class="v" style="color:#10b981">${lib}</div><div class="e">Libres</div></div>
          <div class="kpi"><div class="v" style="color:#f87171">${ocu}</div><div class="e">Ocupados</div></div>
          <div class="kpi"><div class="v">${r.g.length}</div><div class="e">Esquinas</div></div>
        </div>
        ${r.notas?`<div class="dato"><b>Notas</b><span>${esc(r.notas)}</span></div>`:''}
      </div>
      <button class="btn btn-sm" style="width:100%;background:rgba(239,68,68,.12);color:#f87171;
              border:1px solid rgba(239,68,68,.35)" onclick="borrarRegion('${r.id}')">🗑️ Borrar región</button>`;
}
// Punto dentro de polígono: cuenta cruces de una raya hacia la derecha.
function enPoligono(p, poly){
    let d=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
        const a=poly[i], b=poly[j];
        if(((a[0]>p[0])!==(b[0]>p[0])) &&
           (p[1] < (b[1]-a[1])*(p[0]-a[0])/((b[0]-a[0])||1e-12)+a[1])) d=!d;
    }
    return d;
}

var capaNotas=null;
function dibujarNotas(){
    if(capaNotas){ mapa.removeLayer(capaNotas); capaNotas=null; }
    const ab=(RED.notas||[]).filter(n=>n.abierta);
    if(!ab.length) return;
    capaNotas=L.layerGroup().addTo(mapa);
    ab.forEach(n=>{
        const col=n.urgencia==='Alta'?'#ef4444':n.urgencia==='Baja'?'#64748b':'#f59e0b';
        const m=L.marker(n.g,{icon:L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],
            html:`<div class="mk mk-mufla" style="background:${col};font-size:.7rem">🚩</div>`})});
        m.bindTooltip(`<b>${esc(n.tipo)}</b><br>${esc((n.texto||'').slice(0,60))}`,{direction:'top'});
        m.on('click',ev=>{ L.DomEvent.stopPropagation(ev); abrirPendientes(); });
        m.addTo(capaNotas);
    });
}

function dibujar(){
    if(!mapa) return;
    ORDEN.forEach(t=>capas[t]&&capas[t].clearLayers());
    dibujarRegiones();
    dibujarNotas();
    const lienzo=L.canvas({padding:0.4});
    const puntos=[];
    const soloLibres=window._soloLibres;
    RED.elementos.forEach(el=>{
        const t=claseDe(el), cfg=TIPOS[t]; if(!cfg||!el.g||!el.g.length) return;
        // Filtro: dejar solo las cajas donde SE PUEDE conectar a alguien
        if(soloLibres && el.tipo==='caja' && el.clase!=='pop'){
            const s=estadoCaja(el); if(!s.libres) return;
        }
        let capa;
        if(cfg.forma==='linea'&&el.g.length>1){
            // El grosor sube con los hilos: la troncal se distingue del ramal
            const w = el.hilos ? Math.min(6, 1.2+Math.log2(el.hilos)*0.8) : cfg.w;
            capa=L.polyline(el.g,{color:cfg.color, weight:w, opacity:.9, renderer:lienzo});
        }else if(el.tipo==='caja'){
            capa=L.marker(el.g[0],{icon:iconoCaja(el)});
            puntos.push(el.g[0]);
        }else{
            capa=L.circleMarker(el.g[0],{radius:cfg.r, color:cfg.color, weight:1,
                                fillColor:cfg.color, fillOpacity:.85, renderer:lienzo});
            puntos.push(el.g[0]);
        }
        capa.on('click',ev=>{
            L.DomEvent.stopPropagation(ev); window._fijado=true;
            // En modo ruta, un clic en una caja ilumina su camino hasta el POP
            if(MODO==='ruta' && el.tipo==='caja') iluminarRuta(el);
            else pintarPanel(el);
            setTimeout(()=>window._fijado=false,50);
        });
        capa.addTo(capas[t]);
    });
    document.getElementById('chipTotal').textContent=RED.elementos.length.toLocaleString('es-CO')+' elementos';
    if(puntos.length && !window._yaEncuadrado){ mapa.fitBounds(L.latLngBounds(puntos).pad(.05)); window._yaEncuadrado=true; }
    pintarLeyenda();
    pintarPanel();
}

function pintarLeyenda(){
    const l=document.getElementById('leyenda'); if(!l) return;
    if(!RED.elementos.length){ l.style.display='none'; return; }
    l.style.display='';
    l.innerHTML=`<b>Cajas</b>
      <div><i style="background:#10b981"></i>Con espacio</div>
      <div><i style="background:#f59e0b"></i>Casi llena</div>
      <div><i style="background:#ef4444"></i>Llena</div>
      <div><i style="background:#64748b"></i>Sin capacidad</div>
      <b style="margin-top:8px">Fibra</b>
      <div><i style="background:#ef4444;height:3px;border-radius:2px"></i>Primario</div>
      <div><i style="background:#fb923c;height:3px;border-radius:2px"></i>Secundario</div>
      <div><i style="background:#64748b;height:2px;border-radius:2px"></i>Drop</div>`;
}

/* ════════════════════════════════════════════════════════════════════
   PANEL: capas con sus conteos, o la ficha del elemento elegido
   ════════════════════════════════════════════════════════════════════ */
function pintarPanel(el){
    const p=document.getElementById('panel');
    if(MODO==='medir'||MODO==='cable'||MODO==='region'){ p.innerHTML=panelMedicion(); return; }
    if(MODO==='ruta'&&!el){
        p.innerHTML=`<button class="btn btn-sm btn-out" style="margin-bottom:12px" onclick="modo('ver')">← Salir</button>
          <div class="sec">Seguir la ruta</div>
          <div class="vacio">Haz clic en una caja del mapa.<br><br>
          Te muestro por dónde le llega la señal hasta el POP,<br>
          cuántos metros recorre y cuánta potencia pierde.</div>`;
        return;
    }
    if(MODO==='viabilidad'&&!window._viabPunto){
        p.innerHTML=`<button class="btn btn-sm btn-out" style="margin-bottom:12px" onclick="modo('ver')">← Salir</button>
          <div class="sec">¿Hay cupo aquí?</div>
          <div class="vacio">Haz clic en el mapa donde vive el cliente.<br><br>
          Te digo a qué cajas alcanza, cuántos puertos les quedan libres<br>
          y a qué distancia están.</div>`;
        return;
    }
    if(el){ p.innerHTML=fichaHTML(el); return; }

    if(!RED.elementos.length){
        p.innerHTML=`<div class="aviso">Esta sede todavía no tiene red cargada.</div>
          <div class="vacio">Tienes dos caminos:<br><br>
            <b>📥 Importar KML</b> si ya tienes el archivo de OZmap,<br>
            o <b>✏️ Editar</b> y empezar a marcar cajas y postes<br>uno a uno sobre el mapa.</div>`;
        return;
    }
    const cuenta={}; RED.elementos.forEach(e=>{ const t=claseDe(e); cuenta[t]=(cuenta[t]||0)+1; });
    const cajas=RED.elementos.filter(e=>e.tipo==='caja'&&e.clase!=='pop');
    let libres=0, ocup=0, sinCap=0;
    cajas.forEach(c=>{ const cap=capacidadCaja(c);
        const us=Object.keys(c.puertos||{}).length;
        if(!cap) sinCap++; else { ocup+=us; libres+=Math.max(0,cap-us); } });

    const km=Math.round(RED.elementos.filter(e=>e.tipo==='cable')
              .reduce((s,c)=>s+(c.metros||0),0)/1000*10)/10;
    const pct=ocup+libres>0?Math.round(100*ocup/(ocup+libres)):0;
    const conEspacio=cajas.filter(c=>{const s=estadoCaja(c);return s.libres>0;}).length;

    p.innerHTML=`
      ${moviendo?'<div class="aviso">📍 Haz clic en el mapa donde queda el elemento.</div>'
        :editando?'<div class="aviso">✏️ <b>Edición encendida.</b> Clic en el mapa para crear algo nuevo, o en un elemento para cambiarlo, moverlo o borrarlo.</div>':''}

      <div class="kpis">
        <div class="kpi"><div class="v" style="color:#10b981">${libres.toLocaleString('es-CO')}</div><div class="e">Puertos libres</div></div>
        <div class="kpi"><div class="v" style="color:#f87171">${ocup.toLocaleString('es-CO')}</div><div class="e">Ocupados</div></div>
        <div class="kpi"><div class="v">${cajas.length}</div><div class="e">Cajas</div></div>
        <div class="kpi"><div class="v">${km}<span style="font-size:.7rem"> km</span></div><div class="e">Fibra tendida</div></div>
      </div>
      <div class="barra">
        <span style="width:${pct}%;background:#ef4444"></span>
        <span style="width:${100-pct}%;background:#10b981"></span>
      </div>
      <p class="ayuda" style="text-align:center;margin-bottom:6px">${pct}% de la capacidad usada ·
         ${conEspacio} caja(s) con espacio</p>

      <div class="sec">Capas</div>
      ${arbolCapas(cuenta)}

      ${sinCap?`<div class="aviso" style="margin-top:12px">⚠️ ${sinCap} caja(s) sin capacidad definida.
        Ábrelas y dile qué splitter llevan; hasta entonces no cuentan como espacio disponible.</div>`:''}

      <div class="sec">Buscar</div>
      <input type="text" id="q" placeholder="Caja, cliente, cable…" oninput="buscar(this.value)">
      <div id="res"></div>`;
}
function verCapa(t,on){ if(!capas[t]) return; on?capas[t].addTo(mapa):mapa.removeLayer(capas[t]); pintarPanel(); }

/* Árbol de capas con grupos plegables y casillas, como el de OZmap.
   Se agrupa por familia porque doce casillas sueltas no se leen. */
const GRUPOS=[
    {n:'Cajas',   ico:'📦', hijos:['pop','mufla','cto','nap']},
    {n:'Cables',  ico:'🧵', hijos:['primario','secundario','terciario','drop']},
    {n:'Puntos',  ico:'📍', hijos:['poste','reserva','cliente']}
];
var _abiertos={Cajas:true, Cables:true, Puntos:false};

function encendida(t){ return !!(capas[t]&&mapa&&mapa.hasLayer(capas[t])); }
function arbolCapas(cuenta){
    let h='<div class="arbol">';
    // Filtros que cortan de verdad, arriba del todo
    h+=`<div class="hoja" onclick="window._soloLibres=!window._soloLibres;dibujar()"
          style="background:rgba(16,185,129,.07);margin-bottom:7px">
          <span class="cas ${window._soloLibres?'si':''}">${window._soloLibres?'✓':''}</span>
          <b>Solo cajas con puerto libre</b></div>`;
    h+=`<div class="hoja" onclick="window._porFase=!window._porFase;dibujar()" style="margin-bottom:7px">
          <span class="cas ${window._porFase?'si':''}">${window._porFase?'✓':''}</span>
          <b>Pintar por fase de obra</b></div>`;
    GRUPOS.forEach(g=>{
        const hijos=g.hijos.filter(t=>cuenta[t]);
        if(!hijos.length) return;
        const enc=hijos.filter(encendida).length;
        const est=enc===hijos.length?'si':enc?'parte':'';
        const tot=hijos.reduce((s,t)=>s+cuenta[t],0);
        h+=`<div class="rama ${_abiertos[g.n]?'abierta':''}">
              <div class="cab">
                <span class="fl" onclick="event.stopPropagation();plegar('${g.n}')">▶</span>
                <span class="cas ${est}" onclick="event.stopPropagation();grupoCapas('${g.n}',${enc<hijos.length})">${est==='si'?'✓':''}</span>
                <span onclick="plegar('${g.n}')" style="flex:1">${g.ico} ${g.n}</span>
                <span class="cuenta">${tot.toLocaleString('es-CO')}</span>
              </div>
              <div class="hijos">
                ${hijos.map(t=>`<div class="hoja" onclick="verCapa('${t}',${!encendida(t)})">
                    <span class="cas ${encendida(t)?'si':''}">${encendida(t)?'✓':''}</span>
                    <span class="${TIPOS[t].forma==='linea'?'raya':'punto'}" style="background:${TIPOS[t].color}"></span>
                    <span style="flex:1">${TIPOS[t].et}</span>
                    <span class="cuenta">${cuenta[t].toLocaleString('es-CO')}</span>
                  </div>`).join('')}
              </div>
            </div>`;
    });
    if((RED.regiones||[]).length){
        h+=`<div class="hoja" onclick="window._verRegiones=!window._verRegiones;dibujar()">
              <span class="cas ${window._verRegiones!==false?'si':''}">${window._verRegiones!==false?'✓':''}</span>
              <span>⬟ Regiones</span><span class="cuenta">${RED.regiones.length}</span></div>`;
    }
    return h+'</div>';
}
function plegar(n){ _abiertos[n]=!_abiertos[n]; pintarPanel(); }
function grupoCapas(n,on){
    const g=GRUPOS.find(x=>x.n===n); if(!g) return;
    g.hijos.forEach(t=>{ if(capas[t]) on?capas[t].addTo(mapa):mapa.removeLayer(capas[t]); });
    pintarPanel();
}
function verPanel(){ pintarPanel(); }

/* CAPACIDAD = SOLO las salidas que pueden atender CLIENTES.
   OZmap distingue dos usos y es una diferencia de fondo, no cosmetica:
     · splitter de ATENCION (blanco): de sus salidas cuelgan clientes
     · splitter de RED (gris): sus salidas alimentan OTRAS cajas
   Contar las de red como puertos disponibles infla el cupo y lleva a
   prometer instalaciones donde no caben. Por defecto se asume atencion,
   que es lo que trae el KML importado; lo de red se marca a mano. */
/* OZmap escribe los splitters de dos formas y hay que distinguirlas:
     · BALANCEADO por puertos: "1x16" o "01/04" = 1 entrada, 4 salidas
     · DESBALANCEADO por potencia: "80/20", "55/45" = DOS salidas, y los
       numeros son el reparto de la luz, que siempre suma 100.
   Confundirlos hace que un 01/04 cuente 2 puertos en vez de 4. */
function salidasDe(sp){
    const t=String(sp.tipo||'').trim();
    const x=t.match(/(\d+)\s*[xX]\s*(\d+)/);
    if(x) return +x[2];
    const b=t.match(/^(\d+)\s*\/\s*(\d+)$/);
    if(b){
        const a=+b[1], c=+b[2];
        if(a+c===100) return 2;      // reparto de potencia
        return c;                    // entradas / salidas
    }
    return 0;
}
function esDeRed(sp){ return sp && sp.uso==='red'; }
function capacidadCaja(c){
    if(!c.splitters||!c.splitters.length) return 0;
    return c.splitters.reduce((s,sp)=>s+(esDeRed(sp)?0:salidasDe(sp)),0);
}
function capacidadRed(c){
    if(!c.splitters||!c.splitters.length) return 0;
    return c.splitters.reduce((s,sp)=>s+(esDeRed(sp)?salidasDe(sp):0),0);
}

function buscar(q){
    const r=document.getElementById('res'); if(!r) return;
    q=(q||'').trim().toLowerCase();
    if(q.length<2){ r.innerHTML=''; return; }
    const hits=RED.elementos.filter(e=>
        (e.nombre||'').toLowerCase().includes(q) || (e.nombreReal||'').toLowerCase().includes(q)
    ).slice(0,25);
    r.innerHTML = hits.length
        ? hits.map(e=>`<div class="capa" onclick="irA('${e.id}')" style="cursor:pointer">
             <span class="${TIPOS[claseDe(e)]&&TIPOS[claseDe(e)].forma==='linea'?'raya':'punto'}"
                   style="background:${(TIPOS[claseDe(e)]||{}).color||'#888'}"></span>
             <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.nombreReal||e.nombre||'(sin nombre)')}</span>
           </div>`).join('')
        : '<div class="vacio">Nada con ese nombre.</div>';
}
function irA(id){
    const el=RED.elementos.find(e=>e.id===id); if(!el||!el.g||!el.g.length) return;
    mapa.setView(el.g[0], 19); dibujar(); pintarPanel(el);
}
/* ════════════════════════════════════════════════════════════════════
   CONECTAR Y DESCONECTAR CLIENTES EN LOS PUERTOS
   Hasta aqui la ocupacion solo se podia importar del KML. Sin esto, la
   red envejece desde el dia uno: se instala a alguien y el mapa sigue
   diciendo que ese puerto esta libre.
   Los clientes salen de la OFICINA (los mismos de WispHub), no se
   escriben a mano, para que el nombre no se invente dos veces.
   ════════════════════════════════════════════════════════════════════ */
var _cliOficina=null;
async function clientesParaConectar(){
    if(_cliOficina) return _cliOficina;
    _cliOficina=await clientesDeOficina(SEDE.id);
    return _cliOficina;
}

function verPuerto(idCaja, n){
    const c=RED.elementos.find(e=>e.id===idCaja); if(!c) return;
    const o=(c.puertos||{})[n];
    const bloq=(c.bloqueados||{})[n];
    if(bloq) return abrirModal(`Puerto ${n} · ${esc(c.nombre||'')}`,
        `<div style="text-align:center;padding:14px 10px">
           <div style="font-size:2.2rem">🔒</div>
           <b style="color:#f59e0b;font-size:1.05rem">Reservado</b>
           <p class="ayuda" style="margin-top:6px">${esc(bloq.motivo||'Sin motivo anotado')}</p>
           <p class="ayuda">${bloq.por?'Por '+esc(bloq.por):''}
              ${bloq.en?' · '+new Date(bloq.en).toLocaleDateString('es-CO'):''}</p>
         </div>`,
        `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cerrar</button>
         <button class="btn btn-sm btn-primary" style="width:auto"
                 onclick="liberarPuerto('${idCaja}',${n})">🔓 Liberar</button>`);
    if(!o) return abrirModal(`Puerto ${n} · ${esc(c.nombre||'')}`,
        `<div style="text-align:center;padding:14px 10px">
           <div style="font-size:2.2rem">🟢</div>
           <b style="color:#10b981;font-size:1.05rem">Libre</b>
           <p class="ayuda" style="margin-top:6px">Se puede conectar un cliente aquí.</p>
         </div>`,
        `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cerrar</button>
         <button class="btn btn-sm btn-out" onclick="bloquearPuerto('${idCaja}',${n})">🔒 Reservar</button>
         <button class="btn btn-sm btn-primary" style="width:auto"
                 onclick="conectarCliente('${idCaja}',${n})">🔌 Conectar cliente</button>`);
    const cli=RED.elementos.find(e=>e.id===o.clienteId);
    abrirModal(`Puerto ${n} · ${esc(c.nombre||'')}`, `
      <div class="dato"><b>Cliente</b><span>${esc(o.cliente||'—')}</span></div>
      ${o.servicio?`<div class="dato"><b>Servicio</b><span style="font-family:monospace;font-size:.76rem">${esc(o.servicio)}</span></div>`:''}
      ${o.conectadoEn?`<div class="dato"><b>Conectado</b><span>${new Date(o.conectadoEn).toLocaleDateString('es-CO')} · ${esc(o.conectadoPor||'')}</span></div>`:''}
      ${cli?`<div class="dato"><b>Ubicación</b><span style="font-size:.72rem">${cli.g[0][0].toFixed(6)}, ${cli.g[0][1].toFixed(6)}</span></div>`:''}`,
      `<button class="btn btn-sm" style="background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.35)"
               onclick="desconectarPuerto('${idCaja}',${n})">Desconectar</button>
       ${cli?`<button class="btn btn-sm btn-out" onclick="cerrarModal();irA('${cli.id}')">Ver en el mapa</button>`:''}
       <button class="btn btn-sm btn-out" onclick="cerrarModal()">Cerrar</button>`);
}

async function conectarCliente(idCaja,n){
    const c=RED.elementos.find(e=>e.id===idCaja); if(!c) return;
    window._conCaja=idCaja; window._conPto=n;
    abrirModal(`🔌 Conectar en el puerto ${n}`, `
      <label>Busca al cliente</label>
      <input id="cn_q" placeholder="Nombre o cédula…" autocomplete="off" oninput="buscarCliente(this.value)">
      <p class="ayuda">Salen los clientes de ${esc(SEDE.nombre)}. Si no aparece, revisa que esté
         sincronizado desde WispHub.</p>
      <div id="cn_res" style="max-height:230px;overflow-y:auto;margin-top:8px"></div>`,
      `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cancelar</button>`);
    const lista=await clientesParaConectar();
    document.getElementById('cn_res').innerHTML=
        `<p class="ayuda">${lista.length.toLocaleString('es-CO')} clientes en esta oficina. Escribe para filtrar.</p>`;
    setTimeout(()=>{ const i=document.getElementById('cn_q'); if(i) i.focus(); },60);
}
function buscarCliente(q){
    const r=document.getElementById('cn_res'); if(!r||!_cliOficina) return;
    q=normNom(q);
    if(q.length<2){ r.innerHTML='<p class="ayuda">Escribe al menos dos letras.</p>'; return; }
    const hits=_cliOficina.filter(c=>normNom(c.nombre).includes(q)||String(c.cedula||'').includes(q)).slice(0,30);
    // Avisamos si ese cliente YA figura en otro puerto: es el error tipico
    const yaEn={};
    RED.elementos.filter(e=>e.tipo==='caja').forEach(cj=>{
        Object.keys(cj.puertos||{}).forEach(p=>{
            const s=cj.puertos[p].servicio; if(s) yaEn[s]={caja:cj.nombre,pto:p};
        });
    });
    r.innerHTML = hits.length ? hits.map(c=>{
        const ya=yaEn[c.servicioWisphub||''];
        return `<div class="fila" style="cursor:pointer" onclick="fijarCliente('${(c.servicioWisphub||'').replace(/'/g,'')}')">
          <span class="punto" style="background:${String(c.estado).toLowerCase()==='activo'?'#10b981':'#64748b'}"></span>
          <span class="nom">${esc(c.nombre)}${ya?`<i style="color:#f59e0b;font-size:.7rem"> · ya está en ${esc(ya.caja)} pto ${ya.pto}</i>`:''}</span>
          <span class="meta">${esc(c.estado||'')}</span></div>`;
      }).join('') : '<div class="vacio" style="padding:14px">Nadie con ese nombre.</div>';
}
async function fijarCliente(servicio){
    const cli=(_cliOficina||[]).find(c=>String(c.servicioWisphub||'')===servicio);
    if(!cli) return;
    const c=RED.elementos.find(e=>e.id===window._conCaja); if(!c) return;
    const n=window._conPto;
    // Si ya estaba en otro puerto, se quita de alli: un servicio no puede
    // estar conectado en dos sitios a la vez.
    let movidoDe=null;
    RED.elementos.filter(e=>e.tipo==='caja').forEach(cj=>{
        Object.keys(cj.puertos||{}).forEach(p=>{
            if(cj.puertos[p].servicio===servicio && !(cj===c && +p===n)){
                movidoDe=`${cj.nombre} pto ${p}`; delete cj.puertos[p];
            }
        });
    });
    c.puertos=c.puertos||{};
    c.puertos[n]={cliente:cli.nombre, servicio:cli.servicioWisphub||'',
                  conectadoEn:Date.now(), conectadoPor:(USER&&USER.nombre)||''};
    cerrarModal();
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ delete c.puertos[n]; ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); dibujar(); pintarPanel(c);
    if(movidoDe) setTimeout(()=>alert(`Se movió desde ${movidoDe}.`),200);
}
/* Bloquear un puerto: reservarlo para una obra o inhabilitarlo porque
   esta dañado, para que nadie lo asigne por error. Cuenta como ocupado
   en la capacidad, que es lo que se quiere. */
function bloquearPuerto(idCaja,n){
    window._blCaja=idCaja; window._blPto=n;
    abrirModal(`🔒 Reservar el puerto ${n}`, `
      <label>¿Por qué?</label>
      <select id="bl_motivo">
        <option>Reservado para una instalación pendiente</option>
        <option>Puerto dañado</option>
        <option>Reservado para ampliación</option>
        <option>Uso interno / pruebas</option>
        <option>Otro</option>
      </select>
      <label style="margin-top:12px">Detalle</label>
      <input id="bl_nota" placeholder="Opcional" autocomplete="off">
      <p class="ayuda">Un puerto reservado deja de contar como libre, así no se lo asignan a otro
         cliente por equivocación.</p>`,
      `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cancelar</button>
       <button class="btn btn-sm btn-primary" style="width:auto" onclick="confirmarBloqueo()">Reservar</button>`);
}
async function confirmarBloqueo(){
    const c=RED.elementos.find(e=>e.id===window._blCaja); if(!c) return cerrarModal();
    const n=window._blPto, nota=val('bl_nota');
    c.bloqueados=c.bloqueados||{};
    c.bloqueados[n]={motivo:val('bl_motivo')+(nota?' — '+nota:''),
                     por:(USER&&USER.nombre)||'', en:Date.now()};
    cerrarModal();
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ delete c.bloqueados[n]; ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); dibujar(); pintarPanel(c);
}
async function liberarPuerto(idCaja,n){
    const c=RED.elementos.find(e=>e.id===idCaja); if(!c||!c.bloqueados) return;
    const b=c.bloqueados[n];
    delete c.bloqueados[n];
    cerrarModal();
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ c.bloqueados[n]=b; ocultarCarga(); return alert('No se pudo guardar.'); }
    ocultarCarga(); dibujar(); pintarPanel(c);
}

async function desconectarPuerto(idCaja,n){
    const c=RED.elementos.find(e=>e.id===idCaja); if(!c) return;
    const o=(c.puertos||{})[n];
    if(!confirm(`¿Desconectar a ${o.cliente||'este cliente'} del puerto ${n}?\n\n`
        +`El puerto queda libre para otro.`)) return;
    delete c.puertos[n];
    cerrarModal();
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ c.puertos[n]=o; ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); dibujar(); pintarPanel(c);
}

const RATIOS=['','50/50','55/45','60/40','70/30','80/20','90/10'];

function elegirSplit(s){
    window._splitTipo=s;
    document.querySelectorAll('.rejilla .opc[data-s]').forEach(o=>o.classList.toggle('on',o.dataset.s===s));
}
function elegirUso(u){
    window._splitUso=u;
    document.querySelectorAll('.rejilla .opc[data-u]').forEach(o=>o.classList.toggle('on',o.dataset.u===u));
}
async function guardarSplitter(){
    const el=RED.elementos.find(e=>e.id===window._splitId); if(!el) return cerrarModal();
    const nuevo={tipo:window._splitTipo, ratio:val('sp_ratio'), entrada:val('sp_entrada'),
                 uso:window._splitUso||'cliente', salida:val('sp_salida')||'fusion'};
    cerrarModal();
    // Los deducidos eran una suposicion nuestra: en cuanto alguien dice el
    // splitter de verdad, esa suposicion sobra.
    el.splitters=(el.splitters||[]).filter(s=>!s.deducido);
    el.splitters.push(nuevo);
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ el.splitters.pop(); ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); dibujar(); pintarPanel(el);
}
async function cambiarUsoSplitter(id,i){
    const el=RED.elementos.find(e=>e.id===id); if(!el||!el.splitters||!el.splitters[i]) return;
    const sp=el.splitters[i], antes=sp.uso;
    const nuevo=esDeRed(sp)?'cliente':'red';
    const dif=salidasDe(sp);
    if(!confirm(`Pasar este ${sp.tipo} de ${esDeRed(sp)?'RED a ATENCIÓN':'ATENCIÓN a RED'}.\n\n`
        +(nuevo==='red'?`La caja pierde ${dif} puerto(s) disponibles: esas salidas van a otras cajas.`
                       :`La caja gana ${dif} puerto(s) disponibles para clientes.`)+'\n\n¿Seguro?')) return;
    sp.uso=nuevo; delete sp.deducido;
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ sp.uso=antes; ocultarCarga(); return alert('No se pudo guardar.'); }
    ocultarCarga(); dibujar(); pintarPanel(el);
}
async function quitarSplitter(id,i){
    const el=RED.elementos.find(e=>e.id===id); if(!el||!el.splitters) return;
    const s=el.splitters[i];
    const usados=Object.keys(el.puertos||{}).length;
    const cap=capacidadCaja(el), quedaria=cap-(esDeRed(s)?0:salidasDe(s));
    if(usados>quedaria && !confirm(`⚠️ Quitando este ${s.tipo} la caja baja a ${quedaria} puertos, `
        +`pero tiene ${usados} clientes conectados.\n\n¿Seguro?`)) return;
    if(usados<=quedaria && !confirm('¿Quitar el splitter '+s.tipo+'?')) return;
    el.splitters.splice(i,1);
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ el.splitters.splice(i,0,s); ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); dibujar(); pintarPanel(el);
}

/* ════════════════════════════════════════════════════════════════════
   CRUCE: LOS CLIENTES DE LA OFICINA CONTRA LOS DEL MAPA
   ────────────────────────────────────────────────────────────────────
   Responde tres preguntas que hoy no tienen respuesta en ningun lado:
     · a quien SI le sabemos su caja y su puerto
     · a quien le cobramos pero NO sabemos donde esta (falta marcarlo)
     · que sigue dibujado en el mapa pero ya no es cliente (limpiar)
   El nombre de la persona sale del DROP, no del punto: el punto lleva
   un codigo ("683 PTO 3 PREC 47") y el drop lleva "EDGAR CASTRO...".
   ════════════════════════════════════════════════════════════════════ */
var CRUCE=null, cruceTab='enlazados';

// Nombres escritos por gente distinta en sistemas distintos: se comparan
// sin tildes, sin ñ, sin signos y sin dobles espacios.
function normNom(s){
    return String(s||'').toUpperCase().normalize('NFD')
        .replace(/[̀-ͯ]/g,'')
        .replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}

async function clientesDeOficina(oficinaId){
    const out=[];
    try{
        const idx=await db.collection(COLECCION).doc('clientes_index').get();
        const d=idx.exists?idx.data():{};
        const n=(d.chunkInfo&&d.chunkInfo[oficinaId])||1;
        for(let i=0;i<n;i++){
            let s=await db.collection(COLECCION).doc(`clientes_${oficinaId}_${i}`).get();
            if(!s.exists&&i===0) s=await db.collection(COLECCION).doc('clientes_'+oficinaId).get();
            if(s.exists) out.push(...(s.data().clientes||[]));
        }
    }catch(e){ console.warn('clientesDeOficina',e); }
    return out;
}

async function abrirCruce(){
    if(!SEDE) return alert('Primero elige una sede.');
    mostrarCarga('Comparando la oficina con el mapa…');
    try{
        const oficina=await clientesDeOficina(SEDE.id);
        CRUCE=calcularCruce(oficina, RED.elementos);
        CRUCE.sede=SEDE.nombre;
        document.getElementById('cruce').classList.remove('hidden');
        document.getElementById('cruceTitulo').textContent='Clientes vs. Red — '+SEDE.nombre;
        cruceTab='enlazados';
        pintarCruce();
    }catch(e){ alert('No se pudo comparar:\n\n'+(e.message||e)); }
    ocultarCarga();
}
function cerrarCruce(){ document.getElementById('cruce').classList.add('hidden'); }

function calcularCruce(oficina, elementos){
    // Del mapa: los puntos de cliente que quedaron enlazados a una caja
    const enMapa=elementos.filter(e=>e.tipo==='cliente');
    // Indice de la oficina por nombre normalizado
    const idx={}, palabras={};
    oficina.forEach(c=>{
        const k=normNom(c.nombre); if(!k) return;
        (idx[k]=idx[k]||[]).push(c);
        palabras[k]=k.split(' ').filter(p=>p.length>2);
    });
    const claves=Object.keys(idx);
    const usados=new Set();

    const enlazados=[], soloMapa=[];
    enMapa.forEach(pm=>{
        const nombre=pm.nombreReal||pm.nombre||'';
        const k=normNom(nombre);
        let cli=null, comoDio='';
        if(idx[k]){ cli=idx[k][0]; comoDio='exacta'; }
        else{
            const mias=k.split(' ').filter(p=>p.length>2);
            // 3 palabras en comun es practicamente seguro; con 2 ya es dudoso
            let mejor=null, mejorN=0;
            claves.forEach(ck=>{
                const n=mias.filter(p=>palabras[ck].includes(p)).length;
                if(n>mejorN){ mejorN=n; mejor=ck; }
            });
            if(mejorN>=3){ cli=idx[mejor][0]; comoDio='3+ apellidos'; }
            else if(mejorN>=2){ cli=idx[mejor][0]; comoDio='2 apellidos (revisar)'; }
        }
        if(cli){
            usados.add(normNom(cli.nombre));
            enlazados.push({nombre:cli.nombre, servicio:cli.servicioWisphub||'', estado:cli.estado||'',
                            plan:cli.plan||'', caja:pm.caja||'', puerto:pm.puerto||null,
                            id:pm.id, como:comoDio});
        }else{
            // Sin nombreReal es que el punto no tiene drop: no hay nombre de
            // persona que cruzar, solo el codigo del punto. Conviene decirlo,
            // porque en la lista parece un cliente y no lo es.
            soloMapa.push({nombre, caja:pm.caja||'', puerto:pm.puerto||null, id:pm.id,
                           sinDrop:!pm.nombreReal});
        }
    });

    const sinUbicacion=oficina.filter(c=>!usados.has(normNom(c.nombre)))
        .map(c=>({nombre:c.nombre, servicio:c.servicioWisphub||'', estado:c.estado||'', plan:c.plan||''}));

    return {
        enlazados,
        sinUbicacion,
        sinUbicacionActivos: sinUbicacion.filter(c=>String(c.estado||'').toLowerCase()==='activo'),
        soloMapa,
        totalOficina: oficina.length,
        totalMapa: enMapa.length
    };
}

function pintarCruce(){
    if(!CRUCE) return;
    const q=normNom(document.getElementById('qCruce').value||'');
    const tabs=[
        ['enlazados',     '🔗 Enlazados',        CRUCE.enlazados.length],
        ['activos',       '📍 Falta ubicarlos',  CRUCE.sinUbicacionActivos.length],
        ['sinubicacion',  '👥 Sin ubicación',    CRUCE.sinUbicacion.length],
        ['solomapa',      '🗺️ Solo en el mapa',  CRUCE.soloMapa.length]
    ];
    document.getElementById('cruceTabs').innerHTML=tabs.map(([k,t,n])=>
        `<div class="ct ${cruceTab===k?'on':''}" onclick="cruceTab='${k}';pintarCruce()">${t} <span class="n">${n}</span></div>`).join('');

    let lista, pinta;
    if(cruceTab==='enlazados'){
        lista=CRUCE.enlazados;
        pinta=c=>`<div class="fila">
            <span class="punto" style="background:#10b981"></span>
            <span class="nom">${esc(c.nombre)}${c.como!=='exacta'?` <i style="color:#f59e0b;font-size:.7rem">(${c.como})</i>`:''}</span>
            <span class="meta">${esc(c.caja||'—')}${c.puerto?' · pto '+c.puerto:''}</span>
            <button class="btn btn-sm btn-out" onclick="cerrarCruce();irA('${c.id}')">Ver</button></div>`;
    } else if(cruceTab==='activos'||cruceTab==='sinubicacion'){
        lista=cruceTab==='activos'?CRUCE.sinUbicacionActivos:CRUCE.sinUbicacion;
        pinta=c=>`<div class="fila">
            <span class="punto" style="background:${String(c.estado).toLowerCase()==='activo'?'#f59e0b':'#64748b'}"></span>
            <span class="nom">${esc(c.nombre)}</span>
            <span class="meta">${esc(c.estado||'—')}${c.servicio?' · '+esc(c.servicio):''}</span></div>`;
    } else {
        lista=CRUCE.soloMapa;
        pinta=c=>`<div class="fila">
            <span class="punto" style="background:${c.sinDrop?'#64748b':'#ef4444'}"></span>
            <span class="nom">${esc(c.nombre||'(sin nombre)')}${c.sinDrop?' <i style="color:#94a3b8;font-size:.7rem">(punto sin drop, no trae nombre)</i>':''}</span>
            <span class="meta">${esc(c.caja||'—')}${c.puerto?' · pto '+c.puerto:''}</span>
            <button class="btn btn-sm btn-out" onclick="cerrarCruce();irA('${c.id}')">Ver</button></div>`;
    }
    const filtrada=q.length>1?lista.filter(c=>normNom(c.nombre).includes(q)):lista;
    const ayuda={
        enlazados:'Sabemos en qué caja y puerto está cada uno.',
        activos:'Están activos y cobrando, pero NO aparecen en el mapa. Son los que hay que salir a marcar.',
        sinubicacion:'Todos los de la oficina que no están en el mapa, activos o no.',
        solomapa:'Están dibujados en la red pero ya no son clientes de la oficina. Probablemente retirados.'
    }[cruceTab];
    document.getElementById('cruceLista').innerHTML=
        `<div class="aviso">${ayuda}</div>`+
        (filtrada.length ? filtrada.slice(0,400).map(pinta).join('')
                         : '<div class="vacio">Nada aquí.</div>')+
        (filtrada.length>400?`<div class="vacio">…y ${filtrada.length-400} más. Usa el buscador.</div>`:'');
}

/* ════════════════════════════════════════════════════════════════════
   EDICIÓN: crear, cambiar, mover y borrar
   ────────────────────────────────────────────────────────────────────
   El KML es solo el punto de partida. La red crece todos los dias, asi
   que todo elemento se puede tocar a mano. Al reimportar, lo editado
   aqui se conserva (ver la fusion del importador).
   ════════════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════════════
   MODOS DE TRABAJO
   El mapa hace cosas distintas segun la herramienta elegida. Cada modo
   dice EN PANTALLA que hacer, para que nadie tenga que adivinar ni
   acordarse de nada.
   ════════════════════════════════════════════════════════════════════ */
var MODO='ver', editando=false;
var temp=null;              // capa de trabajo (medicion, trazado, viabilidad)
var puntos=[];              // puntos que se van marcando en medir/trazar

const PISTAS={
    ver:'',
    viabilidad:'🔍 Haz clic donde vive el cliente y te digo a qué cajas alcanza',
    medir:'📏 Ve marcando el recorrido. Doble clic para terminar',
    editar:'✏️ Clic en el mapa para crear · clic en un elemento para cambiarlo',
    cable:'🧵 Marca por dónde pasa el cable. Doble clic para terminar',
    region:'⬟ Marca las esquinas del área. Doble clic para cerrarla',
    ruta:'💡 Haz clic en una caja y te muestro por dónde le llega la señal',
    nota:'🚩 Haz clic donde viste el problema para reportarlo'
};
const BOTONES=[['ver','h_ver'],['viabilidad','h_viab'],['medir','h_medir'],['editar','h_editar'],
               ['cable','h_cable'],['region','h_region'],['ruta','h_ruta'],['nota','h_nota']];

async function modo(m){
    if(!SEDE) return alert('Primero elige una sede.');
    // Solo los modos que ESCRIBEN piden el candado. Mirar, medir y consultar
    // viabilidad no estorban a nadie.
    if(['editar','cable','region'].includes(m) && MODO!==m){
        const c=await tomarCandado(SEDE.id);
        if(!c.ok){
            return alert(`🔒 ${c.por} está editando ${SEDE.nombre} desde hace ${c.min} minuto(s).\n\n`
                +`Si editan los dos a la vez, el último en guardar borra lo del otro.\n\n`
                +`Espera a que termine, o pídele que cierre la pestaña.`);
        }
    }
    limpiarTemporal();
    MODO=m; editando=(m==='editar');
    BOTONES.forEach(([id,btn])=>{
        const b=document.getElementById(btn); if(b) b.classList.toggle('on', MODO===id);
    });
    if(mapa) mapa.getContainer().style.cursor = (m==='ver')?'':'crosshair';
    const p=document.getElementById('pista');
    if(PISTAS[m]){ p.style.display='flex';
        p.innerHTML=`<span>${PISTAS[m]}</span><button onclick="modo('ver')">Salir</button>`; }
    else p.style.display='none';
    pintarPanel();
}

function limpiarTemporal(){
    if(temp&&mapa){ mapa.removeLayer(temp); }
    temp=null; puntos=[]; window._viabPunto=null; window._relieve=null;
}

// Todo clic en el mapa entra por aqui y lo reparte segun el modo.
function clicEnMapa(ev){
    const p=[ev.latlng.lat, ev.latlng.lng];
    if(MODO==='editar')     return nuevoElemento(p);
    if(MODO==='nota')       return nuevaNota(p);
    if(MODO==='viabilidad') return verViabilidad(p);
    if(MODO==='medir'||MODO==='cable'||MODO==='region') return marcarPunto(p);
}

/* ════════════════════════════════════════════════════════════════════
   ILUMINACIÓN DE RUTA — por dónde le llega la señal a una caja
   ────────────────────────────────────────────────────────────────────
   Sube por los cables de caja en caja hasta dar con el POP, y de paso
   suma la ATENUACIÓN del camino con los valores de norma. Asi se sabe
   si un cliente lejano va a tener potencia suficiente ANTES de
   instalarlo, y a quien se le cae el servicio si se corta un tramo.
   ════════════════════════════════════════════════════════════════════ */
// Perdidas tipicas: fibra 0,35 dB/km en 1310 nm, y las de los splitters
// son las que dan los fabricantes.
const DB_KM=0.35, DB_FUSION=0.1, DB_CONECTOR=0.5;
const DB_SPLITTER={2:3.6, 4:7.2, 8:10.5, 16:13.7, 32:17.0, 64:21.0};

function rutaHastaPOP(caja){
    const porNombre={}; RED.elementos.filter(e=>e.tipo==='caja').forEach(c=>porNombre[c.nombre]=c);
    const pasos=[]; let actual=caja, visto=new Set(), dbTotal=0, metrosTotal=0;
    while(actual && !visto.has(actual.id) && pasos.length<40){
        visto.add(actual.id);
        // La perdida del splitter de ESTA caja
        // La perdida la mete CUALQUIER splitter que atraviese la señal, sea de
        // red o de atencion: el splitter parte la luz igual.
        (actual.splitters||[]).forEach(s=>{
            const n=salidasDe(s);
            if(DB_SPLITTER[n]) dbTotal+=DB_SPLITTER[n];
            else if(s.ratio){  // desbalanceado: la perdida del lado que sigue de largo
                const p=parseInt(String(s.ratio).split('/')[0],10);
                if(p) dbTotal+= -10*Math.log10(p/100) + 0.5;
            }
        });
        if(actual.clase==='pop'){ pasos.push({caja:actual, fin:true}); break; }
        // El cable que sube: el mas grueso que salga de aqui hacia una caja no visitada
        const salidas=(actual.cables||[])
            .map(c=>({c, dest:porNombre[c.hacia]}))
            .filter(x=>x.dest && !visto.has(x.dest.id))
            .sort((a,b)=>(b.c.hilos||0)-(a.c.hilos||0));
        if(!salidas.length){ pasos.push({caja:actual, sinSalida:true}); break; }
        const s=salidas[0];
        const cable=RED.elementos.find(e=>e.id===s.c.id);
        const m=cable?(cable.metros||0):0;
        metrosTotal+=m; dbTotal+=m/1000*DB_KM + DB_FUSION*2;
        pasos.push({caja:actual, cable:cable||s.c, metros:m});
        actual=s.dest;
    }
    return {pasos, db:Math.round(dbTotal*10)/10, metros:Math.round(metrosTotal),
            llegaAlPOP: pasos.length>0 && !!pasos[pasos.length-1].fin};
}

function iluminarRuta(caja){
    limpiarTemporal();
    const r=rutaHastaPOP(caja);
    temp=L.layerGroup().addTo(mapa);
    r.pasos.forEach((p,i)=>{
        if(p.cable&&p.cable.g&&p.cable.g.length>1)
            L.polyline(p.cable.g,{color:'#fde047',weight:6,opacity:.85}).addTo(temp);
        L.circleMarker(p.caja.g[0],{radius:7,color:'#fde047',weight:2,
            fillColor:p.fin?'#a855f7':'#0b1220',fillOpacity:1}).addTo(temp);
    });
    pintarRuta(caja, r);
}
function pintarRuta(caja, r){
    const pan=document.getElementById('panel');
    pan.innerHTML=`
      <button class="btn btn-sm btn-out" style="margin-bottom:12px" onclick="modo('ver')">← Salir</button>
      <div class="sec">Por dónde le llega la señal</div>
      <div class="kpis">
        <div class="kpi"><div class="v">${r.pasos.length}</div><div class="e">Saltos</div></div>
        <div class="kpi"><div class="v">${(r.metros/1000).toFixed(2)}<span style="font-size:.7rem"> km</span></div><div class="e">Recorrido</div></div>
        <div class="kpi" style="grid-column:1/-1;text-align:center">
          <div class="v" style="color:${r.db>28?'#ef4444':r.db>24?'#f59e0b':'#10b981'}">−${r.db}<span style="font-size:.75rem"> dB</span></div>
          <div class="e">Atenuación estimada</div></div>
      </div>
      <div class="aviso" style="${r.db>28?'background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#fca5a5'
        :r.db>24?'background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4);color:#fcd34d':''}">
        ${r.db>28?'⚠️ Pasa de 28 dB. Con esa pérdida la ONU puede no enganchar.'
         :r.db>24?'Va justo: entre 24 y 28 dB conviene medir en sitio.'
         :'✅ Dentro de lo normal para GPON (hasta unos 28 dB).'}
      </div>
      ${!r.llegaAlPOP?'<div class="aviso" style="background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4);color:#fcd34d">No llegué hasta el POP: la cadena se corta antes. Puede faltar enlazar algún cable.</div>':''}
      <div class="sec">El camino</div>
      ${r.pasos.map((p,i)=>`
        <div class="dato" style="cursor:pointer" onclick="irA('${p.caja.id}')">

          <span style="font-size:.72rem">${p.cable?`${p.metros} m · ${p.cable.hilos||'?'}H`:(p.fin?'POP':'—')}</span>
        </div>`).join('')}
      <p class="ayuda">Estimación con valores de norma: 0,35 dB/km, 0,1 dB por fusión y la pérdida
        propia de cada splitter (1x8 = 10,5 dB; 1x16 = 13,7). No reemplaza una medición con equipo.</p>`;
}

/* ════════════════════════════════════════════════════════════════════
   MAPA DE CALOR — dónde se concentra la demanda y dónde falta capacidad
   ════════════════════════════════════════════════════════════════════ */
var capaCalor=null;
function alternarCalor(){
    if(!mapa||!SEDE) return;
    const b=document.getElementById('h_calor');
    if(capaCalor){ mapa.removeLayer(capaCalor); capaCalor=null; b.classList.remove('on'); return pintarPanel(); }
    // Sin plugin: circulos proporcionales a los clientes de cada caja. Se lee
    // igual de bien y no suma otra libreria que cargar.
    capaCalor=L.layerGroup().addTo(mapa);
    RED.elementos.filter(e=>e.tipo==='caja'&&e.clase!=='pop').forEach(c=>{
        const n=Object.keys(c.puertos||{}).length; if(!n) return;
        const s=estadoCaja(c);
        L.circle(c.g[0],{radius:40+n*14, color:s.color, weight:0,
            fillColor:s.libres===0?'#ef4444':n>=8?'#f59e0b':'#10b981',
            fillOpacity:.16}).addTo(capaCalor);
    });
    b.classList.add('on');
    pintarPanel();
}

/* ════════════════════════════════════════════════════════════════════
   VIABILIDAD — "¿puedo vender en esta dirección?"
   Es la pregunta comercial de todos los dias, y hasta ahora habia que
   mandar un tecnico a mirar. Se marca donde vive el cliente y salen
   las cajas con PUERTO LIBRE ordenadas por distancia, con lo que
   mediria el drop en linea recta.
   ════════════════════════════════════════════════════════════════════ */
const DROP_MAX=250;   // mas alla de esto ya no es un drop, es obra

function verViabilidad(p){
    limpiarTemporal();
    window._viabPunto=p;
    const cerca=RED.elementos
        .filter(e=>e.tipo==='caja'&&e.clase!=='pop')
        .map(c=>({c, d:Math.round(metros(p,c.g[0])), s:estadoCaja(c)}))
        .filter(x=>x.d<=DROP_MAX*3)
        .sort((a,b)=>a.d-b.d);
    const conCupo=cerca.filter(x=>x.s.libres>0);

    temp=L.layerGroup().addTo(mapa);
    L.circleMarker(p,{radius:8,color:'#fff',weight:2,fillColor:'#0ea5e9',fillOpacity:1}).addTo(temp);
    L.circle(p,{radius:DROP_MAX,color:'#0ea5e9',weight:1,dashArray:'5,6',fill:false}).addTo(temp);
    conCupo.slice(0,5).forEach((x,i)=>{
        L.polyline([p,x.c.g[0]],{color:i===0?'#10b981':'#64748b',weight:i===0?3:1.5,
                    dashArray:i===0?null:'4,5',opacity:.9}).addTo(temp);
    });
    pintarViabilidad(p, cerca, conCupo);
}

    const pan=document.getElementById('panel');
    const fila=(x,i)=>{

        return `<div class="viab" onclick="irA('${x.c.id}')" style="${i===0?'border-color:#10b981;':''}">

          </div>
          ${!dentro?`<p class="ayuda" style="color:#f59e0b">⚠️ Pasa de ${DROP_MAX} m: toca tender obra, no un drop normal</p>`:''}
        </div>`;
    };
    pan.innerHTML=`
      <button class="btn btn-sm btn-out" style="margin-bottom:12px" onclick="modo('ver')">← Salir de viabilidad</button>
      <div class="sec">¿Hay cupo aquí?</div>
      <p class="ayuda" style="margin-bottom:10px">📍 ${p[0].toFixed(6)}, ${p[1].toFixed(6)}</p>
      ${conCupo.length ? `
        <div class="aviso" style="background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.4);color:#6ee7b7">
          ✅ <b>SÍ se puede.</b> La más cercana con cupo está a <b>${conCupo[0].d} m</b>.
        </div>
        ${conCupo.slice(0,6).map(fila).join('')}`
      : cerca.length ? `
        <div class="aviso" style="background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#fca5a5">
          ❌ <b>No hay cupo cerca.</b> Hay ${cerca.length} caja(s) a la redonda pero todas están llenas
          o sin capacidad definida.
        </div>
        ${cerca.slice(0,5).map((x,i)=>`<div class="viab" onclick="irA('${x.c.id}')">
          <div class="cab"><span class="punto" style="background:${x.s.color}"></span>

          <span style="font-size:.76rem;color:${x.s.color}">${x.s.et}</span></div>`).join('')}`
      : `<div class="aviso" style="background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#fca5a5">

        </div>`}
      <p class="ayuda" style="margin-top:10px">El círculo azul marca los ${DROP_MAX} m que suele
        alcanzar un drop. Las distancias son en línea recta: por poste siempre da más.</p>`;

function largoActual(){ let d=0; for(let i=1;i<puntos.length;i++) d+=metros(puntos[i-1],puntos[i]); return d; }
// Área de un polígono en m², proyectando a metros alrededor de su centro.
function areaDe(poly){
    const lat0=poly.reduce((s,p)=>s+p[0],0)/poly.length;
    const k=Math.cos(lat0*Math.PI/180)*111320, k2=110540;
    let a=0;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
        const xi=poly[i][1]*k, yi=poly[i][0]*k2, xj=poly[j][1]*k, yj=poly[j][0]*k2;
        a+=(xj+xi)*(yj-yi);
    }
    return Math.abs(a/2);
}

      ${MODO==='medir'

               <div class="dato"><b>Con relieve</b><span style="color:#10b981;font-weight:700">${window._relieve.real} m</span></div>
               <div class="dato"><b>Diferencia</b><span>+${window._relieve.real-window._relieve.plano} m</span></div>
               <div class="dato"><b>Desnivel</b><span>${window._relieve.desnivel} m (${Math.round(window._relieve.min)}–${Math.round(window._relieve.max)} msnm)</span></div>
             </div>
             <p class="ayuda">El cable se compra por metro: pide el largo con relieve, no el plano.</p>`
           :`<p class="ayuda">Sigue marcando por donde iría el cable. Cada clic suma un tramo.</p>`}
           ${puntos.length>1?`
             <button class="btn btn-sm btn-out" style="width:100%;margin-top:8px"
               onclick="medirConRelieve()">⛰️ Calcular con el relieve</button>
             <button class="btn btn-sm btn-out" style="width:100%;margin-top:6px"
               onclick="deshacerPunto()">↩️ Quitar el último punto</button>`:''}`
        : `<p class="ayuda">Marca por dónde pasa el cable, poste por poste.</p>
           ${puntos.length>1?`
             <button class="btn btn-sm btn-primary" style="margin-top:10px" onclick="guardarCable()">
               💾 Guardar este cable (${Math.round(d)} m)</button>
             <button class="btn btn-sm btn-out" style="width:100%;margin-top:6px"
               onclick="deshacerPunto()">↩️ Quitar el último punto</button>`
            :'<p class="ayuda">Necesitas al menos dos puntos.</p>'}`}`;
}
/* ════════════════════════════════════════════════════════════════════
   ALTIMETRÍA — el metraje real sube con el relieve
   ────────────────────────────────────────────────────────────────────
   Una medición plana se queda corta en terreno quebrado, y el cable se
   compra por metro. Se piden las alturas a Open-Elevation, que es
   gratuito y no pide llave, y se recalcula el largo en 3D.
   Si el servicio no responde se dice y se deja la medida plana: mejor
   un dato honesto que uno inventado.
   ════════════════════════════════════════════════════════════════════ */
async function medirConRelieve(){
    if(puntos.length<2) return;
    mostrarCarga('Consultando el relieve…');
    try{
        // Se densifica el recorrido para que el perfil no se salte lomas
        const densos=[];
        for(let i=1;i<puntos.length;i++){
            const a=puntos[i-1], b=puntos[i], d=metros(a,b);
            const n=Math.min(20,Math.max(1,Math.round(d/50)));
            for(let k=0;k<n;k++) densos.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
        }
        densos.push(puntos[puntos.length-1]);
        if(densos.length>100) throw new Error('El recorrido es muy largo para consultar el relieve de una vez. '
            +'Pártelo en tramos más cortos.');
        const r=await fetch('https://api.open-elevation.com/api/v1/lookup',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({locations:densos.map(p=>({latitude:p[0],longitude:p[1]}))})
        });
        if(!r.ok) throw new Error('El servicio de relieve respondió '+r.status);
        const j=await r.json();
        const alt=(j.results||[]).map(x=>x.elevation);
        if(alt.length!==densos.length) throw new Error('El servicio devolvió menos puntos de los pedidos.');
        let plano=0, real=0;
        for(let i=1;i<densos.length;i++){
            const d=metros(densos[i-1],densos[i]);
            const dh=(alt[i]-alt[i-1]);
            plano+=d; real+=Math.sqrt(d*d+dh*dh);
        }
        window._relieve={plano:Math.round(plano), real:Math.round(real),
                         min:Math.min(...alt), max:Math.max(...alt),
                         desnivel:Math.round(Math.max(...alt)-Math.min(...alt))};
        ocultarCarga(); pintarPanel();
    }catch(e){
        ocultarCarga();
        alert('No se pudo consultar el relieve:\n\n'+(e.message||e)
            +'\n\nLa medida plana sigue siendo válida; solo le falta el desnivel.');
    }
}

/* Fase de obra de cada elemento. OZmap distingue diseño, aprobación,
   construcción y operación; aqui se deduce del texto que ya viene en el
   KML, que no es uniforme ("Implementado", "Implementada y certificada"). */
const FASES={
    certificado:{et:'Certificado',      color:'#10b981', ico:'✓'},
    operando:   {et:'En operación',     color:'#0ea5e9', ico:'●'},
    obra:       {et:'En construcción',  color:'#f59e0b', ico:'⚒'},
    diseno:     {et:'En diseño',        color:'#a855f7', ico:'✎'},
    baja:       {et:'Fuera de servicio',color:'#64748b', ico:'✕'}
};
function faseDe(el){
    const s=(el.estado||'').toLowerCase();
    if(/certificad/.test(s))              return 'certificado';
    if(/implementad|operac|activ/.test(s))return 'operando';
    if(/construc|obra|ejecu/.test(s))     return 'obra';
    if(/plane|diseñ|disen|proyect/.test(s))return 'diseno';
    if(/fuera|baja|retir|inactiv/.test(s))return 'baja';
    return 'operando';
}
