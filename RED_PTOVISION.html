<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RED · PROYECTOVISION</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2740;--border:#243044;--text:#e6edf6;--muted:#94a3b8;--accent:#0ea5e9;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hidden{display:none!important;}

/* ── LOGIN ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:linear-gradient(135deg,#064e3b 0%,#065f46 60%,#0f766e 100%);}
.login-card{background:var(--card);border-radius:18px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-logo{text-align:center;font-size:2.6rem;margin-bottom:6px;}
.login-card h1{font-size:1.3rem;text-align:center;margin-bottom:4px;}
.login-card .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:22px;}
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;font-weight:600;}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:1rem;margin-bottom:14px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
.btn{border:none;border-radius:10px;padding:11px 16px;font-size:.9rem;font-weight:700;cursor:pointer;
     transition:transform .08s,opacity .2s;font-family:inherit;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,#10b981,#059669);color:#fff;width:100%;}
.btn-sm{padding:6px 11px;font-size:.76rem;border-radius:8px;}
.btn-out{background:transparent;color:var(--text);border:1px solid var(--border);}
.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab{flex:1;padding:9px;text-align:center;border-radius:9px;background:var(--card2);cursor:pointer;
     font-size:.82rem;font-weight:700;border:1px solid var(--border);color:var(--muted);}
.tab.on{background:rgba(16,185,129,.15);border-color:#10b981;color:#10b981;}

/* ── APP ── */
#app{display:flex;flex-direction:column;height:100vh;}
.top{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--card);
     border-bottom:1px solid var(--border);flex-wrap:wrap;}
.top .marca{font-weight:800;letter-spacing:.4px;font-size:.95rem;}
.top .marca span{color:#10b981;}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:.74rem;color:var(--muted);}
.crece{flex:1;}
.cuerpo{flex:1;display:flex;min-height:0;}
#mapa{flex:1;background:#0b1220;}
.panel{width:330px;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;padding:14px;}
@media(max-width:820px){.cuerpo{flex-direction:column;}.panel{width:100%;max-height:44%;border-left:none;border-top:1px solid var(--border);}}
.sec{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
     margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.sec:first-child{margin-top:0;}
.capa{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:.83rem;cursor:pointer;user-select:none;}
.capa input{width:auto;margin:0;}
.punto{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.35);}
.raya{width:16px;height:3px;border-radius:2px;flex-shrink:0;}
.cuenta{margin-left:auto;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.ficha{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:10px;}
.ficha h3{font-size:.95rem;margin-bottom:3px;word-break:break-word;}
.ficha .tipo{font-size:.74rem;color:var(--muted);margin-bottom:9px;}
.dato{display:flex;justify-content:space-between;gap:10px;font-size:.79rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.dato b{color:var(--muted);font-weight:600;}
.dato span{text-align:right;word-break:break-word;}
.puertos{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px;margin-top:9px;}
.pto{border-radius:7px;padding:5px 3px;text-align:center;font-size:.68rem;font-weight:700;border:1px solid var(--border);cursor:pointer;}
.pto.libre{background:rgba(16,185,129,.12);color:#10b981;border-color:rgba(16,185,129,.4);}
.pto.ocup{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.35);}
.vacio{text-align:center;color:var(--muted);font-size:.83rem;padding:26px 10px;line-height:1.5;}
.aviso{background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.3);border-radius:10px;
       padding:11px;font-size:.78rem;color:#7dd3fc;line-height:1.5;margin-bottom:12px;}
.leaflet-container{background:#0b1220;}
.popup-red b{display:block;font-size:.86rem;margin-bottom:3px;}
.popup-red small{color:#555;}
/* ── Cruce clientes ↔ red ── */
#cruce{position:fixed;inset:0;background:rgba(4,8,16,.82);z-index:900;display:flex;align-items:center;justify-content:center;padding:18px;}
.cruce-caja{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:760px;
            max-height:88vh;display:flex;flex-direction:column;padding:16px;}
.cruce-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.cruce-top b{font-size:1rem;}
.cruce-tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
.ct{padding:7px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--border);
    cursor:pointer;font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;}
.ct.on{border-color:var(--accent);color:var(--accent);background:rgba(14,165,233,.12);}
.ct .n{font-variant-numeric:tabular-nums;}
.cruce-lista{overflow-y:auto;flex:1;min-height:120px;}
.fila{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.82rem;}
.fila:hover{background:var(--card2);}
.fila .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fila .meta{font-size:.72rem;color:var(--muted);white-space:nowrap;}
/* ── Ventanas propias (en vez de los prompt del navegador) ── */
#modal{position:fixed;inset:0;background:rgba(4,8,16,.78);z-index:1200;display:flex;
       align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px);}
.mcaja{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;
       max-width:440px;max-height:88vh;display:flex;flex-direction:column;
       box-shadow:0 24px 70px rgba(0,0,0,.55);}
.mtop{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.mtop b{font-size:.98rem;}
.mcuerpo{padding:16px 18px;overflow-y:auto;}
.mcuerpo label{margin-top:10px;}
.mcuerpo label:first-child{margin-top:0;}
.mpie{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;}
.mcuerpo input,.mcuerpo select,.mcuerpo textarea{margin-bottom:2px;padding:10px;font-size:.9rem;}
.ayuda{font-size:.72rem;color:var(--muted);margin:4px 0 0;line-height:1.45;}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;margin-top:4px;}
.opc{border:1px solid var(--border);background:var(--card2);border-radius:10px;padding:11px 7px;
     text-align:center;cursor:pointer;font-size:.76rem;font-weight:700;transition:.12s;}
.opc:hover{border-color:var(--accent);}
.opc.on{border-color:#10b981;background:rgba(16,185,129,.14);color:#10b981;}
.opc .ic{display:block;font-size:1.3rem;margin-bottom:3px;}

/* ── Símbolos de red sobre el mapa ── */
.mk{display:flex;align-items:center;justify-content:center;font-weight:800;color:#04121f;
    border:2px solid rgba(0,0,0,.45);box-shadow:0 2px 6px rgba(0,0,0,.5);}
.mk-caja{width:26px;height:20px;border-radius:4px;font-size:.62rem;}
.mk-mufla{width:22px;height:22px;border-radius:50%;font-size:.6rem;}
.mk-pop{width:30px;height:30px;border-radius:7px;font-size:.9rem;color:#fff;}
.mk-rot{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:2px;
        font-size:9.5px;font-weight:700;color:#e6edf6;text-shadow:0 0 4px #000,0 0 3px #000;
        white-space:nowrap;pointer-events:none;}
.leaflet-marker-icon{background:none;border:none;}

/* ── Leyenda ── */
.leyenda{position:absolute;left:10px;bottom:20px;z-index:500;background:rgba(19,28,46,.94);
         border:1px solid var(--border);border-radius:11px;padding:10px 12px;font-size:.72rem;
         line-height:1.7;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.leyenda b{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;

.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;
           vertical-align:-2px;border:1px solid rgba(0,0,0,.4);}

/* ── Resumen arriba del panel ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.kpi{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 10px;}
.kpi .v{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;}
.kpi .e{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
.barra{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:8px;display:flex;}
.barra span{display:block;height:100%;}
#cargando{position:fixed;inset:0;background:rgba(11,18,32,.92);display:flex;align-items:center;
          justify-content:center;flex-direction:column;gap:14px;z-index:9999;}
.spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:#10b981;border-radius:50%;animation:g .8s linear infinite;}
@keyframes g{to{transform:rotate(360deg)}}

<body>

<div id="login">

    <p class="sub">Planta externa · PROYECTOVISION</p>

</div>

<div id="app" class="hidden">
  <div class="top">

    <span class="chip" id="chipSede">—</span>

</div>

<div id="modal" class="hidden"><div class="mcaja">
  <div class="mtop"><b id="mTit">—</b></div>

  <div class="mpie" id="mPie"></div>
</div></div>

<!-- ══════════ CRUCE CLIENTES ↔ RED ══════════ -->
<div id="cruce" class="hidden">
  <div class="cruce-caja">
    <div class="cruce-top">
      <b id="cruceTitulo">Clientes vs. Red</b>
      <div class="crece"></div>
      <button class="btn btn-sm btn-out" onclick="exportarCruce()">📊 Exportar</button>
      <button class="btn btn-sm btn-out" onclick="cerrarCruce()">✕ Cerrar</button>
    </div>
    <div class="cruce-tabs" id="cruceTabs"></div>
    <input type="text" id="qCruce" placeholder="Buscar por nombre…" oninput="pintarCruce()" style="margin:0 0 10px;">
    <div class="cruce-lista" id="cruceLista"></div>
  </div>
</div>

<input type="file" id="fileKML" accept=".kml,.kmz" class="hidden" onchange="importarKML(this.files[0])">
<div id="cargando"><div class="spin"></div><div id="cargandoTxt" style="color:var(--muted);font-size:.86rem;">Cargando…</div></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   RED · PROYECTOVISION — planta externa
   ────────────────────────────────────────────────────────────────────
   Vive aparte de OFICINAS a proposito: solo Florencia trae 6.536
   elementos y las librerias de mapa, y OFICINAS ya pesa 1,7 MB para
   gente que solo registra pagos.
   El acceso NO crea claves nuevas: valida contra las mismas de
   OFICINAS (oficinas_sistema/main), asi que cambiar la clave alla
   la cambia aqui.
   ════════════════════════════════════════════════════════════════════ */

const APP_VERSION_RED = 4;

const firebaseConfig = {
    apiKey: "AIzaSyDxDOjSzmsSNnULxmzyH2JM80u8AMFpO9w",
    authDomain: "inventario-88a28.firebaseapp.com",
    projectId: "inventario-88a28",
    storageBucket: "inventario-88a28.firebasestorage.app",
    messagingSenderId: "981251888141",
    appId: "1:981251888141:web:85e27f09ec4350c27c7144"
};
const COLECCION='oficinas_sistema';
const DOC_ID='main';
// Un documento de Firestore no admite mas de 1 MB y Florencia sola pesa
// ~1,4 MB, asi que la red va fragmentada igual que movimientos y clientes.
const TOPE_FRAGMENTO = 700*1024;

// Con var y no let: quedan alcanzables desde la consola del navegador, que es
// como se diagnostica cuando algo falla en una oficina y no hay forma de
// reproducirlo aqui.
var db=null, DB=null, USER=null, SEDE=null;
var RED={elementos:[]};          // la red de la sede abierta
var mapa=null, capas={}, fondoSat=false, capaBase=null;

/* ── Arranque ───────────────────────────────────────────────────── */
(async function init(){
    try{
        firebase.initializeApp(firebaseConfig);
        db=firebase.firestore();
        const snap=await db.collection(COLECCION).doc(DOC_ID).get();
        DB=snap.exists?snap.data():{};
        const ofis=(DB.oficinas||[]).filter(o=>o&&o.id);
        document.getElementById('selOfi').innerHTML =
            ofis.length ? ofis.map(o=>`<option value="${o.id}">${esc(o.nombre)}</option>`).join('')
                        : '<option value="">No hay oficinas</option>';
    }catch(e){
        alert('No se pudo conectar con la base de datos.\n\n'+(e.message||e));
    }
    ocultarCarga();
})();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mostrarCarga(t){ document.getElementById('cargandoTxt').textContent=t||'Cargando…';
                          document.getElementById('cargando').classList.remove('hidden'); }
function ocultarCarga(){ document.getElementById('cargando').classList.add('hidden'); }

function verTab(t){
    window._tab=t;
    document.getElementById('tabOfi').classList.toggle('on',t==='oficina');
    document.getElementById('tabAdm').classList.toggle('on',t==='admin');
    document.getElementById('frmOficina').classList.toggle('hidden',t!=='oficina');
    document.getElementById('frmAdmin').classList.toggle('hidden',t!=='admin');
}

async function entrar(tipo){
    if(!DB) return alert('Todavía no cargaron los datos. Espera un momento.');
    if(tipo==='admin'){
        if(document.getElementById('passAdm').value!==DB.adminPass) return alert('❌ Contraseña incorrecta');
        USER={role:'admin', nombre:'Administrador'};
    }else{
        const id=document.getElementById('selOfi').value;
        const o=(DB.oficinas||[]).find(x=>x.id===id);
        if(!o) return alert('❌ Selecciona una oficina');
        if(document.getElementById('passOfi').value!==o.password) return alert('❌ Contraseña incorrecta');
        USER={role:'oficina', id:o.id, nombre:o.nombre};
    }
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    const ofis=(DB.oficinas||[]).filter(o=>o&&o.id);
    if(USER.role==='admin'){
        const sel=document.getElementById('selSede');
        sel.innerHTML=ofis.map(o=>`<option value="${o.id}">${esc(o.nombre)}</option>`).join('');
        sel.classList.remove('hidden');
        document.getElementById('chipSede').classList.add('hidden');
        await cambiarSede(ofis[0]?ofis[0].id:null);
    }else{
        document.getElementById('chipSede').textContent=USER.nombre;
        await cambiarSede(USER.id);
    }
}
function salir(){ location.reload(); }

async function cambiarSede(id){
    if(!id) return;
    SEDE=(DB.oficinas||[]).find(o=>o.id===id)||null;
    mostrarCarga('Cargando la red de '+(SEDE?SEDE.nombre:'')+'…');
    window._yaEncuadrado=false;   // al cambiar de sede el mapa vuelve a centrarse
    RED=await cargarRed(id);
    // OJO: crearMapa es asincrono (carga Leaflet). Sin await, dibujar() corria
    // antes de que existiera el mapa, se salia por su guarda y la sede se veia
    // VACIA aunque los datos estuvieran bien guardados. Al importar si se veia,
    // porque para entonces ya habia pasado tiempo de sobra.
    if(!mapa) await crearMapa();
    ocultarCarga();
    dibujar();
}

/* ── Guardado fragmentado ─────────────────────────────────────────
   FIRESTORE NO ACEPTA ARREGLOS DENTRO DE ARREGLOS, y la geometria es
   justo eso: [[lat,lon],[lat,lon],...]. Al guardar se APLANA a
   [lat,lon,lat,lon,...] y al leer se vuelve a armar.
   Se aplana en vez de usar el truco de la casa (convertir cada par en
   un objeto {0:..,1:..}) porque para los 16.378 vertices de Florencia
   eso pesaria 485 KB y plano son 325 KB.                            */
function aplanar(el){
    const c=Object.assign({},el);
    if(Array.isArray(c.g)){ c.g=[]; el.g.forEach(p=>{ c.g.push(p[0],p[1]); }); }
    return c;
}
function desaplanar(el){
    const c=Object.assign({},el);
    if(Array.isArray(c.g)){
        const p=[];
        for(let i=0;i+1<c.g.length;i+=2) p.push([c.g[i], c.g[i+1]]);
        c.g=p;
    }
    return c;
}
// Guardia: si alguna vez vuelve a colarse un arreglo anidado, que se vea
// aqui y no en un mensaje de Firebase que no dice donde esta.
function buscarAnidados(obj, ruta){
    ruta=ruta||'';
    if(Array.isArray(obj)){
        for(let i=0;i<obj.length;i++){
            if(Array.isArray(obj[i])) return ruta+'['+i+']';
            const r=buscarAnidados(obj[i], ruta+'['+i+']');
            if(r) return r;
        }
    }else if(obj&&typeof obj==='object'){
        for(const k of Object.keys(obj)){
            const r=buscarAnidados(obj[k], ruta+'.'+k);
            if(r) return r;
        }
    }
    return null;
}

async function cargarRed(oficinaId){
    const out={elementos:[]};
    try{
        const idx=await db.collection(COLECCION).doc('red_index').get();
        const info=(idx.exists?idx.data():{})[oficinaId];
        const n=info&&info.fragmentos?info.fragmentos:0;
        for(let i=0;i<n;i++){
            const d=await db.collection(COLECCION).doc(`red_${oficinaId}_${i}`).get();
            if(d.exists&&Array.isArray(d.data().elementos))
                out.elementos.push(...d.data().elementos.map(desaplanar));
        }
    }catch(e){ console.warn('cargarRed',e); }
    return out;
}

async function guardarRed(oficinaId, elementos){
    // Se parte en fragmentos por PESO, no por cantidad: un cable de 359
    // vertices pesa lo que cientos de postes.
    const planos=elementos.map(aplanar);
    const mal=buscarAnidados(planos);
    if(mal) throw new Error('Hay un arreglo dentro de otro en '+mal+', y Firestore no los admite. '
                          + 'Avisa de esto: es un fallo del programa, no de tus datos.');
    const frags=[[]]; let peso=0;
    planos.forEach(el=>{
        const w=JSON.stringify(el).length;
        if(peso+w>TOPE_FRAGMENTO && frags[frags.length-1].length){ frags.push([]); peso=0; }
        frags[frags.length-1].push(el); peso+=w;
    });
    for(let i=0;i<frags.length;i++){
        await db.collection(COLECCION).doc(`red_${oficinaId}_${i}`)
                .set({elementos:frags[i], actualizado:Date.now()});
    }
    // Si antes habia mas fragmentos, se vacian para no dejar datos zombis
    const idx=await db.collection(COLECCION).doc('red_index').get();
    const datos=idx.exists?idx.data():{};
    const antes=(datos[oficinaId]&&datos[oficinaId].fragmentos)||0;
    for(let i=frags.length;i<antes;i++){
        await db.collection(COLECCION).doc(`red_${oficinaId}_${i}`).set({elementos:[], actualizado:Date.now()});
    }
    datos[oficinaId]={fragmentos:frags.length, elementos:elementos.length, actualizado:Date.now()};
    await db.collection(COLECCION).doc('red_index').set(datos);
    return frags.length;
}

/* ════════════════════════════════════════════════════════════════════
   IMPORTADOR DE KML / KMZ
   Comprobado contra el export real de OZmap (Florencia, 6.536
   elementos): carpetas por tipo, puntos y recorridos, y el "Tipo:"
   dentro de la descripcion.
   ════════════════════════════════════════════════════════════════════ */
function pedirKML(){
    if(!SEDE) return alert('Primero elige una sede.');
    document.getElementById('fileKML').click();
}

async function importarKML(archivo){
    if(!archivo) return;
    document.getElementById('fileKML').value='';
    if(!confirm(`¿Importar "${archivo.name}" a ${SEDE.nombre}?\n\n`
        +`Los elementos que ya existan con el MISMO nombre y tipo se actualizan; `
        +`los nuevos se agregan. No se borra nada.`)) return;
    mostrarCarga('Leyendo el archivo…');
    try{
        let texto;
        if(/\.kmz$/i.test(archivo.name)){
            await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
            const zip=await JSZip.loadAsync(archivo);
            const nom=Object.keys(zip.files).find(n=>/\.kml$/i.test(n));
            if(!nom) throw new Error('El KMZ no trae ningún .kml adentro.');
            texto=await zip.file(nom).async('string');
        }else{
            texto=await archivo.text();
        }
        mostrarCarga('Interpretando la red…');
        const nuevos=leerKML(texto);
        if(!nuevos.length){ ocultarCarga(); return alert('No se encontró ningún elemento en el archivo.'); }

        mostrarCarga('Deduciendo qué cliente cuelga de qué caja…');
        enlazarTopologia(nuevos);

        // Fusion con lo que ya hay. La llave NO puede ser solo tipo + nombre:
        //  · las 940 reservas se llaman todas "20m" o "30m" → con esa llave
        //    quedaban 6 de 940;
        //  · y en un mismo poste hay VARIAS reservas, una por cada cable que
        //    pasa: se comprobo un poste con 6 reservas de 20m, cada una de un
        //    cable distinto. Por eso entra tambien el cable al que pertenecen.
        // Con tipo + nombre + coordenada + cable sobreviven 6.535 de 6.536.
        const llave=e=>{
            const p=(e.g&&e.g[0])?e.g[0][0].toFixed(6)+','+e.g[0][1].toFixed(6):'?';
            const extra=e.cable||e.subtipo||'';
            return e.tipo+'||'+(e.nombre||'').trim().toLowerCase()+'||'+p+'||'+extra;
        };
        const indice={}; RED.elementos.forEach((e,i)=>{ indice[llave(e)]=i; });
        let act=0, add=0;
        nuevos.forEach(n=>{
            const k=llave(n), i=indice[k];
            if(i!==undefined){
                // Se conserva lo que se editó a mano aquí (splitters y notas)
                const viejo=RED.elementos[i];
                n.id=viejo.id;
                if(viejo.splitters&&viejo.splitters.length) n.splitters=viejo.splitters;
                if(viejo.notas) n.notas=viejo.notas;
                RED.elementos[i]=n; act++;
            }else{ RED.elementos.push(n); indice[k]=RED.elementos.length-1; add++; }
        });

        mostrarCarga('Guardando…');
        const nf=await guardarRed(SEDE.id, RED.elementos);
        ocultarCarga();
        dibujar();
        const cuenta={}; nuevos.forEach(n=>{ const t=claseDe(n); cuenta[t]=(cuenta[t]||0)+1; });
        alert(`✅ Importación terminada — ${SEDE.nombre}\n\n`
            + `• Elementos nuevos: ${add}\n• Actualizados: ${act}\n`
            + `• Total en la sede: ${RED.elementos.length}\n• Fragmentos guardados: ${nf}\n\n`
            + Object.entries(cuenta).sort((a,b)=>b[1]-a[1])
                    .map(([t,n])=>`   ${TIPOS[t]?TIPOS[t].et:t}: ${n}`).join('\n'));
    }catch(e){
        ocultarCarga();
        alert('❌ No se pudo importar:\n\n'+(e.message||e));
        console.error(e);
    }
}

function cargarScript(src){
    return new Promise((ok,mal)=>{
        if([...document.scripts].some(s=>s.src===src)) return ok();
        const s=document.createElement('script'); s.src=src;
        s.onload=()=>ok(); s.onerror=()=>mal(new Error('No se pudo cargar '+src));
        document.head.appendChild(s);
    });
}

// Lee el KML manteniendo la RUTA de carpetas, que es lo que dice de qué
// tipo es cada elemento.
function leerKML(xml){
    const marcas=[]; const re=/<(\/?)(Folder|Placemark)\b[^>]*>/g; let m;
    while((m=re.exec(xml))) marcas.push({cierra:m[1]==='/', tag:m[2], i:m.index, fin:re.lastIndex});
    const uno=(f,t)=>{ const r=new RegExp('<'+t+'\\s*>([\\s\\S]*?)<\\/'+t+'>'); const x=f.match(r); return x?x[1]:''; };
    const out=[]; let pila=[];
    for(let k=0;k<marcas.length;k++){
        const a=marcas[k];
        if(a.tag==='Folder'){
            if(a.cierra) pila.pop();
            else { const s=marcas[k+1];
                   pila.push((uno(xml.slice(a.fin, s?s.i:a.fin+400),'name')||'?').trim()); }
            continue;
        }
        if(a.tag!=='Placemark'||a.cierra) continue;
        let j=k+1,p=1;
        while(j<marcas.length&&p>0){ if(marcas[j].tag==='Placemark') p+=marcas[j].cierra?-1:1; j++; }
        const frag=xml.slice(a.fin, marcas[j-1]?marcas[j-1].i:xml.length);
        const coords=(uno(frag,'coordinates')||'').trim();
        if(!coords) continue;
        const g=coords.split(/\s+/).filter(Boolean).map(t=>{
            const q=t.split(','); return [parseFloat(q[1]), parseFloat(q[0])];
        }).filter(q=>!isNaN(q[0])&&!isNaN(q[1]));
        if(!g.length) continue;
        const desc=(uno(frag,'description')||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
        out.push(armar({
            ruta:pila.join('/'),
            nombre:(uno(frag,'name')||'').trim(),
            desc, g,
            esLinea:/<LineString/.test(frag)
        }));
    }
    return out.filter(Boolean);
}

// Del "Tipo: FIBRA 48H 6B" saca 48 hilos y 6 buffers. Hay que normalizar
// porque en el mismo archivo conviven "FIBRA 48H4B", "FIBRA 48H 4B",
// "FIBRA 96-H 8-B FLORENCIA" y "FIBRA 12 HILOS - UNICO BUFER".
function hilosDe(t){
    const s=(t||'').toUpperCase();
    // Sin \b despues de la H: en el archivo real viene "FIBRA 48H4B", con el
    // buffer pegado al hilo, y exigir limite de palabra ahi lo dejaba sin leer.
    const h=s.match(/(\d+)\s*-?\s*H(?:ILOS?)?(?![A-Z])/);
    let b=s.match(/(\d+)\s*-?\s*B(?:UFF?ER)?(?![A-Z])/);
    let buf=b?+b[1]:null;
    if(!buf && /UNICO\s+BUF/.test(s)) buf=1;
    const hil=h?+h[1]:null;
    if(!buf && hil===1) buf=1;          // un drop de un hilo no tiene buffer aparte
    return {hilos:hil, buffers:buf};
}
// Un splitter real no pasa de 1x64. Sirve para no creerle a un dato malo.
const MAX_PUERTOS=64;
function capacidadDe(t){ const m=(t||'').match(/(\d+)\s*[xX]\s*(\d+)/); return m?+m[2]:null; }
function campo(desc,et){
    const r=new RegExp(et+':\\s*(.*?)(?:\\s*(?:Tipo|Estado de implementación|Comentarios|Et[íi]quetas):|$)');
    const m=(desc||'').match(r); return m?m[1].trim():'';
}

function armar(x){
    const ruta=x.ruta.toLowerCase();
    const tipoTxt=campo(x.desc,'Tipo');
    const el={
        id:'e'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
        nombre:x.nombre, subtipo:tipoTxt,
        estado:campo(x.desc,'Estado de implementación'),
        notas:campo(x.desc,'Comentarios'),
        etiquetas:(campo(x.desc,'Etíquetas')||campo(x.desc,'Etiquetas')||'').split(',').map(s=>s.trim()).filter(Boolean),
        g:x.g
    };
    if(x.esLinea){
        el.tipo='cable';
        el.clase = /drop/.test(ruta)?'drop' : /primario/.test(ruta)?'primario'
                 : /secundario/.test(ruta)?'secundario' : /terciario/.test(ruta)?'terciario' : 'secundario';
        const hb=hilosDe(tipoTxt); el.hilos=hb.hilos; el.buffers=hb.buffers;
        el.metros=largoDe(x.g);
    } else if(/pop/.test(ruta)){
        el.tipo='caja'; el.clase='pop';
    } else if(/caja/.test(ruta)){
        el.tipo='caja';
        el.clase = /\/ce/.test(ruta)||/mufla/i.test(tipoTxt) ? 'mufla'
                 : /nap/.test(ruta) ? 'nap' : 'cto';
        const cap=capacidadDe(tipoTxt);
        el.splitters = cap ? [{tipo:'1x'+cap, ratio:''}] : [];
        el.puertos={};
    } else if(/reserva/.test(ruta)){
        el.tipo='reserva';
        el.metros=parseFloat((x.nombre||'').replace(',','.'))||null;
        el.cable=x.desc.trim();
    } else if(/cliente/.test(ruta)){
        el.tipo='cliente';
        // Hay nombres con puertos imposibles ("PTO 74985 PREC 004984",
        // "PTO 000098"): son errores de digitacion en OZmap. Si se aceptan,
        // la caja termina con una capacidad deducida absurda.
        const p=(x.nombre||'').match(/PTO\s*0*(\d+)/i);
        const n=p?+p[1]:null;
        el.puerto=(n&&n>0&&n<=MAX_PUERTOS)?n:null;
        if(n&&(n>MAX_PUERTOS||n<=0)) el.puertoDudoso=n;
    } else {
        el.tipo='poste';
    }
    return el;
}
function claseDe(e){ return e.tipo==='cable'||e.tipo==='caja' ? e.clase : e.tipo; }

function largoDe(g){
    let d=0;
    for(let i=1;i<g.length;i++) d+=metros(g[i-1],g[i]);
    return Math.round(d);
}
function metros(a,b){
    const R=6371000, f=x=>x*Math.PI/180;
    const dLat=f(b[0]-a[0]), dLon=f(b[1]-a[1]);
    const h=Math.sin(dLat/2)**2+Math.cos(f(a[0]))*Math.cos(f(b[0]))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
}

/* Deduce qué cliente cuelga de qué caja usando la geometría del drop:
   un extremo cae sobre el cliente y el otro sobre la caja. Comprobado
   contra el export real: 679 de 679 drops resueltos. */
function enlazarTopologia(els){
    const clientes=els.filter(e=>e.tipo==='cliente');
    const cajas=els.filter(e=>e.tipo==='caja'&&e.clase!=='pop');
    const drops=els.filter(e=>e.tipo==='cable'&&e.clase==='drop');
    if(!clientes.length||!cajas.length) return;
    const cerca=(p,l)=>{ let e=null,d=1e9; l.forEach(x=>{ const q=metros(p,x.g[0]); if(q<d){d=q;e=x;} }); return {el:e,d}; };
    drops.forEach(dp=>{
        const ini=dp.g[0], fin=dp.g[dp.g.length-1];
        const c1=cerca(ini,clientes), j1=cerca(fin,cajas);
        const c2=cerca(fin,clientes), j2=cerca(ini,cajas);
        const A=(c1.d<25&&j1.d<25), B=(c2.d<25&&j2.d<25);
        if(!A&&!B) return;
        const cli=A?c1.el:c2.el, caj=A?j1.el:j2.el;
        cli.caja=caj.nombre; cli.cajaId=caj.id;
        cli.nombreReal=dp.nombre;          // el drop lleva el nombre de la persona
        dp.cliente=dp.nombre; dp.caja=caj.nombre;
        if(cli.puerto){
            caj.puertos=caj.puertos||{};
            caj.puertos[cli.puerto]={cliente:dp.nombre, clienteId:cli.id};
        }
    });
    // Si una caja no declara splitter pero tiene un cliente en el puerto 14,
    // es al menos 1x16. Mejor eso que dejarla sin capacidad.
    cajas.forEach(c=>{
        if(c.splitters&&c.splitters.length) return;
        const max=Math.max(0,...Object.keys(c.puertos||{}).map(Number));
        if(!max||max>MAX_PUERTOS) return;
        const cap=[2,4,8,16,32,64].find(n=>n>=max);
        if(cap) c.splitters=[{tipo:'1x'+cap, ratio:'', deducido:true}];
    });
}

/* ════════════════════════════════════════════════════════════════════
   MAPA
   Con renderizador de lienzo: son miles de elementos y en SVG el
   navegador se arrastra.
   ════════════════════════════════════════════════════════════════════ */
async function crearMapa(){
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js');
    mapa=L.map('mapa',{preferCanvas:true, zoomControl:true}).setView([1.61,-75.61],13);
    ponerFondo();
    ORDEN.forEach(t=>{ capas[t]=L.layerGroup().addTo(mapa); });
    mapa.on('click',ev=>{
        if(moviendo) return soltarEn([ev.latlng.lat, ev.latlng.lng]);
        if(editando) return clicEnMapa(ev);
        if(!window._fijado) pintarPanel();
    });
}
function ponerFondo(){
    if(capaBase) mapa.removeLayer(capaBase);
    capaBase = fondoSat
        ? L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {maxZoom:19, attribution:'Imágenes © Esri'})
        : L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {maxZoom:19, attribution:'© OpenStreetMap'});
    capaBase.addTo(mapa);
    if(capaBase.bringToBack) capaBase.bringToBack();
}
function cambiarFondo(){
    if(!mapa) return;
    fondoSat=!fondoSat; ponerFondo();
    document.getElementById('btnFondo').textContent = fondoSat?'🗺️ Calles':'🛰️ Satélite';
}

/* El color de una caja dice si SIRVE PARA VENDER, que es lo unico que se
   quiere ver de un vistazo cuando se mira el mapa:
     verde  = queda espacio de sobra   ambar = va quedando poco
     rojo   = llena                    gris  = no sabemos su capacidad      */
function estadoCaja(el){
    const cap=capacidadCaja(el);
    const usados=Object.keys(el.puertos||{}).length;
    if(!cap) return {color:'#64748b', et:'sin capacidad', libres:null, cap:0, usados};
    const libres=Math.max(0,cap-usados);
    if(libres===0)          return {color:'#ef4444', et:'llena',    libres, cap, usados};
    if(libres<=cap*0.25)    return {color:'#f59e0b', et:'casi llena',libres, cap, usados};
    return {color:'#10b981', et:'con espacio', libres, cap, usados};
}

function iconoCaja(el){
    const s=estadoCaja(el);
    const clase = el.clase==='pop' ? 'mk-pop' : el.clase==='mufla' ? 'mk-mufla' : 'mk-caja';
    const dentro = el.clase==='pop' ? '🏛️'
                 : el.clase==='mufla' ? '⬤'
                 : (s.cap? s.libres+'/'+s.cap : '?');
    const fondo = el.clase==='mufla' ? TIPOS.mufla.color
                : el.clase==='pop'   ? TIPOS.pop.color : s.color;
    const rot = mapa && mapa.getZoom()>=17
        ? `<span class="mk-rot">${esc((el.nombre||'').slice(0,26))}</span>` : '';
    const w = el.clase==='pop'?30:el.clase==='mufla'?22:26;
    const h = el.clase==='pop'?30:el.clase==='mufla'?22:20;
    return L.divIcon({className:'', iconSize:[w,h], iconAnchor:[w/2,h/2],
        html:`<div style="position:relative"><div class="mk ${clase}" style="background:${fondo}">${dentro}</div>${rot}</div>`});
}

function dibujar(){
    if(!mapa) return;
    ORDEN.forEach(t=>capas[t]&&capas[t].clearLayers());
    const lienzo=L.canvas({padding:0.4});
    const puntos=[];
    const soloLibres=window._soloLibres;
    RED.elementos.forEach(el=>{
        const t=claseDe(el), cfg=TIPOS[t]; if(!cfg||!el.g||!el.g.length) return;
        // Filtro: dejar solo las cajas donde SE PUEDE conectar a alguien
        if(soloLibres && el.tipo==='caja' && el.clase!=='pop'){
            const s=estadoCaja(el); if(!s.libres) return;
        }
        let capa;
        if(cfg.forma==='linea'&&el.g.length>1){
            // El grosor sube con los hilos: la troncal se distingue del ramal
            const w = el.hilos ? Math.min(6, 1.2+Math.log2(el.hilos)*0.8) : cfg.w;
            capa=L.polyline(el.g,{color:cfg.color, weight:w, opacity:.9, renderer:lienzo});
        }else if(el.tipo==='caja'){
            capa=L.marker(el.g[0],{icon:iconoCaja(el)});
            puntos.push(el.g[0]);
        }else{
            capa=L.circleMarker(el.g[0],{radius:cfg.r, color:cfg.color, weight:1,
                                fillColor:cfg.color, fillOpacity:.85, renderer:lienzo});
            puntos.push(el.g[0]);
        }
        capa.on('click',ev=>{ L.DomEvent.stopPropagation(ev); window._fijado=true; pintarPanel(el);
                              setTimeout(()=>window._fijado=false,50); });
        capa.addTo(capas[t]);
    });
    document.getElementById('chipTotal').textContent=RED.elementos.length.toLocaleString('es-CO')+' elementos';
    if(puntos.length && !window._yaEncuadrado){ mapa.fitBounds(L.latLngBounds(puntos).pad(.05)); window._yaEncuadrado=true; }
    pintarLeyenda();
    pintarPanel();
}

function pintarLeyenda(){
    const l=document.getElementById('leyenda'); if(!l) return;
    if(!RED.elementos.length){ l.style.display='none'; return; }
    l.style.display='';
    l.innerHTML=`<b>Cajas</b>
      <div><i style="background:#10b981"></i>Con espacio</div>
      <div><i style="background:#f59e0b"></i>Casi llena</div>
      <div><i style="background:#ef4444"></i>Llena</div>
      <div><i style="background:#64748b"></i>Sin capacidad</div>
      <b style="margin-top:8px">Fibra</b>
      <div><i style="background:#ef4444;height:3px;border-radius:2px"></i>Primario</div>
      <div><i style="background:#fb923c;height:3px;border-radius:2px"></i>Secundario</div>
      <div><i style="background:#64748b;height:2px;border-radius:2px"></i>Drop</div>`;
}

/* ════════════════════════════════════════════════════════════════════
   PANEL: capas con sus conteos, o la ficha del elemento elegido
   ════════════════════════════════════════════════════════════════════ */
function pintarPanel(el){
    const p=document.getElementById('panel');
    if(el){ p.innerHTML=fichaHTML(el); return; }

    if(!RED.elementos.length){
        p.innerHTML=`<div class="aviso">Esta sede todavía no tiene red cargada.</div>
          <div class="vacio">Tienes dos caminos:<br><br>
            <b>📥 Importar KML</b> si ya tienes el archivo de OZmap,<br>
            o <b>✏️ Editar</b> y empezar a marcar cajas y postes<br>uno a uno sobre el mapa.</div>`;
        return;
    }
    const cuenta={}; RED.elementos.forEach(e=>{ const t=claseDe(e); cuenta[t]=(cuenta[t]||0)+1; });
    const cajas=RED.elementos.filter(e=>e.tipo==='caja'&&e.clase!=='pop');
    let libres=0, ocup=0, sinCap=0;
    cajas.forEach(c=>{ const cap=capacidadCaja(c);
        const us=Object.keys(c.puertos||{}).length;

      <label class="capa" style="background:rgba(16,185,129,.07);border-radius:8px;padding:7px 9px;">

function verCapa(t,on){ if(!capas[t]) return; on?capas[t].addTo(mapa):mapa.removeLayer(capas[t]); }

function capacidadCaja(c){
    if(!c.splitters||!c.splitters.length) return 0;
    return c.splitters.reduce((s,sp)=>{
        const m=String(sp.tipo||'').match(/(\d+)\s*[xX]\s*(\d+)/);
        return s+(m?+m[2]:0);
    },0);
}

function buscar(q){
    const r=document.getElementById('res'); if(!r) return;
    q=(q||'').trim().toLowerCase();
    if(q.length<2){ r.innerHTML=''; return; }
    const hits=RED.elementos.filter(e=>
        (e.nombre||'').toLowerCase().includes(q) || (e.nombreReal||'').toLowerCase().includes(q)
    ).slice(0,25);
    r.innerHTML = hits.length
        ? hits.map(e=>`<div class="capa" onclick="irA('${e.id}')" style="cursor:pointer">
             <span class="${TIPOS[claseDe(e)]&&TIPOS[claseDe(e)].forma==='linea'?'raya':'punto'}"
                   style="background:${(TIPOS[claseDe(e)]||{}).color||'#888'}"></span>
             <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.nombreReal||e.nombre||'(sin nombre)')}</span>
           </div>`).join('')
        : '<div class="vacio">Nada con ese nombre.</div>';
}
function irA(id){

/* ── Splitters: es lo que define la capacidad de cada caja ────────── */
const SPLITTERS=['1x2','1x4','1x8','1x16','1x32','1x64','2x4','2x8','2x16','2x32'];
const RATIOS=['','50/50','55/45','60/40','70/30','80/20','90/10'];
function agregarSplitter(id){
    const el=RED.elementos.find(e=>e.id===id); if(!el) return;
    window._splitId=id;
    abrirModal('🔀 Splitter en '+esc(el.nombre||'la caja'), `
      <label>Tipo</label>
      <div class="rejilla">
        ${SPLITTERS.map(s=>`<div class="opc ${s==='1x8'?'on':''}" data-s="${s}"
           onclick="elegirSplit('${s}')">${s}</div>`).join('')}
      </div>
      <label style="margin-top:14px">Reparto de potencia</label>
      <select id="sp_ratio">
        ${RATIOS.map(r=>`<option value="${r}">${r||'Balanceado (por igual)'}</option>`).join('')}
      </select>
      <p class="ayuda">Los desbalanceados (55/45, 70/30) se usan para encadenar cajas:
         una parte sigue de largo y la otra atiende clientes.</p>
      <label style="margin-top:12px">Entrada <span style="color:var(--muted);font-weight:400">(opcional)</span></label>
      <input id="sp_entrada" placeholder="Cable e hilo del que llega" autocomplete="off">`,
      `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cancelar</button>
       <button class="btn btn-sm btn-primary" style="width:auto" onclick="guardarSplitter()">Agregar</button>`);
    window._splitTipo='1x8';
}
function elegirSplit(s){
    window._splitTipo=s;
    document.querySelectorAll('.rejilla .opc').forEach(o=>o.classList.toggle('on',o.dataset.s===s));
}
async function guardarSplitter(){
    const el=RED.elementos.find(e=>e.id===window._splitId); if(!el) return cerrarModal();
    const nuevo={tipo:window._splitTipo, ratio:val('sp_ratio'), entrada:val('sp_entrada')};
    cerrarModal();
    // Los deducidos eran una suposicion nuestra: en cuanto alguien dice el
    // splitter de verdad, esa suposicion sobra.
    el.splitters=(el.splitters||[]).filter(s=>!s.deducido);
    el.splitters.push(nuevo);
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ el.splitters.pop(); ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); dibujar(); pintarPanel(el);
}
async function quitarSplitter(id,i){
    const el=RED.elementos.find(e=>e.id===id); if(!el||!el.splitters) return;
    const s=el.splitters[i];
    const usados=Object.keys(el.puertos||{}).length;
    const cap=capacidadCaja(el), quedaria=cap-(parseInt(String(s.tipo).split(/[xX]/)[1],10)||0);
    if(usados>quedaria && !confirm(`⚠️ Quitando este ${s.tipo} la caja baja a ${quedaria} puertos, `
        +`pero tiene ${usados} clientes conectados.\n\n¿Seguro?`)) return;
    if(usados<=quedaria && !confirm('¿Quitar el splitter '+s.tipo+'?')) return;
    el.splitters.splice(i,1);
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ el.splitters.splice(i,0,s); ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); dibujar(); pintarPanel(el);
}

/* ════════════════════════════════════════════════════════════════════
   CRUCE: LOS CLIENTES DE LA OFICINA CONTRA LOS DEL MAPA
   ────────────────────────────────────────────────────────────────────
   Responde tres preguntas que hoy no tienen respuesta en ningun lado:
     · a quien SI le sabemos su caja y su puerto
     · a quien le cobramos pero NO sabemos donde esta (falta marcarlo)
     · que sigue dibujado en el mapa pero ya no es cliente (limpiar)
   El nombre de la persona sale del DROP, no del punto: el punto lleva
   un codigo ("683 PTO 3 PREC 47") y el drop lleva "EDGAR CASTRO...".
   ════════════════════════════════════════════════════════════════════ */
var CRUCE=null, cruceTab='enlazados';

// Nombres escritos por gente distinta en sistemas distintos: se comparan
// sin tildes, sin ñ, sin signos y sin dobles espacios.
function normNom(s){
    return String(s||'').toUpperCase().normalize('NFD')
        .replace(/[̀-ͯ]/g,'')
        .replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}

async function clientesDeOficina(oficinaId){
    const out=[];
    try{
        const idx=await db.collection(COLECCION).doc('clientes_index').get();
        const d=idx.exists?idx.data():{};
        const n=(d.chunkInfo&&d.chunkInfo[oficinaId])||1;
        for(let i=0;i<n;i++){
            let s=await db.collection(COLECCION).doc(`clientes_${oficinaId}_${i}`).get();
            if(!s.exists&&i===0) s=await db.collection(COLECCION).doc('clientes_'+oficinaId).get();
            if(s.exists) out.push(...(s.data().clientes||[]));
        }
    }catch(e){ console.warn('clientesDeOficina',e); }
    return out;
}

async function abrirCruce(){
    if(!SEDE) return alert('Primero elige una sede.');
    mostrarCarga('Comparando la oficina con el mapa…');
    try{
        const oficina=await clientesDeOficina(SEDE.id);
        CRUCE=calcularCruce(oficina, RED.elementos);
        CRUCE.sede=SEDE.nombre;
        document.getElementById('cruce').classList.remove('hidden');
        document.getElementById('cruceTitulo').textContent='Clientes vs. Red — '+SEDE.nombre;
        cruceTab='enlazados';
        pintarCruce();
    }catch(e){ alert('No se pudo comparar:\n\n'+(e.message||e)); }
    ocultarCarga();
}
function cerrarCruce(){ document.getElementById('cruce').classList.add('hidden'); }

function calcularCruce(oficina, elementos){
    // Del mapa: los puntos de cliente que quedaron enlazados a una caja
    const enMapa=elementos.filter(e=>e.tipo==='cliente');
    // Indice de la oficina por nombre normalizado
    const idx={}, palabras={};
    oficina.forEach(c=>{
        const k=normNom(c.nombre); if(!k) return;
        (idx[k]=idx[k]||[]).push(c);
        palabras[k]=k.split(' ').filter(p=>p.length>2);
    });
    const claves=Object.keys(idx);
    const usados=new Set();

    const enlazados=[], soloMapa=[];
    enMapa.forEach(pm=>{
        const nombre=pm.nombreReal||pm.nombre||'';
        const k=normNom(nombre);
        let cli=null, comoDio='';
        if(idx[k]){ cli=idx[k][0]; comoDio='exacta'; }
        else{
            const mias=k.split(' ').filter(p=>p.length>2);
            // 3 palabras en comun es practicamente seguro; con 2 ya es dudoso
            let mejor=null, mejorN=0;
            claves.forEach(ck=>{
                const n=mias.filter(p=>palabras[ck].includes(p)).length;
                if(n>mejorN){ mejorN=n; mejor=ck; }
            });
            if(mejorN>=3){ cli=idx[mejor][0]; comoDio='3+ apellidos'; }
            else if(mejorN>=2){ cli=idx[mejor][0]; comoDio='2 apellidos (revisar)'; }
        }
        if(cli){
            usados.add(normNom(cli.nombre));
            enlazados.push({nombre:cli.nombre, servicio:cli.servicioWisphub||'', estado:cli.estado||'',
                            plan:cli.plan||'', caja:pm.caja||'', puerto:pm.puerto||null,
                            id:pm.id, como:comoDio});
        }else{
            // Sin nombreReal es que el punto no tiene drop: no hay nombre de
            // persona que cruzar, solo el codigo del punto. Conviene decirlo,
            // porque en la lista parece un cliente y no lo es.
            soloMapa.push({nombre, caja:pm.caja||'', puerto:pm.puerto||null, id:pm.id,
                           sinDrop:!pm.nombreReal});
        }
    });

    const sinUbicacion=oficina.filter(c=>!usados.has(normNom(c.nombre)))
        .map(c=>({nombre:c.nombre, servicio:c.servicioWisphub||'', estado:c.estado||'', plan:c.plan||''}));

    return {
        enlazados,
        sinUbicacion,
        sinUbicacionActivos: sinUbicacion.filter(c=>String(c.estado||'').toLowerCase()==='activo'),
        soloMapa,
        totalOficina: oficina.length,
        totalMapa: enMapa.length
    };
}

function pintarCruce(){
    if(!CRUCE) return;
    const q=normNom(document.getElementById('qCruce').value||'');
    const tabs=[
        ['enlazados',     '🔗 Enlazados',        CRUCE.enlazados.length],
        ['activos',       '📍 Falta ubicarlos',  CRUCE.sinUbicacionActivos.length],
        ['sinubicacion',  '👥 Sin ubicación',    CRUCE.sinUbicacion.length],
        ['solomapa',      '🗺️ Solo en el mapa',  CRUCE.soloMapa.length]
    ];
    document.getElementById('cruceTabs').innerHTML=tabs.map(([k,t,n])=>
        `<div class="ct ${cruceTab===k?'on':''}" onclick="cruceTab='${k}';pintarCruce()">${t} <span class="n">${n}</span></div>`).join('');

    let lista, pinta;
    if(cruceTab==='enlazados'){
        lista=CRUCE.enlazados;
        pinta=c=>`<div class="fila">
            <span class="punto" style="background:#10b981"></span>
            <span class="nom">${esc(c.nombre)}${c.como!=='exacta'?` <i style="color:#f59e0b;font-size:.7rem">(${c.como})</i>`:''}</span>
            <span class="meta">${esc(c.caja||'—')}${c.puerto?' · pto '+c.puerto:''}</span>
            <button class="btn btn-sm btn-out" onclick="cerrarCruce();irA('${c.id}')">Ver</button></div>`;
    } else if(cruceTab==='activos'||cruceTab==='sinubicacion'){
        lista=cruceTab==='activos'?CRUCE.sinUbicacionActivos:CRUCE.sinUbicacion;
        pinta=c=>`<div class="fila">
            <span class="punto" style="background:${String(c.estado).toLowerCase()==='activo'?'#f59e0b':'#64748b'}"></span>
            <span class="nom">${esc(c.nombre)}</span>
            <span class="meta">${esc(c.estado||'—')}${c.servicio?' · '+esc(c.servicio):''}</span></div>`;
    } else {
        lista=CRUCE.soloMapa;
        pinta=c=>`<div class="fila">
            <span class="punto" style="background:${c.sinDrop?'#64748b':'#ef4444'}"></span>
            <span class="nom">${esc(c.nombre||'(sin nombre)')}${c.sinDrop?' <i style="color:#94a3b8;font-size:.7rem">(punto sin drop, no trae nombre)</i>':''}</span>
            <span class="meta">${esc(c.caja||'—')}${c.puerto?' · pto '+c.puerto:''}</span>
            <button class="btn btn-sm btn-out" onclick="cerrarCruce();irA('${c.id}')">Ver</button></div>`;
    }
    const filtrada=q.length>1?lista.filter(c=>normNom(c.nombre).includes(q)):lista;
    const ayuda={
        enlazados:'Sabemos en qué caja y puerto está cada uno.',
        activos:'Están activos y cobrando, pero NO aparecen en el mapa. Son los que hay que salir a marcar.',
        sinubicacion:'Todos los de la oficina que no están en el mapa, activos o no.',
        solomapa:'Están dibujados en la red pero ya no son clientes de la oficina. Probablemente retirados.'
    }[cruceTab];
    document.getElementById('cruceLista').innerHTML=
        `<div class="aviso">${ayuda}</div>`+
        (filtrada.length ? filtrada.slice(0,400).map(pinta).join('')
                         : '<div class="vacio">Nada aquí.</div>')+
        (filtrada.length>400?`<div class="vacio">…y ${filtrada.length-400} más. Usa el buscador.</div>`:'');
}

/* ════════════════════════════════════════════════════════════════════
   EDICIÓN: crear, cambiar, mover y borrar
   ────────────────────────────────────────────────────────────────────
   El KML es solo el punto de partida. La red crece todos los dias, asi
   que todo elemento se puede tocar a mano. Al reimportar, lo editado
   aqui se conserva (ver la fusion del importador).
   ════════════════════════════════════════════════════════════════════ */
var editando=false;

function alternarEdicion(){
    if(!SEDE) return alert('Primero elige una sede.');
    editando=!editando;
    const b=document.getElementById('btnEditar');
    b.textContent = editando ? '✅ Terminar edición' : '✏️ Editar';
    b.style.background = editando ? 'rgba(16,185,129,.18)' : '';
    b.style.borderColor = editando ? '#10b981' : '';
    b.style.color = editando ? '#10b981' : '';
    if(mapa) mapa.getContainer().style.cursor = editando ? 'crosshair' : '';
    pintarPanel();
}

// Con la edición encendida, un clic en el mapa crea un elemento ahí mismo.
function clicEnMapa(ev){
    if(!editando) return;
    nuevoElemento([ev.latlng.lat, ev.latlng.lng]);
}

const CREABLES=[
    ['nap','Caja NAP','🟩'], ['cto','Caja CTO','🟦'], ['mufla','Mufla','🟠'],
    ['poste','Poste','📍'], ['reserva','Reserva','🌀'], ['pop','POP','🏛️']
];
const ESTADOS=['Implementado','Implementada y certificada','Planeado','En construcción','Fuera de servicio'];

/* Ventana propia. Los prompt() del navegador no dejan validar, no dejan
   poner listas y ademas se ven como una pagina de hace veinte anos. */
function abrirModal(titulo, cuerpoHTML, botones){
    document.getElementById('mTit').innerHTML=titulo;
    document.getElementById('mCuerpo').innerHTML=cuerpoHTML;
    document.getElementById('mPie').innerHTML=botones;
    document.getElementById('modal').classList.remove('hidden');
}
function cerrarModal(){ document.getElementById('modal').classList.add('hidden'); }
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }

function nuevoElemento(punto){
    window._nuevoPunto=punto; window._nuevaClase='nap';
    abrirModal('➕ Nuevo elemento de red', `
      <label>¿Qué vas a instalar aquí?</label>
      <div class="rejilla" id="gClase">
        ${CREABLES.map(([c,t,ic])=>`<div class="opc ${c==='nap'?'on':''}" data-c="${c}"
           onclick="elegirClase('${c}')"><span class="ic">${ic}</span>${t}</div>`).join('')}
      </div>
      <label style="margin-top:14px">Nombre <span style="color:#f87171">*</span></label>
      <input id="nEl_nombre" placeholder="Z1.T1.CEP5.R1.CTO2" autocomplete="off">
      <p class="ayuda">Tiene que ser único dentro de la sede. Usa la nomenclatura de siempre.</p>
      <div id="nEl_extra"></div>
      <label style="margin-top:12px">Estado</label>
      <select id="nEl_estado">${ESTADOS.map(e=>`<option>${e}</option>`).join('')}</select>
      <label style="margin-top:12px">Notas</label>
      <textarea id="nEl_notas" rows="2" placeholder="Opcional"></textarea>
      <p class="ayuda">📍 ${punto[0].toFixed(6)}, ${punto[1].toFixed(6)}</p>`,
      `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cancelar</button>
       <button class="btn btn-sm btn-primary" style="width:auto" onclick="guardarNuevo()">Crear</button>`);
    elegirClase('nap');
    setTimeout(()=>{ const i=document.getElementById('nEl_nombre'); if(i) i.focus(); },60);
}
function elegirClase(c){
    window._nuevaClase=c;
    document.querySelectorAll('#gClase .opc').forEach(o=>o.classList.toggle('on',o.dataset.c===c));
    const ex=document.getElementById('nEl_extra'); if(!ex) return;
    if(c==='reserva'){
        ex.innerHTML=`<label style="margin-top:12px">Metros de reserva</label>
          <input type="number" id="nEl_metros" value="20" min="1">
          <label style="margin-top:12px">¿De qué cable?</label>
          <input id="nEl_cable" placeholder="TRONCAL Z1-B" autocomplete="off">
          <p class="ayuda">En un mismo poste puede haber varias reservas, una por cable.</p>`;
    } else if(c==='poste'){
        ex.innerHTML=`<label style="margin-top:12px">Tipo de poste</label>
          <select id="nEl_sub"><option>POSTE CONCRETO</option><option>POSTE MADERA</option>
          <option>POSTE METALICO</option><option>NO</option></select>`;
    } else if(c==='pop'){
        ex.innerHTML='';
    } else {
        ex.innerHTML=`<label style="margin-top:12px">Splitter que lleva</label>
          <select id="nEl_split">
            <option value="">— se lo pongo después —</option>
            ${['1x2','1x4','1x8','1x16','1x32','1x64'].map(s=>`<option ${s==='1x8'?'selected':''}>${s}</option>`).join('')}
          </select>
          <p class="ayuda">De aquí sale la capacidad. Después puedes agregarle más splitters.</p>`;
    }
}
async function guardarNuevo(){
    const nombre=val('nEl_nombre');
    if(!nombre) return alert('Ponle un nombre.');
    const c=window._nuevaClase, punto=window._nuevoPunto;
    const rep=RED.elementos.find(e=>(e.nombre||'').trim().toLowerCase()===nombre.toLowerCase());
    if(rep && !confirm(`Ya existe "${rep.nombre}" en esta sede.\n\n¿Crear otro con el mismo nombre?`)) return;
    const el={
        id:'e'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
        nombre, subtipo:val('nEl_sub'), estado:val('nEl_estado'), notas:val('nEl_notas'),
        etiquetas:[], g:[punto], creadoEn:Date.now(), creadoPor:(USER&&USER.nombre)||''
    };
    if(c==='poste'){ el.tipo='poste'; }
    else if(c==='reserva'){ el.tipo='reserva'; el.metros=parseFloat(val('nEl_metros'))||null; el.cable=val('nEl_cable'); }
    else {
        el.tipo='caja'; el.clase=c; el.puertos={};
        const sp=val('nEl_split');
        el.splitters=sp?[{tipo:sp, ratio:''}]:[];
        if(sp) el.subtipo=el.subtipo||('NAP '+sp.toUpperCase());
    }
    cerrarModal();
    RED.elementos.push(el);
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ RED.elementos.pop(); ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); dibujar(); pintarPanel(el);
}

function editarElemento(id){
    const el=RED.elementos.find(e=>e.id===id); if(!el) return;
    window._editId=id;
    const esCable=el.tipo==='cable';
    abrirModal('✏️ '+esc(el.nombre||'Elemento'), `
      <label>Nombre</label>
      <input id="ed_nombre" value="${esc(el.nombre||'')}" autocomplete="off">
      <label style="margin-top:12px">Tipo</label>
      <input id="ed_sub" value="${esc(el.subtipo||'')}" autocomplete="off"
             placeholder="${esCable?'FIBRA 48H 6B':'NAP 1X16'}">
      <p class="ayuda">${esCable
        ? 'De aquí se leen los hilos y los buffers: escribe "FIBRA 24H 2B" y quedan 24 hilos y 2 buffers.'
        : 'Como viene de OZmap: "NAP 1X16", "CAJA NAP SEGUNDO NIVEL", "POSTE CONCRETO"…'}</p>
      <label style="margin-top:12px">Estado</label>
      <select id="ed_estado">
        ${ESTADOS.concat(ESTADOS.includes(el.estado||'')?[]:[el.estado||''])
          .filter(Boolean).map(e=>`<option ${e===el.estado?'selected':''}>${esc(e)}</option>`).join('')}
      </select>
      ${el.tipo==='reserva'?`
        <label style="margin-top:12px">Metros</label><input type="number" id="ed_metros" value="${el.metros||''}">
        <label style="margin-top:12px">Cable</label><input id="ed_cable" value="${esc(el.cable||'')}">`:''}
      <label style="margin-top:12px">Notas</label>
      <textarea id="ed_notas" rows="3">${esc(el.notas||'')}</textarea>`,
      `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cancelar</button>
       <button class="btn btn-sm btn-primary" style="width:auto" onclick="guardarEdicion()">Guardar</button>`);
}
async function guardarEdicion(){
    const el=RED.elementos.find(e=>e.id===window._editId); if(!el) return cerrarModal();
    const antes=JSON.parse(JSON.stringify({nombre:el.nombre,subtipo:el.subtipo,estado:el.estado,
                            notas:el.notas,hilos:el.hilos,buffers:el.buffers,metros:el.metros,cable:el.cable}));
    el.nombre=val('ed_nombre'); el.subtipo=val('ed_sub');
    el.estado=val('ed_estado'); el.notas=val('ed_notas');
    if(document.getElementById('ed_metros')) el.metros=parseFloat(val('ed_metros'))||null;
    if(document.getElementById('ed_cable'))  el.cable=val('ed_cable');
    // Al cambiar el tipo de un cable se releen hilos y buffers de ese texto
    if(el.tipo==='cable'){ const hb=hilosDe(el.subtipo); if(hb.hilos){ el.hilos=hb.hilos; el.buffers=hb.buffers; } }
    el.editadoEn=Date.now(); el.editadoPor=(USER&&USER.nombre)||'';
    cerrarModal();
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ Object.assign(el,antes); ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); dibujar(); pintarPanel(el);
}

var moviendo=null;
function moverElemento(id){
    const el=RED.elementos.find(e=>e.id===id); if(!el) return;
    if(el.tipo==='cable') return alert('Los recorridos de cable todavía no se pueden mover desde aquí.\n\nSe actualizan reimportando el KML.');
    moviendo=id;
    if(mapa) mapa.getContainer().style.cursor='crosshair';
    alert('Haz clic en el mapa donde queda "'+(el.nombre||'el elemento')+'".');
    pintarPanel();
}
async function soltarEn(punto){
    const el=RED.elementos.find(e=>e.id===moviendo); moviendo=null;
    if(mapa) mapa.getContainer().style.cursor = editando?'crosshair':'';
    if(!el) return;
    const antes=el.g;
    el.g=[punto]; el.editadoEn=Date.now();
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ el.g=antes; ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga();
    dibujar(); pintarPanel(el);
}

async function borrarElemento(id){
    const el=RED.elementos.find(e=>e.id===id); if(!el) return;
    const usados=el.tipo==='caja'?Object.keys(el.puertos||{}).length:0;
    if(usados && !confirm(`⚠️ "${el.nombre}" tiene ${usados} cliente(s) conectados.\n\n`
        +`Si la borras, esos clientes quedan sin caja en el mapa.\n\n¿Seguro?`)) return;
    if(!usados && !confirm('¿Borrar "'+(el.nombre||'este elemento')+'"?\n\nNo se puede deshacer.')) return;
    const i=RED.elementos.indexOf(el);
    RED.elementos.splice(i,1);
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ RED.elementos.splice(i,0,el); ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga();
    dibujar(); pintarPanel();
}

function exportarCruce(){
    if(!CRUCE) return;
    const filas=[['Grupo','Nombre','Estado','Servicio WispHub','Caja','Puerto','Cómo se enlazó']];
    CRUCE.enlazados.forEach(c=>filas.push(['Enlazado',c.nombre,c.estado,c.servicio,c.caja,c.puerto||'',c.como]));
    CRUCE.sinUbicacion.forEach(c=>filas.push(['Sin ubicación',c.nombre,c.estado,c.servicio,'','','']));
    CRUCE.soloMapa.forEach(c=>filas.push(['Solo en el mapa',c.nombre,'','',c.caja,c.puerto||'','']));
    const csv='﻿'+filas.map(f=>f.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=`Clientes_vs_Red_${(CRUCE.sede||'').replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
}
