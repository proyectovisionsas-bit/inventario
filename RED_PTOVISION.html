/* ════════════════════════════════════════════════════════════════════
   DIAGRAMA INTERNO DE LA CAJA
   ────────────────────────────────────────────────────────────────────
   Lo que se ve al abrir una caja de verdad: los cables que entran con
   sus buffers e hilos en color, los splitters, y de que puerto sale
   cada cliente. Dibujado en SVG para que se pueda leer e imprimir.
   ════════════════════════════════════════════════════════════════════ */
/* Tres formas de mirar las fibras, como en el Box Editor de OZmap:
     · NÚMEROS: relleno = tiene señal, hueco = no llega nada
     · SEÑAL:   flecha si pasa, corte si se pierde
     · COLOR:   solo el codigo de colores, sin estado                    */
var vistaFibra='numeros';
function abrirDiagrama(id){
    const el=RED.elementos.find(e=>e.id===id); if(!el) return;
    window._diagAbierto=id;
    const vistas=[['numeros','🔢 Números'],['senal','➡️ Señal'],['color','🎨 Color']];
    abrirModal('📊 Interior de '+esc(el.nombre||'la caja'),
        `<div style="display:flex;gap:5px;margin-bottom:9px">
           ${vistas.map(([v,t])=>`<button class="btn btn-sm ${vistaFibra===v?'btn-primary':'btn-out'}"
             style="width:auto;flex:1" onclick="vistaFibra='${v}';abrirDiagrama('${el.id}')">${t}</button>`).join('')}
         </div>
         <div style="overflow:auto;background:#0b1220;border:1px solid var(--border);border-radius:10px;padding:8px">
           ${diagramaSVG(el)}
         </div>
         <p class="ayuda" style="margin-top:10px">${
           vistaFibra==='numeros'?'Relleno = ese hilo tiene señal · hueco = no llega nada. La señal se deduce de las fusiones anotadas.'
          :vistaFibra==='senal'?'La flecha marca por dónde sigue la señal; el corte, dónde se pierde.'
          :'Solo el código de colores de la norma, sin estado.'}
            Pasa el cursor por un hilo para ver su número.</p>`,
        `<button class="btn btn-sm btn-out" onclick="abrirFusiones('${el.id}')">🔗 Fusiones</button>
         <button class="btn btn-sm btn-out" onclick="descargarDiagrama('${el.id}')">🖼️ Descargar</button>
         <button class="btn btn-sm btn-out" onclick="cerrarModal()">Cerrar</button>`);
}
// Un hilo "tiene señal" si esta empalmado con algo dentro de la caja.
function hiloConSenal(el, cableId, n){
    return (el.fusiones||[]).some(f=>f.a===cableId+'|'+n || f.b===cableId+'|'+n);
}

function diagramaSVG(el){
    const cables=el.cables||[];
    const sps=el.splitters||[];
    const cap=capacidadCaja(el);
    const puertos=el.puertos||{};
    const filaH=16, margen=14;
    // Altura: lo que mas ocupe entre cables y puertos
    const altoCables=cables.reduce((s,c)=>s+((c.hilos||1)*filaH+34),0)+20;
    const altoPtos=Math.max(cap*20+40, sps.length*70+40);
    const H=Math.max(altoCables, altoPtos, 220);
    const W=760;
    let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg"
             style="font-family:Segoe UI,sans-serif">`;
    s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#0b1220"/>`;

    // ── Izquierda: los cables que llegan, con sus buffers e hilos ──
    let y=margen;
    const anclas=[];
    if(!cables.length){
        s+=`<text x="${margen}" y="40" fill="#94a3b8" font-size="12">No hay cables enlazados a esta caja.</text>`;
        s+=`<text x="${margen}" y="58" fill="#64748b" font-size="10.5">Se deducen del KML: los extremos del cable deben caer sobre la caja.</text>`;
    }
    cables.forEach(cb=>{
        const mapa=mapaFibra(cb);
        const alto=(cb.hilos||1)*filaH+22;
        s+=`<rect x="${margen}" y="${y}" width="250" height="${alto}" rx="6" fill="#131c2e" stroke="#243044"/>`;
        s+=`<text x="${margen+8}" y="${y+15}" fill="#e6edf6" font-size="11" font-weight="700">${esc((cb.nombre||'').slice(0,30))}</text>`;
        s+=`<text x="${margen+8}" y="${y+28}" fill="#94a3b8" font-size="9.5">${esc(cb.sub||'')} · hacia ${esc(cb.hacia||'—')}</text>`;
        let yy=y+36;
        if(mapa) mapa.forEach(buf=>{
            // La barra del buffer, en su color
            s+=`<rect x="${margen+6}" y="${yy-2}" width="7" height="${buf.hilos.length*filaH}" rx="2"
                 fill="${buf.c.hex}" stroke="#000" stroke-opacity=".35"/>`;
            s+=`<title>Buffer ${buf.buffer} · ${buf.c.n}</title>`;
            buf.hilos.forEach(h=>{
                const luz=hiloConSenal(el, cb.id, h.n);
                s+=`<g><title>Hilo ${h.n} · buffer ${buf.buffer} (${buf.c.n}) · hilo ${h.dentro} (${h.c.n})`
                 + `${vistaFibra!=='color'?(luz?' · con señal':' · sin señal'):''}</title>`;
                // El cuadro del hilo: relleno si lleva señal, hueco si no
                const hueco = vistaFibra==='numeros' && !luz;
                s+=`<rect x="${margen+18}" y="${yy}" width="26" height="${filaH-4}" rx="2"`
                 + ` fill="${hueco?'none':h.c.hex}" stroke="${h.c.hex}" stroke-width="${hueco?1.5:0.6}"`
                 + ` stroke-opacity="${hueco?1:.45}"/>`;
                s+=`<text x="${margen+50}" y="${yy+filaH-7}" fill="${luz?'#e6edf6':'#64748b'}" font-size="8.5">${h.n}</text>`;
                // Vista de señal: flecha si pasa, corte si no
                if(vistaFibra==='senal'){
                    if(luz) s+=`<path d="M${margen+62} ${yy+(filaH-4)/2} l7 0 m-2.5 -2.5 l2.5 2.5 l-2.5 2.5"
                                 stroke="#10b981" stroke-width="1.3" fill="none"/>`;
                    else    s+=`<path d="M${margen+63} ${yy+1} l5 ${filaH-6} M${margen+68} ${yy+1} l-5 ${filaH-6}"
                                 stroke="#ef4444" stroke-width="1.2"/>`;
                }
                s+='</g>';
                anclas.push({x:margen+250, y:yy+(filaH-4)/2, color:h.c.hex, hilo:h.n, luz});
                yy+=filaH;
            });
        });
        y+=alto+12;
    });

    // ── Centro: los splitters ──
    const cx=340;
    let sy=margen+20;
    sps.forEach((sp,i)=>{
        const salidas=salidasDe(sp);
        const red=esDeRed(sp);
        // Blanco = atiende clientes, gris = alimenta red. Igual que OZmap.
        const relleno=red?'#8a8f98':'#f1f3f5', letra=red?'#0b1220':'#0b1220';
        s+=`<g><title>Splitter ${sp.tipo}${sp.ratio?' · '+sp.ratio:' · balanceado'} · ${red?'de red (no admite clientes)':'de atención'}</title>`;
        s+=`<polygon points="${cx},${sy} ${cx},${sy+44} ${cx+52},${sy+22}" fill="${relleno}" stroke="#0ea5e9" stroke-width="1.5"/>`;
        s+=`<text x="${cx+22}" y="${sy+26}" fill="${letra}" font-size="10" font-weight="700" text-anchor="middle">${esc(sp.tipo)}</text>`;
        s+=`<text x="${cx+26}" y="${sy+58}" fill="#94a3b8" font-size="8.5" text-anchor="middle">${esc(sp.ratio||'balanceado')}${red?' · RED':''}</text>`;
        // Las salidas: punto si van fusionadas, cuadrito si llevan conector
        for(let k=0;k<Math.min(salidas,16);k++){
            const yy=sy+4+k*(36/Math.max(1,Math.min(salidas,16)-1||1));
            if(sp.salida==='conector')
                s+=`<rect x="${cx+50}" y="${yy-2}" width="5" height="5" fill="#0ea5e9"/>`;
            else
                s+=`<circle cx="${cx+52}" cy="${yy}" r="2.4" fill="#0ea5e9"/>`;
        }
        s+='</g>';
        // Entrada del splitter desde los cables
        if(anclas.length) s+=`<path d="M${anclas[0].x} ${anclas[0].y} C ${cx-40} ${anclas[0].y}, ${cx-40} ${sy+22}, ${cx} ${sy+22}"
                               stroke="#0ea5e9" stroke-width="1.5" fill="none" opacity=".8"/>`;
        sy+=76;
    });
    if(!sps.length){
        s+=`<text x="${cx}" y="${margen+40}" fill="#f59e0b" font-size="11">Sin splitters</text>`;
        s+=`<text x="${cx}" y="${margen+56}" fill="#64748b" font-size="9.5">No se sabe su capacidad</text>`;
    }

    // ── Derecha: los puertos y quién está en cada uno ──
    const px=470;
    if(cap){
        s+=`<text x="${px}" y="${margen+2}" fill="#94a3b8" font-size="10" font-weight="700">PUERTOS</text>`;
        for(let n=1;n<=cap;n++){
            const yy=margen+10+(n-1)*20, o=puertos[n];
            const col=o?'#ef4444':'#10b981';
            s+=`<g><title>Puerto ${n}${o?' · '+(o.cliente||''):' · libre'}</title>`;
            s+=`<path d="M${cx+56} ${margen+22+(sps.length?0:0)} C ${px-40} ${yy+7}, ${px-40} ${yy+7}, ${px} ${yy+7}"
                 stroke="${col}" stroke-width="1.2" fill="none" opacity=".55"/>`;
            s+=`<rect x="${px}" y="${yy}" width="16" height="14" rx="3" fill="${col}" opacity=".85"/>`;
            s+=`<text x="${px+7.5}" y="${yy+11}" fill="#04121f" font-size="8.5" font-weight="700" text-anchor="middle">${n}</text>`;
            s+=`<text x="${px+24}" y="${yy+11}" fill="${o?'#e6edf6':'#64748b'}" font-size="9.5">`
             + `${esc(o?(o.cliente||'ocupado').slice(0,34):'libre')}</text></g>`;
        }
    }
    s+='</svg>';
    return s;
}

   carga, la etiqueta sale igual con el nombre y los datos: lo que de
   verdad hace falta pegado en la caja.
   ════════════════════════════════════════════════════════════════════ */

        <div id="qrbox" style="display:flex;justify-content:center;margin:8px 0;min-height:132px;
             align-items:center"><span style="color:#888;font-size:.75rem">generando…</span></div>
        <div style="display:flex;justify-content:center;gap:14px;font-size:.72rem;margin-top:6px">
          <span><b>${s.cap||'?'}</b> puertos</span>
          <span style="color:#c00"><b>${s.usados}</b> ocupados</span>
          <span style="color:#080"><b>${s.cap?s.libres:'?'}</b> libres</span>
        </div>
        <div style="font-size:.62rem;color:#777;margin-top:6px">
          ${(el.splitters||[]).map(x=>x.tipo).join(' + ')||'sin splitter'} ·
          ${el.g[0][0].toFixed(5)}, ${el.g[0][1].toFixed(5)}
        </div>
        <div style="font-size:.6rem;color:#999;margin-top:4px">PROYECTOVISION · ${new Date().toLocaleDateString('es-CO')}</div>
      </div>
      <p class="ayuda" style="margin-top:10px">Imprímela y pégala en la caja. El código lleva a esta
         misma ficha desde el celular.</p>`,
      `<button class="btn btn-sm btn-out" onclick="imprimirEtiqueta()">🖨️ Imprimir</button>
       <button class="btn btn-sm btn-out" onclick="cerrarModal()">Cerrar</button>`);
    // El QR se dibuja despues, para que la etiqueta salga aunque falle
    try{
        await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');
        const cont=document.getElementById('qrbox'); if(!cont) return;
        cont.innerHTML='';
        new QRCode(cont,{text:url, width:124, height:124, correctLevel:QRCode.CorrectLevel.M});
    }catch(e){
        const cont=document.getElementById('qrbox');
        if(cont) cont.innerHTML='<span style="color:#999;font-size:.7rem">Sin QR (no cargó la librería)</span>';
    }
}
function imprimirEtiqueta(){
    const e=document.getElementById('etq'); if(!e) return;
    const v=window.open('','_blank','width=420,height=520');
    v.document.write('<html><head><title>Etiqueta</title></head><body style="margin:16px">'
        +e.outerHTML+'</body></html>');

}

/* El diagrama sale en tres formatos: SVG para editarlo, PNG para mandarlo
   por WhatsApp y PDF para imprimirlo y llevarlo a campo. */
function descargarDiagrama(id){
    const el=RED.elementos.find(e=>e.id===id); if(!el) return;
    window._diagId=id;
    abrirModal('🖼️ Descargar el diagrama', `
      <div class="rejilla" style="grid-template-columns:1fr">
        <div class="opc" style="text-align:left;padding:12px" onclick="bajarDiag('svg')">
          <b>SVG</b><br><span style="font-weight:400;color:var(--muted);font-size:.72rem">
          Se puede ampliar sin perder nitidez y editar</span></div>
        <div class="opc" style="text-align:left;padding:12px" onclick="bajarDiag('png')">
          <b>PNG</b><br><span style="font-weight:400;color:var(--muted);font-size:.72rem">
          Imagen para mandar por WhatsApp o pegar en un informe</span></div>
        <div class="opc" style="text-align:left;padding:12px" onclick="bajarDiag('pdf')">
          <b>PDF</b><br><span style="font-weight:400;color:var(--muted);font-size:.72rem">
          Para imprimir y llevarlo a campo</span></div>
      </div>`,
      `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cancelar</button>`);
}
async function bajarDiag(fmt){
    const el=RED.elementos.find(e=>e.id===window._diagId); if(!el) return cerrarModal();
    cerrarModal();
    const svg=diagramaSVG(el);
    const base=`Caja_${(el.nombre||'').replace(/[^\w.-]+/g,'_')}`;
    if(fmt==='svg'){
        const a=document.createElement('a');
        a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
        a.download=base+'.svg'; a.click(); return;
    }
    mostrarCarga('Generando…');
    try{
        const png=await svgAPng(svg);
        if(fmt==='png'){
            const a=document.createElement('a'); a.href=png; a.download=base+'.png'; a.click();
        }else{
            await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
            const img=new Image(); img.src=png;
            await new Promise(r=>{ img.onload=r; });
            const horiz=img.width>img.height;
            const pdf=new (window.jspdf.jsPDF)({orientation:horiz?'l':'p', unit:'mm', format:'a4'});
            const anchoP=horiz?297:210, altoP=horiz?210:297, m=10;
            const esc=Math.min((anchoP-2*m)/img.width,(altoP-2*m-14)/img.height);
            pdf.setFontSize(13); pdf.text(el.nombre||'Caja', m, m+5);
            pdf.setFontSize(8); pdf.setTextColor(120);
            pdf.text(`${SEDE.nombre} · ${el.subtipo||''} · ${new Date().toLocaleDateString('es-CO')}`, m, m+10);
            pdf.addImage(png,'PNG',m,m+14,img.width*esc,img.height*esc);
            pdf.save(base+'.pdf');
        }
    }catch(e){ alert('No se pudo generar:\n\n'+(e.message||e)); }
    ocultarCarga();
}
// El SVG se pinta en un lienzo para poder sacarlo como imagen.
function svgAPng(svg, escala){
    escala=escala||2;
    return new Promise((ok,mal)=>{
        const m=svg.match(/width="(\d+)"\s+height="(\d+)"/);
        const w=m?+m[1]:800, h=m?+m[2]:600;
        const img=new Image();
        img.onload=()=>{
            const c=document.createElement('canvas');
            c.width=w*escala; c.height=h*escala;
            const x=c.getContext('2d');
            x.fillStyle='#0b1220'; x.fillRect(0,0,c.width,c.height);
            x.drawImage(img,0,0,c.width,c.height);
            ok(c.toDataURL('image/png'));
        };
        img.onerror=()=>mal(new Error('No se pudo convertir el diagrama a imagen.'));
        img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
    });
}

        // Cajas con su ocupacion

            (TIPOS[c.clase]||{}).et||c.clase, c.subtipo||'', c.hilos||'', c.buffers||'',
            c.metros||'', c.cajaA||'', c.cajaB||'', c.estado||'']));
        XLSX.utils.book_append_sheet(wb, cab(cb), 'Cables');
        // Clientes conectados
        const cl=[['Cliente','Servicio','Caja','Puerto','Conectado','Por']];
        RED.elementos.filter(e=>e.tipo==='caja').forEach(c=>{

        const pt=[['Nombre','Tipo','Detalle','Latitud','Longitud','Estado']];

            p.g[0][0], p.g[0][1], p.estado||'']));

        XLSX.writeFile(wb, `RED_${SEDE.nombre.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
    }catch(e){ alert('No se pudo exportar:\n\n'+(e.message||e)); }
    ocultarCarga();
}

/* ════════════════════════════════════════════════════════════════════
   FUSIONES DENTRO DE LA CAJA — qué hilo va a qué
   ────────────────────────────────────────────────────────────────────
   Es la capa que el KML NO trae y hay que capturar: dentro de una mufla
   o una caja, cada hilo que entra se empalma con otro o va a un
   splitter. Sin esto no se puede responder "si corto este hilo, quién
   se cae".
   ════════════════════════════════════════════════════════════════════ */
function abrirFusiones(id){
    const el=RED.elementos.find(e=>e.id===id); if(!el) return;
    window._fusCaja=id;
    el.fusiones=el.fusiones||[];
    const cables=el.cables||[];
    const opcHilo=(sel)=>cables.map(cb=>{
        const m=mapaFibra(cb); if(!m) return '';
        return `<optgroup label="${esc((cb.nombre||'').slice(0,28))} (${cb.hilos}H)">`
             + m.flatMap(b=>b.hilos.map(h=>
                `<option value="${cb.id}|${h.n}" ${sel===cb.id+'|'+h.n?'selected':''}>`
                +`buffer ${b.buffer} ${b.c.n} · hilo ${h.n} ${h.c.n}</option>`)).join('')
             + '</optgroup>';
    }).join('');
    const opcDestino=(el.splitters||[]).map((s,i)=>
        `<option value="split|${i}">Splitter ${s.tipo}${s.ratio?' ('+s.ratio+')':''}</option>`).join('');
    abrirModal('🔗 Fusiones de '+esc(el.nombre||''), `
      ${cables.length?`
        <label>Hilo que entra</label>
        <select id="fu_a">${opcHilo()}</select>
        <label style="margin-top:10px">Se empalma con</label>
        <select id="fu_b">
          ${opcDestino?`<optgroup label="Splitters">${opcDestino}</optgroup>`:''}
          <optgroup label="Hilos">${opcHilo()}</optgroup>
        </select>
        <label style="margin-top:10px">Tipo</label>
        <select id="fu_tipo"><option>Fusión</option><option>Conector</option><option>Paso directo</option></select>
        <button class="btn btn-sm btn-primary" style="margin-top:12px" onclick="agregarFusion()">➕ Agregar</button>
      `:'<div class="vacio">Esta caja no tiene cables enlazados, así que no hay hilos que empalmar.</div>'}
      <div class="sec" style="margin-top:16px">Empalmes anotados <span class="cuenta">${el.fusiones.length}</span></div>
      ${el.fusiones.length? el.fusiones.map((f,i)=>`
          <div class="fila">
            <span class="punto" style="background:${f.colorA||'#888'}"></span>
            <span class="nom" style="font-size:.76rem">${esc(f.et)}</span>
            <button class="btn btn-sm btn-out" onclick="quitarFusion(${i})">✕</button>
          </div>`).join('')
        : '<div class="vacio" style="padding:14px">Todavía no hay ninguno anotado.</div>'}
      <p class="ayuda">Esto es lo único de la red que no se puede deducir del mapa: hay que abrir la
         caja y anotarlo. Con esto queda registrado qué se cae si se corta un hilo.</p>`,
      `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cerrar</button>`);
}
async function agregarFusion(){
    const el=RED.elementos.find(e=>e.id===window._fusCaja); if(!el) return;
    const a=val('fu_a'), b=val('fu_b'), t=val('fu_tipo');
    if(!a||!b) return;
    if(a===b) return alert('Un hilo no se empalma consigo mismo.');
    const nom=(id)=>{ const c=(el.cables||[]).find(x=>x.id===id); return c?(c.nombre||'').slice(0,18):'?'; };
    const [ca,ha]=a.split('|');
    let etB;
    if(b.startsWith('split|')){
        const s=(el.splitters||[])[+b.split('|')[1]];
        etB='splitter '+(s?s.tipo:'');
    }else{ const [cb,hb]=b.split('|'); etB=nom(cb)+' h'+hb; }
    const rep=el.fusiones.find(f=>f.a===a||f.b===a);
    if(rep && !confirm('Ese hilo ya tiene un empalme anotado.\n\n¿Agregar otro de todas formas?')) return;
    el.fusiones=el.fusiones||[];
    el.fusiones.push({a, b, tipo:t, et:`${nom(ca)} h${ha}  →  ${etB}  (${t})`,
        colorA:colorN(+ha).hex, en:Date.now(), por:(USER&&USER.nombre)||''});
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ el.fusiones.pop(); ocultarCarga(); return alert('No se pudo guardar:\n\n'+(e.message||e)); }
    ocultarCarga(); abrirFusiones(window._fusCaja);
}
async function quitarFusion(i){
    const el=RED.elementos.find(e=>e.id===window._fusCaja); if(!el||!el.fusiones) return;
    const f=el.fusiones.splice(i,1)[0];
    mostrarCarga('Guardando…');
    try{ await guardarRed(SEDE.id, RED.elementos); }
    catch(e){ el.fusiones.splice(i,0,f); ocultarCarga(); return alert('No se pudo guardar.'); }
    ocultarCarga(); abrirFusiones(window._fusCaja);
}

/* ════════════════════════════════════════════════════════════════════
   AGRUPACIÓN DE CLIENTES — dónde se está pidiendo servicio
   ────────────────────────────────────────────────────────────────────
   Junta los clientes que estan cerca unos de otros para ver donde hay
   densidad y decidir si vale la pena llevar una caja nueva.
   ════════════════════════════════════════════════════════════════════ */
function abrirGrupos(){
    if(!SEDE||!RED.elementos.length) return alert('No hay red cargada.');
    const cli=RED.elementos.filter(e=>e.tipo==='cliente');
    if(!cli.length) return alert('No hay clientes ubicados en el mapa.');
    const RADIO=120;
    // Agrupacion sencilla: se toma un cliente y se le pegan todos los que
    // esten a menos de RADIO metros, y asi hasta que no quede ninguno suelto.
    const libres=cli.slice(), grupos=[];
    while(libres.length){
        const semilla=libres.shift(), miembros=[semilla];
        for(let i=libres.length-1;i>=0;i--){
            if(metros(semilla.g[0], libres[i].g[0])<=RADIO) miembros.push(libres.splice(i,1)[0]);
        }
        const lat=miembros.reduce((s,m)=>s+m.g[0][0],0)/miembros.length;
        const lon=miembros.reduce((s,m)=>s+m.g[0][1],0)/miembros.length;
        // Cuanta capacidad hay a la redonda de ese grupo
        let libresCerca=0;
        RED.elementos.filter(e=>e.tipo==='caja'&&e.clase!=='pop').forEach(c=>{
            if(metros([lat,lon],c.g[0])<=250){ const s=estadoCaja(c); if(s.libres) libresCerca+=s.libres; }
        });
        grupos.push({n:miembros.length, lat, lon, libresCerca, miembros});
    }
    grupos.sort((a,b)=>b.n-a.n);
    const apretados=grupos.filter(g=>g.n>=5&&g.libresCerca<g.n);
    abrirModal('👪 Dónde se concentra la demanda', `
      <div class="kpis">
        <div class="kpi"><div class="v">${grupos.length}</div><div class="e">Grupos</div></div>
        <div class="kpi"><div class="v">${cli.length}</div><div class="e">Clientes</div></div>
        <div class="kpi"><div class="v">${grupos[0].n}</div><div class="e">El mayor</div></div>
        <div class="kpi"><div class="v" style="color:${apretados.length?'#f59e0b':'#10b981'}">${apretados.length}</div>
          <div class="e">Sin capacidad</div></div>
      </div>
      ${apretados.length?`<div class="aviso" style="background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4);color:#fcd34d">
        ⚠️ ${apretados.length} zona(s) con más demanda que puertos libres a 250 m. Ahí conviene una caja nueva.
      </div>`:''}
      <div class="sec">Grupos de clientes (a menos de ${RADIO} m entre sí)</div>
      ${grupos.slice(0,30).map((g,i)=>`
        <div class="viab" onclick="cerrarModal();mapa.setView([${g.lat},${g.lon}],18)">
          <div class="cab">
            <span class="punto" style="background:${g.libresCerca<g.n?'#f59e0b':'#10b981'}"></span>
            <b style="flex:1">${g.n} cliente(s)</b>
            <span class="dist">${g.libresCerca} puerto(s) libre(s) cerca</span>
          </div>
          <p class="ayuda" style="margin:0">${g.lat.toFixed(5)}, ${g.lon.toFixed(5)}</p>
        </div>`).join('')}
      <p class="ayuda">Se agrupan por cercanía. Un grupo con más clientes que puertos libres alrededor
         es una zona donde ya no cabe crecer.</p>`,
      `<button class="btn btn-sm btn-out" onclick="cerrarModal()">Cerrar</button>`);
}

function exportarCruce(){
    if(!CRUCE) return;
    const filas=[['Grupo','Nombre','Estado','Servicio WispHub','Caja','Puerto','Cómo se enlazó']];
    CRUCE.enlazados.forEach(c=>filas.push(['Enlazado',c.nombre,c.estado,c.servicio,c.caja,c.puerto||'',c.como]));
    CRUCE.sinUbicacion.forEach(c=>filas.push(['Sin ubicación',c.nombre,c.estado,c.servicio,'','','']));
    CRUCE.soloMapa.forEach(c=>filas.push(['Solo en el mapa',c.nombre,'','',c.caja,c.puerto||'','']));
    const csv='﻿'+filas.map(f=>f.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=`Clientes_vs_Red_${(CRUCE.sede||'').replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
}
