<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RED · PROYECTOVISION</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2740;--border:#243044;--text:#e6edf6;--muted:#94a3b8;--accent:#0ea5e9;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hidden{display:none!important;}

/* ── LOGIN ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:linear-gradient(135deg,#064e3b 0%,#065f46 60%,#0f766e 100%);}
.login-card{background:var(--card);border-radius:18px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-logo{text-align:center;font-size:2.6rem;margin-bottom:6px;}
.login-card h1{font-size:1.3rem;text-align:center;margin-bottom:4px;}
.login-card .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:22px;}
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;font-weight:600;}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:1rem;margin-bottom:14px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
.btn{border:none;border-radius:10px;padding:11px 16px;font-size:.9rem;font-weight:700;cursor:pointer;
     transition:transform .08s,opacity .2s;font-family:inherit;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,#10b981,#059669);color:#fff;width:100%;}
.btn-sm{padding:6px 11px;font-size:.76rem;border-radius:8px;}
.btn-out{background:transparent;color:var(--text);border:1px solid var(--border);}
.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab{flex:1;padding:9px;text-align:center;border-radius:9px;background:var(--card2);cursor:pointer;
     font-size:.82rem;font-weight:700;border:1px solid var(--border);color:var(--muted);}
.tab.on{background:rgba(16,185,129,.15);border-color:#10b981;color:#10b981;}

/* ── APP: barra lateral de iconos + mapa + panel, al estilo OZmap ── */
#app{display:flex;flex-direction:column;height:100vh;}
.top{display:flex;align-items:center;gap:12px;padding:7px 12px;background:var(--card);
     border-bottom:1px solid var(--border);flex-wrap:wrap;}
.top .marca{font-weight:800;letter-spacing:.4px;font-size:.9rem;}
.top .marca span{color:#10b981;}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:.74rem;color:var(--muted);}
.crece{flex:1;}
.cuerpo{flex:1;display:flex;min-height:0;}

/* Barra lateral vertical */
.lateral{width:54px;background:#0e1626;border-right:1px solid var(--border);display:flex;
         flex-direction:column;align-items:center;padding:8px 0;gap:3px;flex-shrink:0;}
.lb{width:40px;height:38px;border:none;background:transparent;color:var(--muted);font-size:1.05rem;
    border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    position:relative;transition:.12s;}
.lb:hover{background:rgba(255,255,255,.07);color:var(--text);}
.lb.on{background:rgba(16,185,129,.16);color:#10b981;}
.lb.on::before{content:'';position:absolute;left:-8px;top:8px;bottom:8px;width:3px;
               border-radius:0 3px 3px 0;background:#10b981;}
.lsep{width:26px;height:1px;background:var(--border);margin:5px 0;}

#mapa{flex:1;background:#0b1220;position:relative;}
.panel{width:320px;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;padding:13px;}
@media(max-width:820px){
  .cuerpo{flex-direction:column;}
  .lateral{width:100%;flex-direction:row;justify-content:center;padding:5px;border-right:none;border-bottom:1px solid var(--border);}
  .lb.on::before{left:8px;right:8px;top:auto;bottom:-5px;width:auto;height:3px;border-radius:3px 3px 0 0;}
  .panel{width:100%;max-height:42%;border-left:none;border-top:1px solid var(--border);}
}

/* Árbol de capas con casillas, como el de OZmap */
.arbol{font-size:.8rem;}
.rama{margin-bottom:2px;}
.rama>.cab{display:flex;align-items:center;gap:7px;padding:5px 4px;cursor:pointer;border-radius:6px;}
.rama>.cab:hover{background:var(--card2);}
.rama>.cab .fl{width:11px;color:var(--muted);font-size:.65rem;transition:transform .15s;}
.rama.abierta>.cab .fl{transform:rotate(90deg);}
.rama>.hijos{display:none;padding-left:19px;}
.rama.abierta>.hijos{display:block;}
.hoja{display:flex;align-items:center;gap:7px;padding:3.5px 4px;cursor:pointer;border-radius:5px;}
.hoja:hover{background:var(--card2);}
.cas{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border);flex-shrink:0;
     display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#04121f;background:var(--card2);}
.cas.si{background:#10b981;border-color:#10b981;}
.cas.parte{background:var(--card2);border-color:#10b981;}
.cas.parte::after{content:'';width:7px;height:2px;background:#10b981;border-radius:1px;}
.sec{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
     margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.sec:first-child{margin-top:0;}
.capa{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:.83rem;cursor:pointer;user-select:none;}
.capa input{width:auto;margin:0;}
.punto{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.35);}
.raya{width:16px;height:3px;border-radius:2px;flex-shrink:0;}
.cuenta{margin-left:auto;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.ficha{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:10px;}
.ficha h3{font-size:.95rem;margin-bottom:3px;word-break:break-word;}
.ficha .tipo{font-size:.74rem;color:var(--muted);margin-bottom:9px;}
.dato{display:flex;justify-content:space-between;gap:10px;font-size:.79rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.dato b{color:var(--muted);font-weight:600;}
.dato span{text-align:right;word-break:break-word;}
.puertos{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px;margin-top:9px;}
.pto{border-radius:7px;padding:5px 3px;text-align:center;font-size:.68rem;font-weight:700;border:1px solid var(--border);cursor:pointer;}
.pto.libre{background:rgba(16,185,129,.12);color:#10b981;border-color:rgba(16,185,129,.4);}
.pto.ocup{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.35);}
.pto.bloq{background:rgba(245,158,11,.14);color:#f59e0b;border-color:rgba(245,158,11,.45);}
.rot-region{background:rgba(11,18,32,.7)!important;border:none!important;color:#e6edf6!important;
            font-weight:700!important;font-size:11px!important;box-shadow:none!important;}
.rot-region::before{display:none!important;}
.vacio{text-align:center;color:var(--muted);font-size:.83rem;padding:26px 10px;line-height:1.5;}
.aviso{background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.3);border-radius:10px;
       padding:11px;font-size:.78rem;color:#7dd3fc;line-height:1.5;margin-bottom:12px;}
.leaflet-container{background:#0b1220;}
.popup-red b{display:block;font-size:.86rem;margin-bottom:3px;}
.popup-red small{color:#555;}
/* ── Cruce clientes ↔ red ── */
#cruce{position:fixed;inset:0;background:rgba(4,8,16,.82);z-index:900;display:flex;align-items:center;justify-content:center;padding:18px;}
.cruce-caja{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:760px;
            max-height:88vh;display:flex;flex-direction:column;padding:16px;}
.cruce-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.cruce-top b{font-size:1rem;}
.cruce-tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
.ct{padding:7px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--border);
    cursor:pointer;font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;}
.ct.on{border-color:var(--accent);color:var(--accent);background:rgba(14,165,233,.12);}
.ct .n{font-variant-numeric:tabular-nums;}
.cruce-lista{overflow-y:auto;flex:1;min-height:120px;}
.fila{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.82rem;}
.fila:hover{background:var(--card2);}
.fila .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fila .meta{font-size:.72rem;color:var(--muted);white-space:nowrap;}
/* ── Barra de herramientas: el mapa se comporta distinto según la elegida ── */
.herramientas{display:flex;gap:3px;background:var(--card2);border:1px solid var(--border);
              border-radius:10px;padding:3px;}
.hb{border:none;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;
    padding:6px 10px;border-radius:7px;transition:.12s;line-height:1;}
.hb:hover{background:rgba(255,255,255,.06);}
.hb.on{background:rgba(16,185,129,.18);color:#10b981;box-shadow:inset 0 0 0 1px rgba(16,185,129,.4);}
.pista{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;
       background:rgba(16,185,129,.95);color:#04121f;font-weight:700;font-size:.79rem;
       padding:8px 15px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.45);
       display:none;align-items:center;gap:9px;}
.pista button{background:rgba(0,0,0,.22);border:none;color:#04121f;font-weight:700;
              border-radius:6px;padding:3px 9px;cursor:pointer;font-size:.72rem;}
/* Resultado de viabilidad */
.viab{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;
      background:var(--card2);cursor:pointer;transition:.12s;}
.viab:hover{border-color:#10b981;}
.viab .cab{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.viab .dist{margin-left:auto;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.viab .lib{font-weight:800;font-size:1.05rem;}
.pasos{counter-reset:p;}
.pasos li{margin-bottom:9px;font-size:.82rem;line-height:1.5;}
/* ── Ventanas propias (en vez de los prompt del navegador) ── */
#modal{position:fixed;inset:0;background:rgba(4,8,16,.78);z-index:1200;display:flex;
       align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px);}
.mcaja{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;
       max-width:440px;max-height:88vh;display:flex;flex-direction:column;
       box-shadow:0 24px 70px rgba(0,0,0,.55);}
.mtop{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.mtop b{font-size:.98rem;}
.mcuerpo{padding:16px 18px;overflow-y:auto;}
.mcuerpo label{margin-top:10px;}
.mcuerpo label:first-child{margin-top:0;}
.mpie{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;}
.mcuerpo input,.mcuerpo select,.mcuerpo textarea{margin-bottom:2px;padding:10px;font-size:.9rem;}
.ayuda{font-size:.72rem;color:var(--muted);margin:4px 0 0;line-height:1.45;}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;margin-top:4px;}
.opc{border:1px solid var(--border);background:var(--card2);border-radius:10px;padding:11px 7px;
     text-align:center;cursor:pointer;font-size:.76rem;font-weight:700;transition:.12s;}
.opc:hover{border-color:var(--accent);}
.opc.on{border-color:#10b981;background:rgba(16,185,129,.14);color:#10b981;}
.opc .ic{display:block;font-size:1.3rem;margin-bottom:3px;}

/* ── Símbolos de red sobre el mapa ── */
.mk{display:flex;align-items:center;justify-content:center;font-weight:800;color:#04121f;
    border:2px solid rgba(0,0,0,.45);box-shadow:0 2px 6px rgba(0,0,0,.5);}
.mk-caja{width:26px;height:20px;border-radius:4px;font-size:.62rem;}
.mk-mufla{width:22px;height:22px;border-radius:50%;font-size:.6rem;}
.mk-pop{width:30px;height:30px;border-radius:7px;font-size:.9rem;color:#fff;}
.mk-rot{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:2px;
        font-size:9.5px;font-weight:700;color:#e6edf6;text-shadow:0 0 4px #000,0 0 3px #000;
        white-space:nowrap;pointer-events:none;}
.leaflet-marker-icon{background:none;border:none;}

/* ── Leyenda ── */
.leyenda{position:absolute;left:10px;bottom:20px;z-index:500;background:rgba(19,28,46,.94);
         border:1px solid var(--border);border-radius:11px;padding:10px 12px;font-size:.72rem;
         line-height:1.7;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.leyenda b{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;
           letter-spacing:.5px;margin-bottom:5px;}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;
           vertical-align:-2px;border:1px solid rgba(0,0,0,.4);}

/* ── Resumen arriba del panel ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.kpi{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 10px;}
.kpi .v{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;}
.kpi .e{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
.barra{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:8px;display:flex;}
.barra span{display:block;height:100%;}
#cargando{position:fixed;inset:0;background:rgba(11,18,32,.92);display:flex;align-items:center;
          justify-content:center;flex-direction:column;gap:14px;z-index:9999;}
.spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:#10b981;border-radius:50%;animation:g .8s linear infinite;}
@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">🛰️</div>
    <h1>RED</h1>
    <p class="sub">Planta externa · PROYECTOVISION</p>
    <div class="tabs">
      <div class="tab on" id="tabOfi" onclick="verTab('oficina')">Oficina</div>
      <div class="tab" id="tabAdm" onclick="verTab('admin')">Administrador</div>
    </div>
    <div id="frmOficina">
      <label>Oficina</label>
      <select id="selOfi"><option>Cargando…</option></select>
      <label>Contraseña</label>
      <input type="password" id="passOfi" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar('oficina')">
    </div>
    <div id="frmAdmin" class="hidden">
      <label>Contraseña de administrador</label>
      <input type="password" id="passAdm" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar('admin')">
    </div>
    <button class="btn btn-primary" onclick="entrar(window._tab||'oficina')">Entrar</button>
    <p style="text-align:center;color:var(--muted);font-size:.72rem;margin-top:14px;">
      Se entra con la misma clave de OFICINAS.
    </p>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app" class="hidden">
  <div class="top">
    <div class="marca">🛰️ PROYECTO<span>VISION</span> · RED</div>
    <span class="chip" id="chipSede">—</span>
    <select id="selSede" class="hidden" style="width:auto;margin:0;padding:6px 10px;font-size:.82rem;" onchange="cambiarSede(this.value)"></select>
    <div class="crece"></div>
    <span class="chip" id="chipTotal">0 elementos</span>
    <span class="chip" id="chipRed" style="display:none"></span>
    <button class="btn btn-sm btn-out" onclick="cambiarFondo()" id="btnFondo" title="Calles o satélite">🛰️</button>
    <button class="btn btn-sm btn-out" onclick="salir()">Salir</button>
  </div>
  <div class="cuerpo">
    <div class="lateral">
      <button class="lb on" id="h_ver"  onclick="modo('ver')"        title="Ver">👁️</button>
      <button class="lb" id="h_viab"    onclick="modo('viabilidad')" title="¿Hay cupo aquí?">🔍</button>
      <button class="lb" id="h_medir"   onclick="modo('medir')"      title="Medir">📏</button>
      <button class="lb" id="h_editar"  onclick="modo('editar')"     title="Crear y editar">✏️</button>
      <button class="lb" id="h_cable"   onclick="modo('cable')"      title="Trazar cable">🧵</button>
      <button class="lb" id="h_region"  onclick="modo('region')"     title="Dibujar una región">⬟</button>
      <button class="lb" id="h_ruta"    onclick="modo('ruta')"       title="Seguir la ruta hasta el POP">💡</button>
      <button class="lb" id="h_nota"    onclick="modo('nota')"       title="Reportar algo en campo">🚩</button>
      <div class="lsep"></div>
      <button class="lb" id="h_capas"   onclick="verPanel('capas')"  title="Capas">🗂️</button>
      <button class="lb" id="h_calor"   onclick="alternarCalor()"    title="Mapa de calor">🔥</button>
      <button class="lb" onclick="abrirCruce()"  title="Clientes vs. Red">👥</button>
      <button class="lb" onclick="abrirGrupos()" title="Dónde se concentra la demanda">👪</button>
      <button class="lb" onclick="abrirPendientes()" title="Pendientes">🚩</button>
      <div class="lsep"></div>
      <button class="lb" onclick="pedirKML()"    title="Importar KML o Excel">📥</button>
      <button class="lb" onclick="exportarKML()" title="Llevar a Google Earth">🌍</button>
      <button class="lb" onclick="exportarExcel()" title="Listado a Excel">📊</button>
      <button class="lb" onclick="abrirGuia()"   title="¿Qué es cada cosa?">❓</button>
    </div>
    <div id="mapa">
      <div class="leyenda" id="leyenda"></div>
      <div id="avisoZoom" style="position:absolute;right:10px;bottom:20px;z-index:500;display:none;
           background:rgba(19,28,46,.94);border:1px solid var(--border);border-radius:9px;
           padding:7px 11px;font-size:.72rem;color:#f59e0b;"></div>
      <div class="pista" id="pista"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<div id="modal" class="hidden"><div class="mcaja">
  <div class="mtop"><b id="mTit">—</b></div>
  <div class="mcuerpo" id="mCuerpo"></div>
  <div class="mpie" id="mPie"></div>
</div></div>

<!-- ══════════ CRUCE CLIENTES ↔ RED ══════════ -->
<div id="cruce" class="hidden">
  <div class="cruce-caja">
    <div class="cruce-top">
      <b id="cruceTitulo">Clientes vs. Red</b>
      <div class="crece"></div>
      <button class="btn btn-sm btn-out" onclick="exportarCruce()">📊 Exportar</button>
      <button class="btn btn-sm btn-out" onclick="cerrarCruce()">✕ Cerrar</button>
    </div>
    <div class="cruce-tabs" id="cruceTabs"></div>
    <input type="text" id="qCruce" placeholder="Buscar por nombre…" oninput="pintarCruce()" style="margin:0 0 10px;">
    <div class="cruce-lista" id="cruceLista"></div>
  </div>
</div>

<input type="file" id="fileKML" accept=".kml,.kmz" class="hidden" onchange="importarKML(this.files[0])">
<input type="file" id="fileXLS" accept=".xlsx,.xls,.csv" class="hidden" onchange="importarTabla(this.files[0])">
<div id="cargando"><div class="spin"></div><div id="cargandoTxt" style="color:var(--muted);font-size:.86rem;">Cargando…</div></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   RED · PROYECTOVISION — planta externa
   ────────────────────────────────────────────────────────────────────
   Vive aparte de OFICINAS a proposito: solo Florencia trae 6.536
   elementos y las librerias de mapa, y OFICINAS ya pesa 1,7 MB para
   gente que solo registra pagos.
   El acceso NO crea claves nuevas: valida contra las mismas de
   OFICINAS (oficinas_sistema/main), asi que cambiar la clave alla
   la cambia aqui.
   ════════════════════════════════════════════════════════════════════ */

const APP_VERSION_RED = 14;

const firebaseConfig = {
    apiKey: "AIzaSyDxDOjSzmsSNnULxmzyH2JM80u8AMFpO9w",

/* ── Guardado fragmentado ─────────────────────────────────────────
   FIRESTORE NO ACEPTA ARREGLOS DENTRO DE ARREGLOS, y la geometria es
   justo eso: [[lat,lon],[lat,lon],...]. Al guardar se APLANA a
   [lat,lon,lat,lon,...] y al leer se vuelve a armar.
   Se aplana en vez de usar el truco de la casa (convertir cada par en
   un objeto {0:..,1:..}) porque para los 16.378 vertices de Florencia
   eso pesaria 485 KB y plano son 325 KB.                            */
function aplanar(el){
    const c=Object.assign({},el);
    if(Array.isArray(c.g)){ c.g=[]; el.g.forEach(p=>{ c.g.push(p[0],p[1]); }); }
    return c;
}
function desaplanar(el){
    const c=Object.assign({},el);
    if(Array.isArray(c.g)){
        const p=[];
        for(let i=0;i+1<c.g.length;i+=2) p.push([c.g[i], c.g[i+1]]);
        c.g=p;
    }
    return c;
}
// Guardia: si alguna vez vuelve a colarse un arreglo anidado, que se vea
// aqui y no en un mensaje de Firebase que no dice donde esta.
function buscarAnidados(obj, ruta){
    ruta=ruta||'';
    if(Array.isArray(obj)){
        for(let i=0;i<obj.length;i++){
            if(Array.isArray(obj[i])) return ruta+'['+i+']';
            const r=buscarAnidados(obj[i], ruta+'['+i+']');
            if(r) return r;
        }
    }else if(obj&&typeof obj==='object'){
        for(const k of Object.keys(obj)){
            const r=buscarAnidados(obj[k], ruta+'.'+k);
            if(r) return r;
        }
    }
    return null;
}

/* ════════════════════════════════════════════════════════════════════
   MODO SIN INTERNET
   ────────────────────────────────────────────────────────────────────
   En campo no hay señal justo donde esta la caja. Cada vez que se carga
   una sede se guarda una copia en el equipo; si al abrir no hay
   internet, se trabaja con esa copia. Las teselas del mapa que ya se
   vieron tambien quedan en el cache del navegador.
   Lo que se edite sin señal se guarda al recuperarla.
   ════════════════════════════════════════════════════════════════════ */
function guardarLocal(oficinaId, red){
    try{
        localStorage.setItem('red_'+oficinaId, JSON.stringify({
            elementos:red.elementos.map(aplanar), regiones:red.regiones||[], cuando:Date.now()
        }));
    }catch(e){ console.warn('No cupo la copia local:',e.message); }
}
function leerLocal(oficinaId){
    try{
        const s=localStorage.getItem('red_'+oficinaId); if(!s) return null;
        const d=JSON.parse(s);
        return {elementos:(d.elementos||[]).map(desaplanar),
                regiones:(d.regiones||[]).map(r=>{const c=Object.assign({},r),p=[];
                    for(let k=0;k+1<(r.g||[]).length;k+=2) p.push([r.g[k],r.g[k+1]]); c.g=p; return c;}),
                cuando:d.cuando};
    }catch(e){ return null; }
}
var _pendientesGuardar=false;
function marcarPendiente(){ _pendientesGuardar=true; pintarEstadoRed(); }

    const c=document.getElementById('chipRed'); if(!c) return;

}

async function cargarRed(oficinaId){
    const out={elementos:[], regiones:[], notas:[]};
    if(!navigator.onLine){
        const l=leerLocal(oficinaId);
        if(l){ console.log('📴 Sin internet: se abre la copia guardada en este equipo.'); return l; }
    }
    try{
        const idx=await db.collection(COLECCION).doc('red_index').get();
        const info=(idx.exists?idx.data():{})[oficinaId];
        const n=info&&info.fragmentos?info.fragmentos:0;
        for(let i=0;i<n;i++){
            const d=await db.collection(COLECCION).doc(`red_${oficinaId}_${i}`).get();
            if(!d.exists) continue;
            const dd=d.data();
            if(Array.isArray(dd.elementos)) out.elementos.push(...dd.elementos.map(desaplanar));
            if(i===0&&Array.isArray(dd.notas)) out.notas=dd.notas;
            if(i===0&&Array.isArray(dd.regiones)) out.regiones=dd.regiones.map(r=>{
                const c=Object.assign({},r), p=[];
                for(let k=0;k+1<(r.g||[]).length;k+=2) p.push([r.g[k], r.g[k+1]]);
                c.g=p; return c;
            });
        }
    }catch(e){
        console.warn('cargarRed',e);
        const l=leerLocal(oficinaId);
        if(l){ alert('No se pudo leer de la nube. Se abre la copia guardada en este equipo del '
                    +new Date(l.cuando).toLocaleString('es-CO')+'.'); return l; }
    }
    if(out.elementos.length) guardarLocal(oficinaId, out);
    return out;
}

/* ════════════════════════════════════════════════════════════════════
   BLOQUEO ENTRE USUARIOS
   ────────────────────────────────────────────────────────────────────
   Dos personas editando la misma sede a la vez se pisan: la segunda en
   guardar borra lo de la primera, porque cada una escribe SU copia
   entera. Se marca quien esta editando y desde cuando; el candado
   CADUCA a los 15 minutos para que una pestaña cerrada no deje la sede
   bloqueada para siempre.
   ════════════════════════════════════════════════════════════════════ */
const CANDADO_MS=15*60*1000;
var _miCandado=null;

async function tomarCandado(oficinaId){
    try{
        const ref=db.collection(COLECCION).doc('red_candados');
        const s=await ref.get();
        const d=s.exists?s.data():{};
        const c=d[oficinaId];
        const mio=(USER&&USER.nombre)||'?';
        if(c && c.por!==mio && (Date.now()-c.desde)<CANDADO_MS){
            const min=Math.round((Date.now()-c.desde)/60000);
            return {ok:false, por:c.por, min};
        }
        d[oficinaId]={por:mio, desde:Date.now()};
        await ref.set(d);
        _miCandado=oficinaId;
        return {ok:true};
    }catch(e){ console.warn('candado',e); return {ok:true}; }  // si falla, no bloquear el trabajo
}
async function soltarCandado(){
    if(!_miCandado) return;
    try{
        const ref=db.collection(COLECCION).doc('red_candados');
        const s=await ref.get(); const d=s.exists?s.data():{};
        if(d[_miCandado] && d[_miCandado].por===((USER&&USER.nombre)||'?')){ delete d[_miCandado]; await ref.set(d); }
    }catch(e){}
    _miCandado=null;
}
// Refresca el candado mientras la pestaña siga abierta
setInterval(()=>{ if(_miCandado&&db) tomarCandado(_miCandado); }, 5*60*1000);
window.addEventListener('beforeunload',()=>{ if(_miCandado) soltarCandado(); });

async function guardarRed(oficinaId, elementos, regiones){
    // Se parte en fragmentos por PESO, no por cantidad: un cable de 359
    // vertices pesa lo que cientos de postes.
    const planos=elementos.map(aplanar);
    const mal=buscarAnidados(planos);
    if(mal) throw new Error('Hay un arreglo dentro de otro en '+mal+', y Firestore no los admite. '
                          + 'Avisa de esto: es un fallo del programa, no de tus datos.');
    const frags=[[]]; let peso=0;
    planos.forEach(el=>{
        const w=JSON.stringify(el).length;
        if(peso+w>TOPE_FRAGMENTO && frags[frags.length-1].length){ frags.push([]); peso=0; }
        frags[frags.length-1].push(el); peso+=w;
    });
    // Las regiones son pocas y livianas: van en el primer fragmento.
    const regs=(regiones||RED.regiones||[]).map(r=>{
        const c=Object.assign({},r); const p=[];
        (r.g||[]).forEach(q=>{ p.push(q[0],q[1]); }); c.g=p; return c;
    });
    // Las notas de campo son un punto suelto: no llevan arreglo anidado.
    const nts=(RED.notas||[]).map(n=>Object.assign({},n,{g:[n.g[0],n.g[1]]}));
    for(let i=0;i<frags.length;i++){
        const doc={elementos:frags[i], actualizado:Date.now()};
        if(i===0){ doc.regiones=regs; doc.notas=nts; }
        await db.collection(COLECCION).doc(`red_${oficinaId}_${i}`).set(doc);
    }
    // Si antes habia mas fragmentos, se vacian para no dejar datos zombis
    const idx=await db.collection(COLECCION).doc('red_index').get();
    const datos=idx.exists?idx.data():{};
    const antes=(datos[oficinaId]&&datos[oficinaId].fragmentos)||0;
    for(let i=frags.length;i<antes;i++){
        await db.collection(COLECCION).doc(`red_${oficinaId}_${i}`).set({elementos:[], actualizado:Date.now()});
    }
    datos[oficinaId]={fragmentos:frags.length, elementos:elementos.length, actualizado:Date.now()};
    await db.collection(COLECCION).doc('red_index').set(datos);
    guardarLocal(oficinaId, {elementos, regiones:regiones||RED.regiones||[]});
    _pendientesGuardar=false; pintarEstadoRed();
    return frags.length;
}

/* ════════════════════════════════════════════════════════════════════
   IMPORTACIÓN MASIVA DESDE EXCEL / CSV
   ────────────────────────────────────────────────────────────────────
   Para levantar postes y cajas cuando NO hay KML: se sale a campo con
   el GPS, se anota en una hoja y se sube. Las columnas se reconocen por
   su nombre sin importar tildes ni mayusculas, porque nadie escribe la
   cabecera igual dos veces.

const COLS_EQUIV={
    nombre:['nombre','name','id','codigo','código','etiqueta'],
    tipo  :['tipo','type','clase','elemento'],
    lat   :['lat','latitud','latitude','y'],
    lon   :['lon','lng','long','longitud','longitude','x'],
    coord :['coordenadas','coordenada','coords','ubicacion','ubicación','gps'],
    cap   :['capacidad','puertos','splitter','ports'],
    estado:['estado','status','fase'],
    notas :['notas','nota','observacion','observación','comentarios','descripcion','descripción']
};
function columnaDe(cab){
    const n=String(cab||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
    for(const k of Object.keys(COLS_EQUIV)) if(COLS_EQUIV[k].some(v=>n===v||n.startsWith(v))) return k;
    return null;
}

async function importarTabla(archivo){
    if(!archivo) return;
    document.getElementById('fileXLS').value='';
    mostrarCarga('Leyendo la hoja…');

        let filas;
        if(/\.csv$/i.test(archivo.name)){
            const t=await archivo.text();
            const sep=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';
            filas=t.split(/\r?\n/).filter(Boolean).map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));
        }else{
            await cargarScript('https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js');
            const wb=XLSX.read(await archivo.arrayBuffer(),{type:'array'});
            filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
        }
        if(filas.length<2) throw new Error('La hoja está vacía o solo tiene la cabecera.');
        const cab=filas[0].map(columnaDe);
        if(!cab.includes('nombre')) throw new Error('No encontré una columna de NOMBRE. '
            +'Baja la plantilla desde 📥 para ver las columnas que espera.');
        if(!cab.includes('lat')&&!cab.includes('coord'))
            throw new Error('No encontré las coordenadas. Pon columnas "latitud" y "longitud", '
            +'o una sola "coordenadas".');
        const nuevos=[], malas=[];
        filas.slice(1).forEach((f,i)=>{
            const d={};
            cab.forEach((k,j)=>{ if(k) d[k]=String(f[j]==null?'':f[j]).trim(); });
            if(!d.nombre) return;
            let lat=parseFloat(String(d.lat||'').replace(',','.')),
                lon=parseFloat(String(d.lon||'').replace(',','.'));
            if(isNaN(lat)||isNaN(lon)){
                const c=coordDeTexto(d.coord||'');
                if(c){ lat=c[0]; lon=c[1]; }
            }
            if(isNaN(lat)||isNaN(lon)||Math.abs(lat)>90||Math.abs(lon)>180){
                malas.push('fila '+(i+2)+': '+d.nombre); return;
            }
            const t=(d.tipo||'nap').toLowerCase();
            const el={id:'e'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
                nombre:d.nombre, subtipo:d.cap||'', estado:d.estado||'Implementado',
                notas:d.notas||'', etiquetas:[], g:[[lat,lon]],
                creadoEn:Date.now(), creadoPor:(USER&&USER.nombre)||''};
            if(t==='poste'){ el.tipo='poste'; }
            else if(t==='reserva'){ el.tipo='reserva'; el.metros=parseFloat(d.cap)||null; el.cable=''; }
            else { el.tipo='caja'; el.clase=['nap','cto','mufla','pop'].includes(t)?t:'nap';
                   el.puertos={}; const c=capacidadDe(d.cap); el.splitters=c?[{tipo:'1x'+c,ratio:''}]:[]; }
            nuevos.push(el);
        });
        if(!nuevos.length) throw new Error('No pude leer ninguna fila con coordenadas válidas.');
        ocultarCarga();
        if(!confirm(`Se van a agregar ${nuevos.length} elemento(s) a ${SEDE.nombre}.`
            +(malas.length?`\n\n⚠️ ${malas.length} fila(s) sin coordenada válida se van a saltar:\n`
              +malas.slice(0,5).join('\n')+(malas.length>5?'\n…':''):'')
            +'\n\n¿Continuar?')) return;
        mostrarCarga('Guardando…');
        RED.elementos.push(...nuevos);
        enlazarCables(RED.elementos);
        await guardarRed(SEDE.id, RED.elementos);
        ocultarCarga(); dibujar();
        alert(`✅ Listo: ${nuevos.length} elemento(s) agregados.`
            +(malas.length?`\n${malas.length} fila(s) se saltaron por coordenada inválida.`:''));
    }catch(e){ ocultarCarga(); alert('❌ No se pudo importar:\n\n'+(e.message||e)); }
}

// Acepta "1.61,-75.60", grados/min/seg y el enlace de Google Maps, que es
// como vienen las coordenadas en WispHub.
function coordDeTexto(s){
    s=String(s||'');
    let m=s.match(/query=(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
    if(m) return [parseFloat(m[1]),parseFloat(m[2])];
    m=s.match(/([NSns])\s*(\d+)°(\d+)'([\d.]+)"?\s*.*?([EWew])\s*(\d+)°(\d+)'([\d.]+)"?/);
    if(m){ const g=(a,b,c)=>parseFloat(a)+parseFloat(b)/60+parseFloat(c)/3600;
        let la=g(m[2],m[3],m[4]); if(/[Ss]/.test(m[1])) la=-la;
        let lo=g(m[6],m[7],m[8]); if(/[Ww]/.test(m[5])) lo=-lo;
        return [la,lo]; }
    m=s.match(/(-?\d+[.,]\d+)\s*[,;]\s*(-?\d+[.,]\d+)/);
    if(m) return [parseFloat(m[1].replace(',','.')), parseFloat(m[2].replace(',','.'))];
    return null;
}

async function importarKML(archivo){
    if(!archivo) return;
    document.getElementById('fileKML').value='';
    if(!confirm(`¿Importar "${archivo.name}" a ${SEDE.nombre}?\n\n`
        +`Los elementos que ya existan con el MISMO nombre y tipo se actualizan; `
        +`los nuevos se agregan. No se borra nada.`)) return;
    mostrarCarga('Leyendo el archivo…');
    try{
        let texto;
        if(/\.kmz$/i.test(archivo.name)){
            await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
            const zip=await JSZip.loadAsync(archivo);
            const nom=Object.keys(zip.files).find(n=>/\.kml$/i.test(n));
            if(!nom) throw new Error('El KMZ no trae ningún .kml adentro.');
            texto=await zip.file(nom).async('string');
        }else{
            texto=await archivo.text();
        }
        mostrarCarga('Interpretando la red…');
        const nuevos=leerKML(texto);
        if(!nuevos.length){ ocultarCarga(); return alert('No se encontró ningún elemento en el archivo.'); }

        mostrarCarga('Deduciendo qué cliente cuelga de qué caja…');
        enlazarTopologia(nuevos);
        mostrarCarga('Deduciendo por dónde va cada cable…');
        enlazarCables(nuevos);

        // Fusion con lo que ya hay. La llave NO puede ser solo tipo + nombre:
        //  · las 940 reservas se llaman todas "20m" o "30m" → con esa llave
        //    quedaban 6 de 940;
        //  · y en un mismo poste hay VARIAS reservas, una por cada cable que
        //    pasa: se comprobo un poste con 6 reservas de 20m, cada una de un
        //    cable distinto. Por eso entra tambien el cable al que pertenecen.
        // Con tipo + nombre + coordenada + cable sobreviven 6.535 de 6.536.
        const llave=e=>{
            const p=(e.g&&e.g[0])?e.g[0][0].toFixed(6)+','+e.g[0][1].toFixed(6):'?';
            const extra=e.cable||e.subtipo||'';
            return e.tipo+'||'+(e.nombre||'').trim().toLowerCase()+'||'+p+'||'+extra;
        };
        const indice={}; RED.elementos.forEach((e,i)=>{ indice[llave(e)]=i; });
        let act=0, add=0;
        nuevos.forEach(n=>{
            const k=llave(n), i=indice[k];
            if(i!==undefined){
                // Se conserva lo que se editó a mano aquí (splitters y notas)
                const viejo=RED.elementos[i];
                n.id=viejo.id;
                if(viejo.splitters&&viejo.splitters.length) n.splitters=viejo.splitters;
                if(viejo.notas) n.notas=viejo.notas;
                RED.elementos[i]=n; act++;
            }else{ RED.elementos.push(n); indice[k]=RED.elementos.length-1; add++; }
        });

        mostrarCarga('Guardando…');
        const nf=await guardarRed(SEDE.id, RED.elementos);
        ocultarCarga();
        dibujar();
        const cuenta={}; nuevos.forEach(n=>{ const t=claseDe(n); cuenta[t]=(cuenta[t]||0)+1; });
        alert(`✅ Importación terminada — ${SEDE.nombre}\n\n`
            + `• Elementos nuevos: ${add}\n• Actualizados: ${act}\n`
            + `• Total en la sede: ${RED.elementos.length}\n• Fragmentos guardados: ${nf}\n\n`
            + Object.entries(cuenta).sort((a,b)=>b[1]-a[1])
                    .map(([t,n])=>`   ${TIPOS[t]?TIPOS[t].et:t}: ${n}`).join('\n'));
    }catch(e){
        ocultarCarga();
        alert('❌ No se pudo importar:\n\n'+(e.message||e));
        console.error(e);
    }
}

/* ════════════════════════════════════════════════════════════════════

   La foto satelital gratuita (Esri) se acaba en el zoom 18 sobre el

   Se exporta lo que hay AHORA, ya con la ocupacion calculada, que es
   algo que el KML original de OZmap no traia.
   ════════════════════════════════════════════════════════════════════ */
function exportarKML(){

    abrirModal('🌍 Llevar a Google Earth', `

        <div class="opc" data-q="cajas" onclick="elegirExp('cajas')" style="text-align:left;padding:12px">
